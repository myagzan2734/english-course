function words(u){
  const W=allWords(u),mine=W.filter(w=>w.mine).length;
  const head=`<div class="btnrow"><button class="btn ${wordMode==="list"?"pri":""}" data-act="wmode" data-v="list">Liste</button><button class="btn ${wordMode==="card"?"pri":""}" data-act="wmode" data-v="card">Kartlar</button><button class="btn ${wordMode==="quiz"?"pri":""}" data-act="wmode" data-v="quiz">Kelime testi</button></div>
  <p class="m">${learnedCount(u)}/${W.length} öğrenildi (${mine} tanesi senin eklediğin), bugün ${wordsToday()}/${me().goal}</p>`;
  if(wordMode==="card"){const i=fIdx%W.length,w=W[i];
    return head+`<div class="flash" data-act="flip" role="button" tabindex="0" aria-label="Kartı çevir">${w.mine?`<span class="m">Benim kelimem</span>`:""}${fFlip?`<div class="fe">${esc(w.en)}</div><div class="ft">${esc(w.tr)}</div>${w.ex?`<div class="fx">${esc(w.ex)}</div>`:""}`:`<div class="fe">${esc(w.en)}</div><div class="hint">Anlamını görmek için dokun</div>`}</div>
    <div class="btnrow" style="justify-content:space-between"><button class="btn" data-act="fprev">‹ Önceki</button><span style="align-self:center">${i+1} / ${W.length}</span><button class="btn" data-act="fnext">Sonraki ›</button></div>
    <div class="btnrow"><button class="btn" data-act="say" data-t="${esc(w.en+(w.ex?". "+w.ex:""))}">▶ Dinle</button><button class="btn chk" data-act="learn" data-k="${w.k}" aria-pressed="${!!store.learned[w.k]}">${store.learned[w.k]?"✓ Öğrendim":"Öğrendim olarak işaretle"}</button></div>`;}
  if(wordMode==="quiz"){const pool=shuffle(W.slice()).slice(0,Math.min(8,W.length));
    const qs=pool.map(w=>{const others=shuffle([...new Set(W.filter(x=>x.tr!==w.tr).map(x=>x.tr))]).slice(0,2);return[`‘${w.en}’ ne demek?`,[w.tr,...others],0];});
    return head+`<div class="panel" id="wq"><h3>Kelime testi</h3><p class="m">Ünitedeki ve senin eklediğin kelimelerden rastgele ${qs.length} soru.</p>${qHTML(qs,"wq"+u.n)}<div class="btnrow"><button class="btn pri" data-act="checkwq">Kontrol et</button><button class="btn" data-act="retab">Yeni sorular</button></div><div id="wqres"></div></div>`;}
  const form=`<details class="panel"${mine?"":" open"}><summary>Kendi kelimeni ekle</summary>
   <form id="addw" data-n="${u.n}" autocomplete="off" style="margin-top:12px">
   <label class="fl" for="aw-en">İngilizce kelime veya kalıp</label><input class="inp" id="aw-en" maxlength="60" placeholder="ör. look forward to" autocapitalize="none" spellcheck="false">
   <label class="fl" for="aw-tr">Türkçe anlamı</label><input class="inp" id="aw-tr" maxlength="80" placeholder="ör. dört gözle beklemek">
   <label class="fl" for="aw-ex">Örnek cümle (isteğe bağlı)</label><input class="inp" id="aw-ex" maxlength="160" placeholder="ör. I’m looking forward to the holiday.">
   <div class="btnrow"><button class="btn pri" type="submit">Ekle</button></div></form></details>`;
  return head+form+`<div class="panel"><ul class="wlist">${W.map(w=>`<li class="w ${store.learned[w.k]?"done":""}"><div><div class="en">${esc(w.en)} ${w.mine?`<span class="mine">benim</span>`:""}</div><div class="trn">${esc(w.tr)}</div></div><div class="wbtns"><button class="icon" data-act="say" data-t="${esc(w.en+(w.ex?". "+w.ex:""))}" aria-label="Dinle">▶</button><button class="icon chk" data-act="learn" data-k="${w.k}" aria-pressed="${!!store.learned[w.k]}" aria-label="Öğrendim">✓</button>${w.mine?`<button class="icon" data-act="delw" data-n="${u.n}" data-id="${w.id}" aria-label="Sil">🗑</button>`:""}</div>${w.ex?`<div class="ex">${esc(w.ex)}</div>`:""}</li>`).join("")}</ul></div>`;
}
function listening(text,qs,key,title){
  const dlg=/^[A-Z][A-Za-z ]{0,14}:/m.test(text);const last=store.lis[key];
  return `<div class="panel"><h3>${esc(title||"Dinleme")}</h3><p style="color:var(--muted)">Önce soruları oku, sonra metni görmeden dinle. Gerekirse hızı düşür.${last!=null?` Son sonucun: %${Math.round(last*100)}.`:""}</p>
  <div class="player"><button class="btn pri" data-act="play" data-k="${key}">▶ Dinle</button><button class="btn" data-act="stop">■ Durdur</button>
  <div class="speed" role="group" aria-label="Hız">${[[0.7,"Yavaş"],[0.9,"Normal"],[1.05,"Hızlı"]].map(s=>`<button data-act="rate" data-v="${s[0]}" aria-pressed="${rate===s[0]}">${s[1]}</button>`).join("")}</div></div>
  <textarea hidden id="src-${key}" data-dlg="${dlg}">${esc(text)}</textarea>
  <div class="lq" id="lq-${key}">${qHTML(qs,key)}</div>
  <div class="btnrow"><button class="btn pri" data-act="checkl" data-k="${key}">Kontrol et</button><button class="btn" data-act="script" data-k="${key}">Metni göster</button></div><div id="lr-${key}"></div><div class="script" id="sc-${key}" hidden>${esc(text)}</div></div>`;
}
function writing(task,tips,model,key){
  const v=store.text[key]||"";
  return `<div class="panel"><h3>Yazma görevi</h3><p>${esc(task)}</p>${tips?`<ul class="tips">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
  <label for="ta-${key}" style="display:block;margin:12px 0 6px;font-weight:700">Senin metnin</label><textarea id="ta-${key}" data-k="${key}" placeholder="Buraya İngilizce yaz…">${esc(v)}</textarea><div class="wc" id="wc-${key}">${wc(v)} kelime, otomatik kaydedilir</div>
  <details style="margin-top:12px"><summary>Örnek cevabı göster</summary><div class="model">${esc(model)}</div></details></div>`;
}
function exam(k){
  const e=EX[k];setBar(e.t,"home");let n=0;
  const body=e.secs.map((s,si)=>{let h=`<div class="panel"><h3>Bölüm ${si+1}: ${esc(s.t)}</h3>`;
    if(s.text)h+=`<div class="script" style="margin-top:0">${esc(s.text)}</div>`;
    if(s.audio){const dlg=/^[A-Z][A-Za-z ]{0,14}:/m.test(s.audio);h+=`<div class="player"><button class="btn pri" data-act="play" data-k="ex-${k}-${si}">▶ Dinle</button><button class="btn" data-act="stop">■ Durdur</button></div><textarea hidden id="src-ex-${k}-${si}" data-dlg="${dlg}">${esc(s.audio)}</textarea><p style="color:var(--muted);font-size:.9rem;margin-top:8px">En fazla iki kez dinle.</p>`;}
    h+=qHTML(s.qs,"ex"+k,n)+`</div>`;n+=s.qs.length;return h;}).join("");
  return `<section class="hero" style="padding-bottom:0"><h1>${esc(e.t)}</h1><p class="lead">${esc(e.scope)}. ${n} çoktan seçmeli soru + yazma. Önerilen süre ${e.min} dakika. Yazma bölümü otomatik puanlanmaz; örnek cevapla karşılaştır ya da öğretmenine göster.${store.exam[k]!=null?` Son puanın: %${store.exam[k]}.`:""}</p></section>
  <div class="examtop"><span class="timer" id="et" style="font-size:1.6rem">${e.min}:00</span><button class="btn" data-act="etimer" data-v="${e.min}">Süreyi başlat</button></div>
  <div id="exam">${body}</div>
  ${writing(e.wri.task,null,e.wri.m,"ex-"+k).replace("<h3>Yazma görevi</h3>",`<h3>Bölüm ${e.secs.length+1}: Yazma</h3>`)}
  <div class="btnrow"><button class="btn pri" data-act="checkexam" data-k="${k}">Sınavı bitir ve puanla</button><button class="btn" data-act="reexam">Yeniden çöz</button></div><div id="eres"></div>`;
}

/* ===================== ROUTER ===================== */
function route(){
  stopSpeak();clearInterval(timerId);clearInterval(examTimer);
  let h=(location.hash||"#home").slice(1);let html;
  if(!store)h="login";else if(h==="login")h="dashboard";
  const m=h.match(/^unit-(\d{1,2})$/);
  if(m&&U[+m[1]-1]){if(lastUnit!==h){fIdx=0;fFlip=false;wordMode="list";uTab="ozet";}if(pendingTab){uTab=pendingTab;pendingTab=null;}lastUnit=h;html=unit(+m[1]);}
  else{lastUnit=null;
    if(h==="login")html=login();
    else if(EX[h])html=exam(h);
    else if(h==="contents")html=contents();
    else if(h==="dashboard")html=dashboard();
    else if(h==="profile")html=profile();
    else html=home();}
  $("#app").innerHTML=html;window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
function rerenderTab(){const n=+location.hash.match(/unit-(\d+)/)[1];$("#tabc").innerHTML=tabContent(U[n-1]);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===uTab));}
function armed(b,fn){if(b.dataset.armed){fn();return;}const o=b.textContent;b.dataset.armed="1";b.textContent="Emin misin? Tekrar dokun";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o;}},4000);}

document.addEventListener("submit",e=>{if(e.target.id==="loginf"){e.preventDefault();doLogin($("#uname").value);}
  else if(e.target.id==="addw"){e.preventDefault();const n=+e.target.dataset.n,en=$("#aw-en").value.trim(),tr=$("#aw-tr").value.trim(),ex=$("#aw-ex").value.trim();
    if(!en||!tr){toast("İngilizce kelimeyi ve Türkçe anlamını yazmalısın.");return;}
    const u=U[n-1];if(allWords(u).some(w=>w.en.toLocaleLowerCase("en")===en.toLocaleLowerCase("en"))){toast("Bu kelime bu ünitede zaten var.");return;}
    (store.custom[n]=store.custom[n]||[]).push({id:Date.now().toString(36),en,tr,ex});logAct("add",`Ünite ${n}: “${en}” eklendi`,null);
    toast("Kelime eklendi.");rerenderTab();setTimeout(()=>{const i=$("#aw-en");if(i)i.focus();},0);}});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  const curU=()=>U[+location.hash.match(/unit-(\d+)/)[1]-1];
  if(a==="pick")enter(b.dataset.v);
  else if(a==="tab"){uTab=b.dataset.v;stopSpeak();clearInterval(timerId);rerenderTab();b.scrollIntoView({inline:"center",block:"nearest"});}
  else if(a==="goto"){if(b.dataset.u){const h="#unit-"+b.dataset.u;if(location.hash===h){uTab=b.dataset.v;route();}else{pendingTab=b.dataset.v;location.hash=h;}}else location.hash="#"+b.dataset.v;}
  else if(a==="say")speak(b.dataset.t,false);
  else if(a==="stop")stopSpeak();
  else if(a==="play"){const s=document.getElementById("src-"+b.dataset.k);speak(s.value,s.dataset.dlg==="true");}
  else if(a==="rate"){rate=+b.dataset.v;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));}
  else if(a==="script"){const s=document.getElementById("sc-"+b.dataset.k);s.hidden=!s.hidden;b.textContent=s.hidden?"Metni göster":"Metni gizle";}
  else if(a==="checkl"){const k=b.dataset.k;const r=grade(document.getElementById("lq-"+k));store.lis[k]=r.c/r.t;logAct("lis",`Ünite ${k.slice(3)} listening`,`${r.c}/${r.t}`);
    document.getElementById("lr-"+k).innerHTML=`<div class="result">${r.c}/${r.t} doğru</div>`;b.disabled=true;}
  else if(a==="wmode"){wordMode=b.dataset.v;fFlip=false;rerenderTab();}
  else if(a==="flip"){fFlip=!fFlip;rerenderTab();}
  else if(a==="fnext"){const u=curU();fIdx=(fIdx+1)%allWords(u).length;fFlip=false;rerenderTab();}
  else if(a==="fprev"){const u=curU();fIdx=(fIdx-1+allWords(u).length)%allWords(u).length;fFlip=false;rerenderTab();}
  else if(a==="learn"){const k=b.dataset.k;if(store.learned[k])delete store.learned[k];else{store.learned[k]=dkey();bump();
      const g=me().goal;if(wordsToday()===g)toast(`Günlük hedefine ulaştın: ${g} kelime! 🎉`);}save();rerenderTab();}
  else if(a==="delw")armed(b,()=>{const n=+b.dataset.n,id=b.dataset.id;store.custom[n]=(store.custom[n]||[]).filter(w=>w.id!==id);delete store.learned["c"+n+"-"+id];save();toast("Kelime silindi.");rerenderTab();});
  else if(a==="checkwq"){const u=curU();const r=grade($("#wq"));logAct("wq",`Ünite ${u.n} kelime testi`,`${r.c}/${r.t}`);$("#wqres").innerHTML=`<div class="result">${r.c}/${r.t} doğru</div>`;b.disabled=true;}
  else if(a==="checkquiz"){const u=curU();const r=grade($("#quiz"));store.quiz[u.n]=r.c;logAct("quiz",`Ünite ${u.n} testi`,`${r.c}/${r.t}`);$("#qres").innerHTML=`<div class="result">${r.c}/${r.t} doğru</div><p>${verdict(r.c/r.t*100)}</p>`;b.disabled=true;}
  else if(a==="retab"){rerenderTab();}
  else if(a==="timer"){clearInterval(timerId);let s=60;const el=$("#tm");el.textContent="1:00";b.textContent="Yeniden başlat";
    timerId=setInterval(()=>{s--;el.textContent=`0:${String(Math.max(s,0)).padStart(2,"0")}`;if(s<=0){clearInterval(timerId);el.textContent="Süre doldu";}},1000);}
  else if(a==="etimer"){clearInterval(examTimer);let s=+b.dataset.v*60;const el=$("#et");b.textContent="Yeniden başlat";
    examTimer=setInterval(()=>{s--;const m=Math.floor(Math.max(s,0)/60),ss=Math.max(s,0)%60;el.textContent=`${m}:${String(ss).padStart(2,"0")}`;if(s<=0){clearInterval(examTimer);el.textContent="Süre doldu";}},1000);}
  else if(a==="checkexam"){const k=b.dataset.k;const r=grade($("#exam"));const p=Math.round(r.c/r.t*100);store.exam[k]=p;logAct("exam",EX[k].t,`%${p}`);clearInterval(examTimer);stopSpeak();
    $("#eres").innerHTML=`<div class="panel"><div class="result">${r.c}/${r.t} doğru (%${p})</div><p>${verdict(p)}${r.empty?` Boş bıraktığın soru: ${r.empty}.`:""}</p><p style="color:var(--muted)">Yeşil işaretli seçenekler doğru cevaplardır. Sonuç Dashboard’a kaydedildi.</p><a class="btn" href="#dashboard">Dashboard’a git</a></div>`;
    b.disabled=true;$("#eres").scrollIntoView({behavior:"smooth",block:"start"});}
  else if(a==="reexam")route();
  else if(a==="avatar"){me().avatar=b.dataset.v;save();route();}
  else if(a==="goal"){me().goal=+b.dataset.v;save();route();}
  else if(a==="logout"){DB.current=null;bind();save();location.hash="#login";route();}
  else if(a==="reset")armed(b,()=>{me().data=blank();bind();save();toast("İlerleme sıfırlandı.");route();});
  else if(a==="delete")armed(b,()=>{delete DB.users[DB.current];DB.current=null;bind();save();toast("Profil silindi.");location.hash="#login";route();});
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.act==="flip"){e.preventDefault();e.target.click();}});
document.addEventListener("change",e=>{if(e.target.id==="examdate"){me().examDate=e.target.value;save();toast("Sınav tarihi kaydedildi.");}});
document.addEventListener("input",e=>{const t=e.target;if(t.tagName==="TEXTAREA"&&t.dataset.k&&store){const k=t.dataset.k;store.text[k]=t.value;
  const n=wc(t.value),dk=k+"@"+dkey();
  if(n>=20&&!store.wlog[dk]){store.wlog[dk]=1;const lbl=k.startsWith("u")?`Ünite ${k.slice(1)} writing`:`${EX[k.slice(3)].t} yazma`;logAct("write",lbl,null);}else save();
  const w=document.getElementById("wc-"+k);if(w)w.textContent=n+" kelime, otomatik kaydedilir";}});
route();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}</script>
</body>
</html>
