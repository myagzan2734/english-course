<!DOCTYPE html>
<html lang="tr">
<head>

<style>
:root{
  --paper:#F3F5FA;--card:#FFFFFF;--ink:#17203B;--muted:#56607E;--line:#D9DFEB;
  --hl:#FFD84D;--hl-ink:#17203B;--teal:#0F7570;--teal-soft:#DFF1EF;--coral:#B4413A;--coral-soft:#FBE6E3;
  --head:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1327;--card:#161D38;--ink:#E7EAF4;--muted:#9AA3C1;--line:#2A3357;
    --hl:#E8C33A;--hl-ink:#131830;--teal:#4CC2BA;--teal-soft:#14333A;--coral:#F0857A;--coral-soft:#3A1D23;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1327;--card:#161D38;--ink:#E7EAF4;--muted:#9AA3C1;--line:#2A3357;
  --hl:#E8C33A;--hl-ink:#131830;--teal:#4CC2BA;--teal-soft:#14333A;--coral:#F0857A;--coral-soft:#3A1D23;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800}
h2{font-size:1.45rem;font-weight:700;margin-top:1.6em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 64px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px;min-height:54px}
.bar .back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;text-decoration:none;color:var(--ink);font-weight:700;font-size:.95rem}
.bar .ttl{font-family:var(--head);font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);color:inherit;padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lead{color:var(--muted);font-size:1.05rem;max-width:60ch}
.hero{padding:28px 0 8px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:16px 0 4px}
.stat b{display:block;font-family:var(--head);font-size:1.7rem;font-weight:800;line-height:1}
.stat span{color:var(--muted);font-size:.9rem}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;position:relative;min-height:132px}
.tile:hover{border-color:var(--teal)}
.tile .num{font-family:var(--head);font-weight:800;font-size:2.6rem;line-height:.9;color:var(--ink)}
.tile .nm{font-family:var(--head);font-weight:700;font-size:1.1rem;margin-top:6px}
.tile .tr{color:var(--muted);font-size:.88rem}
.prog{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);border-radius:3px}
.badge{position:absolute;top:12px;right:12px;font-size:.78rem;font-weight:700;background:var(--hl);color:var(--hl-ink);border-radius:6px;padding:2px 7px}
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.exam-t{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.exam-t .tr{color:var(--paper);opacity:.75}
.exam-t .nm{font-size:1.25rem;margin-top:0}
.exam-t .badge{background:var(--hl)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:8px -18px 6px;padding-left:18px;padding-right:18px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);background:var(--paper);z-index:4;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:.93rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.uhead{display:flex;align-items:flex-end;gap:14px;padding:22px 0 4px}
.uhead .big{font-family:var(--head);font-weight:800;font-size:4.2rem;line-height:.8}
.uhead h1{margin:0}
.uhead .tr{color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.panel h3{margin-top:0}
.lesson{display:grid;grid-template-columns:48px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.lesson:first-of-type{border-top:0}
.lesson .c{font-family:var(--head);font-weight:800;color:var(--teal)}
.lesson .m{color:var(--muted);font-size:.93rem}
.wlist{list-style:none;padding:0;margin:0}
.w{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line)}
.w:first-child{border-top:0}
.w .en{font-weight:700;font-size:1.05rem}
.w .trn{color:var(--muted)}
.w .ex{font-style:italic;grid-column:1/-1;font-size:.95rem}
.w.done .en{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%)}
.icon{border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;font-size:1rem}
.wbtns{display:flex;gap:6px;align-items:start}
.chk[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.flash{background:var(--card);border:2px solid var(--ink);border-radius:18px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;user-select:none}
.flash .fe{font-family:var(--head);font-weight:800;font-size:2rem}
.flash .ft{font-size:1.25rem;margin-top:8px}
.flash .fx{font-style:italic;color:var(--muted);margin-top:8px}
.flash .hint{color:var(--muted);font-size:.85rem;margin-top:14px}
.formula{font-family:var(--head);font-weight:700;background:var(--teal-soft);border-radius:8px;padding:8px 12px;display:inline-block;margin:4px 0 10px}
.exs{list-style:none;padding:0;margin:0}
.exs li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.exs li:first-child{border-top:0}
.exs .icon{width:32px;height:32px;flex:0 0 auto;font-size:.85rem}
.q{border:0;padding:12px 0;margin:0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q legend{font-weight:700;padding:0;margin-bottom:8px;display:flex;gap:8px}
.qn{font-family:var(--head);color:var(--teal);min-width:1.4em}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);margin:0 2px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;background:var(--card)}
.opt input{accent-color:var(--teal);width:18px;height:18px;margin:0}
.opt.ok{background:var(--teal-soft);border-color:var(--teal)}
.opt.ok::after{content:"✓";margin-left:auto;color:var(--teal);font-weight:800}
.opt.bad{background:var(--coral-soft);border-color:var(--coral)}
.opt.bad::after{content:"✗";margin-left:auto;color:var(--coral);font-weight:800}
.result{font-family:var(--head);font-weight:800;font-size:1.5rem;margin:10px 0}
.player{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.speed{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.speed button{border:0;background:var(--card);padding:8px 12px;cursor:pointer;font-weight:700}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.script{white-space:pre-line;background:var(--paper);border-radius:10px;padding:12px 14px;margin-top:12px;border:1px solid var(--line)}
textarea{width:100%;min-height:180px;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
.wc{color:var(--muted);font-size:.9rem;margin-top:4px}
.model{background:var(--paper);border-left:4px solid var(--hl);border-radius:6px;padding:12px 14px;margin-top:10px;white-space:pre-line}
.tips{margin:0;padding-left:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.95rem}
.timer{font-family:var(--head);font-weight:800;font-size:2.2rem}
.prompt{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.prompt:first-child{border-top:0}
.prompt .qn{flex:0 0 auto}
.contents-u{margin-top:22px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.95rem;z-index:20;max-width:90vw}
.examtop{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);background:var(--paper);z-index:4;padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.note{color:var(--muted);font-size:.88rem;margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
.bar .sp{flex:1}
.hbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:38px;display:inline-grid;place-items:center;text-decoration:none;font-size:1.15rem;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.avc{font-size:1.5rem;padding:4px 10px}
.btn.danger{color:var(--coral);border-color:var(--coral)}
.phead{display:flex;gap:16px;align-items:center}
.bigav{font-size:3.6rem;line-height:1;width:76px;height:76px;display:grid;place-items:center;background:var(--card);border:2px solid var(--ink);border-radius:50%;flex:0 0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{font-family:var(--head);font-size:1.8rem;font-weight:800;display:block;line-height:1.1}
.kpi span{color:var(--muted);font-size:.88rem}
.kpi.hot{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.kpi.hot span{color:var(--hl-ink);opacity:.85}
.urow{display:grid;grid-template-columns:2.2em 1fr 3.4em;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.urow:first-of-type{border-top:0}
.urow .n{font-family:var(--head);font-weight:800;font-size:1.3rem}
.urow .meta{color:var(--muted);font-size:.84rem}
.urow .prog{margin-top:6px}
.pct{font-family:var(--head);font-weight:800;text-align:right}
.act{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.act:first-of-type{border-top:0}
.act .when{color:var(--muted);font-size:.85rem;margin-left:auto;white-space:nowrap}
.inp{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;max-width:340px}
.m{color:var(--muted);font-size:.9rem}
.fl{display:block;font-weight:700;margin:10px 0 4px}
.mine{font-size:.72rem;font-weight:700;background:var(--teal-soft);color:var(--teal);border-radius:5px;padding:1px 6px;vertical-align:middle}
.next{border:2px solid var(--ink)}
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--teal)}.chart .t{fill:var(--hl)}.chart .z{fill:var(--line)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
details summary{cursor:pointer;font-weight:700;color:var(--teal)}
@media (prefers-reduced-motion:no-preference){.flash{transition:transform .15s}.flash:active{transform:scale(.98)}}
</style>
</head>

<script>
/* ===================== DATA ===================== */
const U=[
{n:1,t:"Life",tr:"Yaşam",
lessons:[["1.1","Feeling good?","Question forms","Free time"],["1.2","True love","Past simple","Relationships"],["1.3","Nice day, isn’t it?","Making conversation","Conversation topics"],["1.4","Miranda","BBC video dersi","Önemli insanlar, en iyi arkadaş"]],
sum:"İlk ünite kişisel hayat, mutluluk, boş zaman ve ilişkiler üzerine. Soru kurmayı (yardımcı fiil + özne), geçmiş zamanı (past simple) ve -ed sonlarının telaffuzunu çalışırsın. 1.3’te tanımadığın biriyle sohbet başlatma kalıplarını öğrenir, ünite sonunda en iyi arkadaşını ve hayatındaki önemli bir yılı yazarsın.",
words:[["hang out (with)","takılmak, vakit geçirmek","I usually hang out with my friends at the weekend."],["get on well with","biriyle iyi anlaşmak","I get on well with my sister."],["fall in love (with)","âşık olmak","They fell in love on holiday in Spain."],["go out with","biriyle çıkmak","He went out with Maria for two years."],["get married","evlenmek","My parents got married in 1998."],["split up","ayrılmak (çift)","They split up after a big argument."],["propose","evlenme teklif etmek","He proposed to her on top of a mountain."],["meet up (with)","buluşmak","Let’s meet up for coffee after class."],["chat online","internette sohbet etmek","I chat online with my cousin in Germany."],["relax","dinlenmek, rahatlamak","I relax by listening to music."],["colleague","iş arkadaşı","My colleagues are very friendly."],["anniversary","yıl dönümü","Today is our tenth wedding anniversary."],["happiness","mutluluk","Money doesn’t always bring happiness."],["free time","boş zaman","What do you do in your free time?"]],
gram:[{t:"Question forms (Soru yapıları)",e:"Soru sorarken yardımcı fiil (do/does/did, have, can…) özneden önce gelir. ‘be’ fiilinde be öznenin önüne geçer. Soru kelimesi (Where, What, How often…) en başta durur.",f:"(Wh-) + yardımcı fiil + özne + fiil?",ex:["Where do you live?","What did you do last weekend?","Are you happy at work?","How often does she go to the gym?"]},
{t:"Past simple (Geçmiş zaman)",e:"Geçmişte başlayıp bitmiş eylemler için. Düzenli fiillere -ed eklenir (worked), düzensiz fiillerin 2. hâli kullanılır (went, saw). Olumsuz ve soruda ‘did’ gelir, fiil yalın hâline döner. Telaffuz: worked /t/, played /d/, wanted /ɪd/.",f:"I worked. / I didn’t work. / Did you work?",ex:["We met at university in 2015.","She didn’t call me yesterday.","Did they get married last year?","I went to Paris and saw the Eiffel Tower."]}],
phr:{t:"Making conversation (Sohbet başlatma)",items:["Nice day, isn’t it?","Where are you from?","What do you do?","How was your weekend?","Really? That sounds great!","Have you got any plans for the summer?","It was nice talking to you."]},
lis:{t:"How Tom and Anna met",text:"Tom and Anna met twelve years ago at a friend’s party. Tom was very shy and didn’t say much, but Anna thought he was funny. A week later they met up for coffee and talked for four hours. They went out together for three years. Then Tom decided to propose. He took Anna to the beach where they had their first holiday and asked her to marry him. She said yes immediately! They got married the next summer, and now they have two children and a dog called Biscuit.",
q:[["Where did Tom and Anna meet?",["At a friend’s party","On a beach","At university"],0],["How long did they go out before Tom proposed?",["Three years","One year","Twelve years"],0],["What is the dog’s name?",["Biscuit","Cookie","Toby"],0]]},
spk:{p:["What makes you happy? Give three examples.","Tell your partner how you met your best friend.","What did you do last weekend? Ask your partner three questions too.","Who is the most important person in your life? Why?"],m:"I think small things make me happy. For example, I love having breakfast with my family on Sunday mornings. I also feel happy when I hang out with my friends by the sea. And finally, I love finishing a good book. What about you? What makes you happy?"},
wri:{task:"Hayatındaki önemli bir yılı anlat (100–120 kelime). Bağlaçları kullan: because, so, but, although, then, after that.",tips:["Yılı ve neden önemli olduğunu ilk cümlede söyle.","Olayları sırayla anlat (In January… Then… In December…).","Past simple kullan; düzensiz fiillere dikkat et."],m:"2019 was a very important year for me. In January, I started university in Ankara, so I moved away from my family for the first time. At first I felt lonely because I didn’t know anyone. However, after a few weeks I met two great friends, and we started to hang out every evening. In the summer, I got my first part-time job in a café. It was hard work, but I learned a lot and saved some money. Then, in December, I travelled abroad for the first time. Although it was only a short trip, it changed the way I see the world."},
quiz:[["___ do you live? — In Izmir.",["Where","What","Who"],0],["___ you go out last night?",["Did","Do","Were"],0],["She ___ to London in 2020.",["moved","moves","move"],0],["I ___ well with my brother. We never argue.",["get on","get up","go out"],0],["They ___ up after five years together.",["split","broke in","went"],0],["Nice day, ___ it?",["isn’t","is","doesn’t"],0]]},

{n:2,t:"Work",tr:"İş",
lessons:[["2.1","The company 4U?","Present simple and continuous","Work"],["2.2","A risky business","Adverbs of frequency","Jobs"],["2.3","I like working outside","Expressing likes/dislikes","Types of work"],["2.4","Dream Commuters","BBC video dersi","İş-yaşam dengesi"]],
sum:"İş dünyası, meslekler ve iş-yaşam dengesi. Geniş zaman ile şimdiki zamanın farkını, sıklık zarflarını (always, usually…) ve sevdiğin/sevmediğin şeyleri anlatma kalıplarını öğrenirsin. Tehlikeli meslekler hakkında konuşur, iş deneyimini anlatan bir e-posta yazarsın.",
words:[["employee","çalışan","The company has 200 employees."],["boss","patron, amir","My boss is very understanding."],["salary","maaş","She earns a good salary."],["full-time / part-time","tam zamanlı / yarı zamanlı","I have a part-time job at weekends."],["commute","işe gidip gelmek","I commute to work by train every day."],["deadline","son teslim tarihi","We have a deadline on Friday."],["apply for","başvurmak","He applied for a job in a bank."],["overtime","fazla mesai","I worked overtime last week."],["promotion","terfi","She got a promotion after two years."],["firefighter","itfaiyeci","Firefighters have a dangerous job."],["dangerous","tehlikeli","Fishing is one of the most dangerous jobs."],["work from home","evden çalışmak","I work from home on Mondays."],["work-life balance","iş-yaşam dengesi","A good work-life balance is important."],["motivate","motive etmek","Interesting projects motivate me."]],
gram:[{t:"Present simple vs present continuous",e:"Present simple: rutinler, alışkanlıklar, genel gerçekler. Present continuous: şu an olan ya da geçici durumlar (this week, at the moment). ‘like, know, want, need’ gibi durum fiilleri genelde -ing almaz.",f:"I work… / I’m working at the moment…",ex:["I work in a bank.","At the moment I’m working on a new project.","She usually takes the bus, but this week she’s driving.","I know the answer."]},
{t:"Adverbs of frequency (Sıklık zarfları)",e:"always (her zaman) › usually › often › sometimes › rarely › never. Ana fiilden önce, ‘be’ fiilinden sonra gelir.",f:"I often work late. / He is never late.",ex:["I often work late on Thursdays.","He is never late for meetings.","How often do you travel for work?","We rarely have long meetings."]}],
phr:{t:"Likes and dislikes (Sevdiklerin)",items:["I really love working with people.","I’m keen on working outside.","I quite like my job.","I don’t mind working at weekends.","I’m not very keen on meetings.","I can’t stand sitting at a desk all day.","Me too! / Really? I don’t."]},
lis:{t:"An interview with a nurse",text:"My name’s Elif and I’m a nurse in a big hospital in Izmir. I usually work long shifts, sometimes twelve hours. I often work at night, which is difficult, but I love helping people. At the moment I’m studying for a special course in emergency care, so this month I’m working part-time. The salary isn’t fantastic, but my colleagues are wonderful and every day is different. I can’t stand paperwork, though!",
q:[["Where does Elif work?",["In a hospital in Izmir","In a school in Izmir","In a hotel in Ankara"],0],["Why is she working part-time this month?",["She’s studying for a course","She’s ill","She’s on holiday"],0],["What does she dislike?",["Paperwork","Night shifts","Her colleagues"],0]]},
spk:{p:["What motivates you at work or at school?","Describe a dangerous job. Would you like to do it? Why/why not?","Do you prefer working inside or outside? Alone or in a team?","Describe your work-life balance. What would you like to change?"],m:"I’m a student, so my ‘work’ is studying. I usually study for about four hours a day. At the moment I’m preparing for my exams, so I’m studying more than normal. I don’t mind working alone, but I really love working in a team because it’s more fun. I can’t stand studying late at night – I’m always too tired!"},
wri:{task:"Bir yaz işi ilanına başvuran bir e-posta yaz ve iş deneyimini anlat (100–120 kelime).",tips:["Selamlama: Dear Sir or Madam, / Dear Ms Brown,","Neden yazdığını söyle: I’m writing to apply for…","Deneyimini present simple / past simple ile anlat.","Kapanış: I look forward to hearing from you. / Best regards,"],m:"Dear Ms Brown,\n\nI’m writing to apply for the job of waiter at your summer café. I’m twenty years old and I’m studying tourism at university.\n\nLast summer I worked part-time in a hotel restaurant for three months. I served customers, took orders and sometimes helped in the kitchen. I really enjoyed working with people, and I don’t mind working long hours or at weekends. At the moment I’m also taking an English course, so I can speak to foreign visitors.\n\nI’m friendly, hard-working and always on time. I look forward to hearing from you.\n\nBest regards,\nCan Demir"},
quiz:[["Right now, I ___ an email to my boss.",["am writing","write","writes"],0],["She ___ to work by bus every day.",["goes","is going","go"],0],["He is ___ late for work. He’s very punctual.",["never","ever","often"],0],["I can’t stand ___ in an office.",["working","work","to working"],0],["A person who travels to work every day ___.",["commutes","promotes","applies"],0],["The money you earn every month is your ___.",["salary","deadline","overtime"],0]]},

{n:3,t:"Time out",tr:"Boş zaman",
lessons:[["3.1","Free in NYC","Present continuous / be going to (future)","Time out"],["3.2","Relax!","Questions without auxiliaries","Places to visit"],["3.3","Can I take a message?","Making a phone call","Collocations"],["3.4","Rio de Janeiro","BBC video dersi","Mükemmel bir gün planı"]],
sum:"Şehirde boş zaman, etkinlikler ve gelecek planları. Gelecekteki ayarlanmış planlar için present continuous, niyetler için be going to kullanırsın. Öznesi soru kelimesi olan soruları (Who called you?) ve telefonda konuşma kalıplarını öğrenirsin. Ünite bir davet e-postası yazarak biter.",
words:[["exhibition","sergi","There’s a photography exhibition at the gallery."],["art gallery","sanat galerisi","We spent the afternoon at an art gallery."],["street market","sokak pazarı","I bought this bag at a street market."],["theme park","eğlence parkı","The kids loved the theme park."],["sightseeing","gezip görme","We did some sightseeing in the old town."],["book a table","masa ayırtmak","I booked a table for eight o’clock."],["take a break","mola vermek","Let’s take a break and get a coffee."],["chill out","kafa dinlemek","I just want to chill out this weekend."],["leave a message","mesaj bırakmak","Can I leave a message for Mr Brown?"],["call back","geri aramak","I’ll call you back in ten minutes."],["hang up","telefonu kapatmak","Don’t hang up! I need to tell you something."],["get through","(telefonla) ulaşabilmek","I called the bank but couldn’t get through."],["concert","konser","Are you going to the concert on Saturday?"],["nightlife","gece hayatı","The city has amazing nightlife."]],
gram:[{t:"Future: present continuous & be going to",e:"Present continuous: zamanı/yeri belli, ayarlanmış planlar (randevu, bilet alınmış). Be going to: niyetler ve kararlar. Türkçedeki ‘-ecek’ için ikisi de kullanılabilir; fark plan ne kadar kesin olduğunda.",f:"I’m meeting… / I’m going to + fiil",ex:["I’m meeting Ali at seven tonight.","We’re going to visit Rome next summer.","Are you doing anything on Friday?","I’m not going to stay at home this weekend."]},
{t:"Questions without auxiliaries (Özne soruları)",e:"Who / What / Which sorunun öznesiyse do/does/did kullanılmaz; fiil olumlu cümledeki gibi çekilir. Karşılaştır: Who called you? (arayan kim?) / Who did you call? (sen kimi aradın?)",f:"Who + fiil(-s/-ed)…?",ex:["Who called you?","What happened at the party?","Which band plays tonight?","Who did you meet at the party?"]}],
phr:{t:"Making a phone call (Telefonda)",items:["Hello, can I speak to Mr Brown, please?","Speaking.","Who’s calling, please?","I’m afraid she’s not here at the moment.","Can I take a message?","Could you ask him to call me back?","I’ll call back later."]},
lis:{t:"What’s on this weekend",text:"Welcome to What’s On. This weekend there’s lots to do in the city. On Saturday morning, the street market in the old town opens at nine – it’s the perfect place to buy cheap clothes and try local food. In the afternoon, a new exhibition of modern art is opening at the City Gallery, and entry is free. If you prefer music, the jazz band Blue Notes is playing at the Park Theatre on Saturday night. Tickets cost twenty pounds. And on Sunday? It’s going to be sunny, so why not chill out in Central Park?",
q:[["What time does the market open?",["At nine","At ten","At eight"],0],["How much does the exhibition cost?",["It’s free","£20","£10"],0],["What’s the weather going to be like on Sunday?",["Sunny","Rainy","Cold"],0]]},
spk:{p:["What are you doing this weekend? Tell your partner your arrangements.","What are you going to do next summer?","How do people spend their free time in your country?","Plan a perfect day out in your city. Where are you going to go?"],m:"This weekend I’m quite busy. On Saturday morning I’m playing football with my friends, and in the evening I’m having dinner with my cousins. On Sunday I’m not going to do much – I’m going to chill out at home and maybe watch a film. Next summer I’m going to visit Antalya with my family."},
wri:{task:"Bir arkadaşını bir etkinliğe davet eden e-posta yaz (80–100 kelime): ne, nerede, ne zaman, neden gelmeli?",tips:["Samimi selam: Hi Sara,","Soru ile başla: Are you free on…?","Planı present continuous ile anlat.","Cevap iste: Let me know by…"],m:"Hi Sara,\n\nAre you free on Saturday evening? I’m going to the Blue Notes concert at the Park Theatre and I’ve got an extra ticket. It starts at 8 p.m.\n\nWe could have dinner before the concert – I know a great Italian restaurant near the theatre. I’m booking a table for 6.30, so we have lots of time.\n\nLet me know by Thursday if you can come!\n\nSee you soon,\nDeniz"},
quiz:[["We ___ dinner with my parents tonight. It’s all arranged.",["are having","have","had"],0],["Who ___ the window? — Tom did.",["broke","did break","did broke"],0],["Who ___ you meet at the party?",["did","does","was"],0],["Can I ___ a message?",["take","do","make"],0],["I couldn’t ___ through. The line was busy.",["get","go","put"],0],["Next year I ___ learn to drive.",["’m going to","going","will to"],0]]},

{n:4,t:"Great minds",tr:"Parlak zihinler",
lessons:[["4.1","Hidden talent","Present perfect + ever/never","Make and do"],["4.2","Schools of thought","Can, have to, must","Education"],["4.3","What should I do?","Giving advice","Language learning"],["4.4","Inventions","BBC video dersi","İcatlar"]],
sum:"Yetenekler, eğitim ve öğrenme. Deneyimleri anlatmak için present perfect (Have you ever…?), kurallar ve zorunluluklar için can / have to / must, tavsiye vermek için should ve If I were you kalıplarını çalışırsın. make ve do ile kurulan kalıpları ayırt etmek bu ünitenin kelime odağıdır.",
words:[["make a mistake","hata yapmak","Don’t worry if you make a mistake."],["make progress","ilerleme kaydetmek","You’re making good progress in English."],["make a decision","karar vermek","I need to make a decision about my future."],["do homework","ödev yapmak","I do my homework after dinner."],["do research","araştırma yapmak","Scientists do research in labs."],["do your best","elinden geleni yapmak","Just do your best in the exam."],["talent","yetenek","She has a talent for music."],["invention","icat","The wheel is a very old invention."],["pass / fail an exam","sınavı geçmek / kalmak","I passed my driving test the first time."],["revise","(sınava) tekrar çalışmak","I’m revising for my exams."],["strict","katı, sert","My teacher was very strict."],["uniform","üniforma","We had to wear a uniform at school."],["degree","üniversite diploması","She has a degree in engineering."],["memorise","ezberlemek","I memorise ten new words every day."]],
gram:[{t:"Present perfect + ever / never",e:"Hayatın boyunca yaşadığın (ya da yaşamadığın) deneyimler, zaman belirtmeden. have/has + fiilin 3. hâli (V3). Zaman ya da detay verirsen past simple’a geçersin.",f:"Have you ever + V3? / I’ve never + V3",ex:["Have you ever won a prize?","I’ve never been to Japan.","She has written two books.","Yes, I have. I met a footballer in 2019."]},
{t:"Can, have to, must",e:"can: mümkün/izinli · can’t: izin yok · have to: gerekli (çoğu zaman dışarıdan gelen kural) · don’t have to: gerekli değil · must: güçlü zorunluluk · mustn’t: yasak. Dikkat: don’t have to ≠ mustn’t!",f:"You have to… / You don’t have to… / You mustn’t…",ex:["You have to wear a uniform.","We don’t have to go to school on Saturdays.","You mustn’t use your phone in the exam.","Can we leave early today?"]}],
phr:{t:"Giving advice (Tavsiye)",items:["You should listen to podcasts.","You shouldn’t translate every word.","Why don’t you keep a vocabulary notebook?","If I were you, I’d find a speaking partner.","Try reading simple books.","It’s a good idea to revise every week."]},
lis:{t:"Tips for language learners",text:"Hi, I’m Mark and I teach English online. Students often ask me how to learn faster. My first tip: you should listen to English every day, even for ten minutes. Podcasts are great for this. Second, why don’t you keep a vocabulary notebook? Write the new word, a translation and an example sentence. Third, don’t be afraid of making mistakes – everyone makes them. And finally, if I were you, I’d find a speaking partner. Practise together once a week and you’ll make fast progress.",
q:[["How long should you listen to English every day?",["At least ten minutes","An hour","Two hours"],0],["What should you write in the notebook?",["The word, a translation and an example","The word and a picture","Only the translation"],0],["How often should you meet a speaking partner?",["Once a week","Every day","Once a month"],0]]},
spk:{p:["Have you got a hidden talent? Have you ever won anything?","What did you have to do at school? What couldn’t you do?","Give advice to a friend who wants to learn English quickly.","What is the most important invention in your opinion? Why?"],m:"I think my hidden talent is cooking. I’ve never studied it, but I’ve cooked for twenty people at a family party! At school we had to wear a uniform and we couldn’t use our phones in class. My advice for learning English: you should watch series with English subtitles, and if I were you, I’d learn ten words every day."},
wri:{task:"Bir forumda ‘Dünyayı değiştiren en önemli icat’ başlığına gönderi yaz (100–120 kelime). Sonunda yazını kontrol et: yazım, zaman, kelime sırası.",tips:["Görüşünü ilk cümlede söyle.","İki-üç neden ver (First, … Also, … Finally, …).","Present perfect kullan: It has changed…","Kontrol listesi: büyük harf, -s takısı, düzensiz fiiller."],m:"In my opinion, the most important invention is the smartphone. It has changed the way we live in just a few years.\n\nFirst, it helps us keep in touch with people all over the world. I can talk to my cousin in Canada every week for free. Also, we can learn almost anything with it – I’ve learned a lot of English from apps and videos. Finally, it’s a camera, a map and a bank in your pocket.\n\nOf course, there are problems too. Some people can’t stop looking at their phones. But I still think it’s the invention that has made the biggest difference."},
quiz:[["Have you ever ___ to Italy?",["been","went","go"],0],["I ___ never eaten sushi.",["have","has","did"],0],["You ___ smoke in the hospital. It’s forbidden.",["mustn’t","don’t have to","can"],0],["It’s Sunday, so I ___ get up early.",["don’t have to","mustn’t","can’t to"],0],["I always ___ my homework before dinner.",["do","make","take"],0],["If I ___ you, I’d study every day.",["were","am","be"],0]]},

{n:5,t:"Travel",tr:"Seyahat",
lessons:[["5.1","Fantastic film trips","Past simple and past continuous","Transport"],["5.2","Travel tips","Verb patterns","Travel items"],["5.3","You can’t miss it","Asking for/giving directions","Tourism"],["5.4","Full Circle","BBC video dersi","Bir ödül için fikir sunma"]],
sum:"Yolculuklar, ulaşım ve turizm. Bir hikâye anlatırken arka planı past continuous, araya giren olayı past simple ile anlatırsın. Fiil kalıplarını (want to / enjoy -ing) ve yol tarifi sorma-verme kalıplarını öğrenirsin. Ünitede bir anı anlatır, bir gezini e-postayla yazarsın.",
words:[["journey","yolculuk","The journey took six hours."],["platform","peron","The train leaves from platform 4."],["ferry","feribot","We took the ferry to the island."],["passport","pasaport","Don’t forget your passport!"],["suitcase","bavul","My suitcase is too heavy."],["sun cream","güneş kremi","Put on some sun cream – it’s hot."],["guidebook","rehber kitap","The guidebook recommends this restaurant."],["delay","rötar, gecikme","There’s a two-hour delay on our flight."],["souvenir","hediyelik eşya","I bought a souvenir for my mum."],["go straight on","dümdüz gitmek","Go straight on for 200 metres."],["turn left / right","sola / sağa dönmek","Turn left at the traffic lights."],["opposite","karşısında","The bank is opposite the post office."],["landmark","simge yapı","The Galata Tower is a famous landmark."],["get lost","kaybolmak","We got lost in the old town."]],
gram:[{t:"Past simple & past continuous",e:"Past continuous (was/were + -ing): geçmişte devam eden, arka plandaki uzun eylem. Past simple: onu bölen kısa eylem. ‘while’ genelde uzun eylemle, ‘when’ kısa eylemle kullanılır.",f:"I was walking when it started to rain.",ex:["I was walking to the station when it started to rain.","While we were waiting, a man asked for directions.","What were you doing at 8 p.m. last night?","The sun was shining and people were swimming."]},
{t:"Verb patterns (Fiil kalıpları)",e:"Bazı fiillerden sonra to + fiil gelir: want, decide, hope, plan, need, would like. Bazılarından sonra -ing gelir: enjoy, love, hate, finish, avoid, don’t mind.",f:"want to go / enjoy going",ex:["I want to visit Peru one day.","We enjoy travelling by train.","She decided to take a taxi.","I don’t mind sitting at the back."]}],
phr:{t:"Directions (Yol tarifi)",items:["Excuse me, how do I get to the museum?","Is it far from here?","Go straight on and take the second right.","It’s on your left.","It’s next to the bank, opposite the park.","You can’t miss it."]},
lis:{t:"The lost passport",text:"Last summer my friend and I were travelling around Greece by ferry. One evening we were sitting in a café on a small island when I realised that my passport wasn’t in my bag! We ran back to the port. It was getting dark and the last ferry was leaving. Suddenly, a woman came towards us. She was holding my passport! I left it on the ticket desk. We said thank you about a hundred times and caught the ferry just in time.",
q:[["How were they travelling around Greece?",["By ferry","By train","By plane"],0],["Where did the speaker leave the passport?",["On the ticket desk","In the café","In the hotel"],0],["Did they catch the last ferry?",["Yes, just in time","No, they missed it","They took the next day’s ferry"],0]]},
spk:{p:["Tell an anecdote about a journey that went wrong. What were you doing when…?","What do you always take with you when you travel?","Give directions from your home to the nearest café.","Describe your dream trip. Where do you want to go?"],m:"Two years ago I was travelling to Bursa by bus. We were driving through the mountains when it started to snow. The bus stopped and we waited for three hours! Everyone was cold, but a family shared their tea with us. In the end, we arrived at midnight. I still enjoy travelling by bus, but now I always take a warm jacket."},
wri:{task:"Bir arkadaşına geçen hafta sonu yaptığın kısa bir geziyi anlatan e-posta yaz (100–120 kelime).",tips:["Nereye, kiminle, nasıl gittin?","Past simple + past continuous karışık kullan.","Bir sorun ya da ilginç bir an ekle.","Sonda arkadaşına soru sor."],m:"Hi Maya,\n\nI had a great weekend! On Saturday my sister and I took the ferry to one of the islands near Istanbul. The journey only took ninety minutes. While we were sitting on the deck, we saw some dolphins!\n\nOn the island there are no cars, so we hired bikes and cycled around. In the afternoon we got lost, but a kind old man gave us directions. We had fish for dinner in a small restaurant by the sea, and I bought a souvenir for Mum.\n\nWe came back on Sunday evening, tired but happy. What did you do at the weekend?\n\nLove,\nZeynep"},
quiz:[["I ___ TV when the phone rang.",["was watching","watched","am watching"],0],["While they ___ dinner, the lights went out.",["were having","had","have"],0],["I enjoy ___ new places.",["visiting","to visit","visit"],0],["We decided ___ the train.",["to take","taking","take"],0],["Our flight has a three-hour ___.",["delay","platform","souvenir"],0],["The museum is ___ the park, on the other side of the road.",["opposite","between","straight"],0]]},

{n:6,t:"Fitness",tr:"Sağlık ve form",
lessons:[["6.1","Keeping fit","Present perfect + for/since","Health"],["6.2","The future of food","May, might, will","Food"],["6.3","How are you feeling?","Seeing the doctor","Illness"],["6.4","Monitor Me","BBC video dersi","Sağlıklı alışkanlıklar"]],
sum:"Sağlıklı yaşam, beslenme ve hastalıklar. Bir şeyin ne kadar süredir devam ettiğini for/since ile anlatırsın. Geleceğe dair tahminlerde will (emin), may/might (belki) farkını öğrenirsin. Doktora derdini anlatma kalıplarıyla rol oyunu yapar, sağlık tavsiyeleri içeren bir blog yazısı yazarsın.",
words:[["work out","spor yapmak","I work out at the gym three times a week."],["keep fit","formda kalmak","Swimming is a good way to keep fit."],["healthy / unhealthy","sağlıklı / sağlıksız","I try to eat healthy food."],["junk food","abur cubur","I’ve stopped eating junk food."],["diet","beslenme düzeni, diyet","A balanced diet is important."],["vegetarian","vejetaryen","My sister is a vegetarian."],["ingredient","malzeme (yemek)","What are the ingredients of this soup?"],["headache","baş ağrısı","I’ve got a terrible headache."],["sore throat","boğaz ağrısı","I can’t talk much – I’ve got a sore throat."],["temperature","ateş","You’ve got a high temperature."],["cough","öksürük / öksürmek","I’ve had this cough for a week."],["prescription","reçete","The doctor gave me a prescription."],["painkiller","ağrı kesici","Take a painkiller if it hurts."],["injury","yaralanma, sakatlık","He can’t play because of an injury."]],
gram:[{t:"Present perfect + for / since",e:"Geçmişte başlayıp hâlâ devam eden durumlar. for + süre (for two years, for a week); since + başlangıç noktası (since 2020, since Monday). Türkçedeki ‘…dır / …den beri’.",f:"I’ve lived here for five years / since 2021.",ex:["I’ve lived here for five years.","She has been a vegetarian since 2018.","How long have you had this cough?","We’ve known each other since primary school."]},
{t:"May, might, will (tahmin)",e:"will: emin olduğun tahmin · won’t: olmayacağından eminsin · may / might: olabilir, emin değilsin. Hepsinden sonra fiil yalın hâlde gelir.",f:"People will / might / won’t + fiil",ex:["In the future, people will eat more insects.","We might grow food in our flats.","I may not come to the gym tomorrow.","Robots won’t cook all our meals."]}],
phr:{t:"At the doctor’s (Doktorda)",items:["What’s the matter?","I don’t feel very well.","I’ve got a sore throat and a cough.","It hurts here.","How long have you had it?","You need to rest and drink lots of water.","Take this twice a day."]},
lis:{t:"At the doctor’s",text:"Doctor: Good morning. What’s the matter?\nPatient: I’ve got a sore throat and a bad cough.\nDoctor: How long have you had them?\nPatient: Since Monday. So, about four days.\nDoctor: Have you got a temperature?\nPatient: Yes, a little. Thirty-eight degrees last night.\nDoctor: OK. It’s probably a virus. You need to rest and drink lots of water. Take a painkiller if you need to. If you don’t feel better in a week, come back and see me.",
q:[["When did the problem start?",["On Monday","On Thursday","Last week"],0],["What was the patient’s temperature?",["38 degrees","37 degrees","39 degrees"],0],["What should the patient do?",["Rest and drink lots of water","Take antibiotics","Go back to work"],0]]},
spk:{p:["How do you keep fit? How long have you done it?","How long have you lived in your home? How long have you known your best friend?","What will people eat in 2050? Use will, may and might.","Role-play: You are at the doctor’s. Explain your problem."],m:"I go swimming twice a week. I’ve done it for about three years, since I started university. I’ve also stopped eating junk food since January. In 2050, I think people will eat less meat, and we might eat food from 3D printers. But I don’t think robots will cook for everyone."},
wri:{task:"‘Sağlıklı kalmak için 5 öneri’ başlıklı bir blog yazısı yaz (100–120 kelime).",tips:["Kısa bir giriş yaz: neden önemli?","Öneriler için should / it’s a good idea to / try to kullan.","Kendi deneyimini ekle (I’ve… for/since).","Okuyucuya soru sorarak bitir."],m:"Five easy ways to stay healthy\n\nA lot of people think getting fit is difficult, but small changes can make a big difference. Here are my five tips.\n\n1. Walk more. I’ve walked to work every day since March, and I feel much better.\n2. Drink water, not fizzy drinks.\n3. Try to sleep for seven or eight hours.\n4. Eat more vegetables. You don’t have to be a vegetarian, but it’s a good idea to have vegetables with every meal.\n5. Find a sport you enjoy. If you love it, you won’t stop!\n\nWhat do you do to keep fit? Tell me in the comments."},
quiz:[["I’ve lived in this city ___ 2015.",["since","for","from"],0],["She has worked here ___ six months.",["for","since","ago"],0],["It’s very cloudy. It ___ rain later.",["might","must","is"],0],["I’ve got a ___. My head really hurts.",["headache","sore throat","cough"],0],["The doctor gave me a ___ for some medicine.",["prescription","painkiller","diet"],0],["How long ___ you had this cough?",["have","did","are"],0]]},

{n:7,t:"Changes",tr:"Değişimler",
lessons:[["7.1","Living the dream","Used to","Verbs + prepositions"],["7.2","The great impostor","Purpose, cause and result","Collocations"],["7.3","Can you tell me?","Finding out information","Facilities"],["7.4","A Greek Adventure","BBC video dersi","Yeni deneyimler"]],
sum:"Hayat değişiklikleri, yalanlar ve yeni deneyimler. Geçmişteki alışkanlıkları used to ile anlatırsın. Amaç (to), sebep (because) ve sonucu (so) bağlamayı, kibarca bilgi sormayı (Could you tell me…?) öğrenirsin. Paragraflar kullanarak hayatındaki bir değişimi yazarsın.",
words:[["move abroad","yurt dışına taşınmak","They moved abroad to start a new life."],["give up","bırakmak (alışkanlık)","He gave up smoking last year."],["take up","(bir hobiye) başlamak","I’ve taken up yoga."],["settle down","yerleşik düzene geçmek","After years of travelling, she settled down in a village."],["change career","kariyer değiştirmek","At forty, he changed career and became a teacher."],["retire","emekli olmak","My grandfather retired at sixty-five."],["dream of","hayalini kurmak","I dream of living by the sea."],["worry about","…için endişelenmek","Don’t worry about the exam."],["depend on","…e bağlı olmak","It depends on the weather."],["tell a lie","yalan söylemek","He told a lie about his age."],["pretend","…mış gibi yapmak","She pretended to be a doctor."],["facilities","olanaklar, tesisler","The hotel has great facilities: a pool, a gym and a spa."],["opening hours","çalışma saatleri","What are the library’s opening hours?"],["fill in a form","form doldurmak","Please fill in this form."]],
gram:[{t:"Used to",e:"Geçmişte düzenli olan ama artık olmayan alışkanlıklar ve durumlar (Türkçedeki ‘…ardı/…erdi’). Olumsuz ve soruda ‘use to’ yazılır (did zaten geçmişi gösterir).",f:"I used to + fiil / I didn’t use to / Did you use to…?",ex:["I used to live in a small town.","She didn’t use to like coffee.","Did you use to play football?","There used to be a cinema here."]},
{t:"Purpose, cause, result",e:"to + fiil: amaç (…mek için) · because: sebep (çünkü) · so: sonuç (bu yüzden).",f:"…to + fiil / …because… / …so…",ex:["I went to the bank to get some money.","He lied because he was afraid.","It was raining, so we stayed at home.","She’s saving money to buy a car."]}],
phr:{t:"Finding out information (Bilgi alma)",items:["Could you tell me what time the pool opens?","Do you know if there’s a café here?","Can I check that? Did you say ten o’clock?","Is there a discount for students?","Sorry, could you repeat that?","Dikkat: Could you tell me where the station is? (is sona gider)"]},
lis:{t:"A new life by the sea",text:"Ten years ago, Lisa used to work in a bank in London. She earned good money, but she didn’t use to enjoy her job, and she worried about deadlines all the time. One day she decided to change her life. She sold her flat, moved abroad to Portugal and opened a small surf school. Now she lives near the beach and she has taken up painting. ‘I don’t earn as much,’ she says, ‘but I’m much happier. I used to dream of this life, and now it’s real.’",
q:[["Where did Lisa use to work?",["In a bank in London","In a hospital in Lisbon","In a shop in Paris"],0],["What did she open in Portugal?",["A surf school","A café","A hotel"],0],["What new hobby has she taken up?",["Painting","Yoga","Cooking"],0]]},
spk:{p:["How has your life changed in the last ten years? Use used to.","Why do people tell lies? Is it ever OK to lie?","Talk about a big change you would like to make in your life.","Role-play: Ask for information at a sports centre (opening hours, prices, facilities)."],m:"Ten years ago I used to live in a small village. I used to walk to school and play outside all day. I didn’t use to have a phone! Now I live in a big city and I take the metro everywhere. I’ve taken up running to stay fit, and I’d like to move abroad one day to study."},
wri:{task:"Hayatındaki bir değişimi üç paragrafta anlat (120–140 kelime): önce, değişim, şimdi.",tips:["Paragraf 1: Eskiden nasıldı? (used to)","Paragraf 2: Ne oldu, neden? (because, so, to)","Paragraf 3: Şimdi nasıl, ne hissediyorsun?","Her paragraf tek bir fikir anlatır."],m:"When I was at high school, I used to be very shy. I didn’t use to speak in class, and I never went to parties because I was nervous around new people.\n\nEverything changed when I was seventeen. My English teacher asked me to join the school theatre group. I didn’t want to, but I agreed so I could get extra points. At first I was terrified, but slowly I started to enjoy it. I learned to speak loudly and to stop worrying about mistakes.\n\nNow I’m at university and I’m much more confident. I’ve made lots of friends, and last month I gave a presentation to two hundred students. I still get a little nervous, but I don’t let it stop me."},
quiz:[["I ___ live in Ankara, but now I live in Izmir.",["used to","use to","was used to"],0],["Did you ___ have long hair?",["use to","used to","using to"],0],["I went to the shop ___ buy some milk.",["to","for","because"],0],["I was tired, ___ I went to bed early.",["so","because","to"],0],["Could you tell me what time ___?",["the museum opens","does the museum open","opens the museum"],0],["He ___ up smoking two years ago.",["gave","took","settled"],0]]},

{n:8,t:"Money",tr:"Para",
lessons:[["8.1","Treasure hunt","Relative clauses","Money"],["8.2","Pay me more!","Too much/many, enough, very","Multi-word verbs"],["8.3","I’m just looking","Buying things","Shopping"],["8.4","soleRebels","BBC video dersi","Bir iş fikri sunma"]],
sum:"Para, alışveriş ve maaşlar. İnsanları, nesneleri ve yerleri tanımlamak için who / which / where ile relative clause kurarsın. too much / too many / enough / very farkını ve öbek fiilleri (pay back, try on) öğrenirsin. Mağazada alışveriş diyaloğu kurar, bir görüş yazısı yazarsın.",
words:[["earn","kazanmak (para)","How much do nurses earn?"],["save","biriktirmek","I’m saving for a new laptop."],["spend","harcamak","I spend too much money on clothes."],["borrow","ödünç almak","Can I borrow ten lira?"],["lend","ödünç vermek","Could you lend me your car?"],["afford","(parası) yetmek","I can’t afford a holiday this year."],["cash","nakit","Do you want to pay in cash or by card?"],["receipt","fiş","Keep the receipt in case you want to return it."],["refund","para iadesi","I’d like a refund, please."],["bargain","kelepir","This jacket was a real bargain."],["discount","indirim","Students get a ten percent discount."],["invest","yatırım yapmak","They invested in a new company."],["pay back","geri ödemek","I’ll pay you back on Friday."],["try on","(kıyafet) denemek","Can I try on these shoes?"]],
gram:[{t:"Relative clauses (who, which, where)",e:"Bir ismi tanımlamak için: who → insanlar, which (veya that) → nesneler/hayvanlar, where → yerler. Türkçede ‘…an/…en’ ya da ‘…dığı’ ile çevrilir.",f:"a person who… / a thing which… / a place where…",ex:["A cashier is a person who works in a shop.","This is the app which helps you save money.","That’s the market where I buy fruit.","The man who lives next door is a pilot."]},
{t:"Too much / too many / enough / very",e:"too much + sayılamayan · too many + sayılabilen (gereğinden fazla). enough isimden önce (enough money), sıfattan sonra gelir (big enough). too + sıfat = fazla, sorun var; very + sıfat = çok, sorun olmayabilir.",f:"too many people / not enough time / not big enough",ex:["I’ve got too much homework.","There are too many people here.","I haven’t got enough money.","This coat isn’t big enough.","It’s very expensive, but I love it."]}],
phr:{t:"Buying things (Alışverişte)",items:["Can I help you?","I’m just looking, thanks.","Do you have this in a medium?","Can I try it on?","Where are the changing rooms?","How much is it?","I’ll take it.","Can I pay by card?"]},
lis:{t:"In a clothes shop",text:"Assistant: Hello, can I help you?\nCustomer: Yes, do you have this jacket in a large?\nAssistant: Let me check. Yes, here you are.\nCustomer: Can I try it on?\nAssistant: Of course. The changing rooms are over there.\nCustomer: It fits perfectly. How much is it?\nAssistant: It’s normally eighty pounds, but there’s a twenty percent discount today, so it’s sixty-four.\nCustomer: Great, I’ll take it. Can I pay by card?\nAssistant: Yes, no problem. Here’s your receipt.",
q:[["What size does the customer want?",["Large","Medium","Small"],0],["How much does the customer pay?",["£64","£80","£60"],0],["How does the customer pay?",["By card","In cash","By phone"],0]]},
spk:{p:["Are you a saver or a spender? What do you spend most money on?","Describe a product people should buy. Use who / which / where.","Do people earn enough in your country? Which jobs should earn more?","Role-play: buying clothes in a shop."],m:"I’m definitely a spender! I spend too much money on coffee and books. But this year I’m trying to save money to buy a laptop. I think teachers and nurses don’t earn enough. They are people who do very important jobs, so they should get more money."},
wri:{task:"Görüş yazısı yaz: ‘Öğrencilere iyi notlar için para verilmeli mi?’ (120–140 kelime).",tips:["Giriş: konuyu tanıt ve görüşünü söyle.","İki gerekçe + bir karşı görüş.","Bağlaçlar: Firstly, Secondly, On the other hand, In conclusion.","Sonuçta görüşünü tekrar et."],m:"Some people think schools should pay students for good grades. In my opinion, this is not a good idea.\n\nFirstly, students should learn because learning is interesting and useful, not because they want money. If we pay them, they might stop studying when the money stops. Secondly, some students have problems which make studying difficult. It isn’t fair to give money only to students who find school easy.\n\nOn the other hand, money can motivate some teenagers, especially those who don’t enjoy school. A small reward might help them start.\n\nIn conclusion, I think there are better ways to motivate students, for example interesting lessons and good teachers. Paying for grades costs too much and teaches the wrong lesson."},
quiz:[["A chef is a person ___ cooks in a restaurant.",["who","which","where"],0],["This is the shop ___ I bought my phone.",["where","who","which"],0],["There are too ___ cars in the city.",["many","much","enough"],0],["I can’t buy it. I haven’t got ___ money.",["enough","too","very"],0],["Can I ___ some money from you?",["borrow","lend","earn"],0],["Can I ___ these jeans ___?",["try / on","take / off","pay / back"],0]]},

{n:9,t:"Nature",tr:"Doğa",
lessons:[["9.1","Green living","Comparatives / superlatives","Nature"],["9.2","Into the wild","Articles","The outdoors"],["9.3","It could be because…","Making guesses","Animals"],["9.4","The Northern Lights","BBC video dersi","Doğal güzellikler"]],
sum:"Çevre, doğa ve hayvanlar. Karşılaştırma (bigger, the most beautiful) ve artikelleri (a / an / the / artikelsiz) çalışırsın. Emin olmadığında tahmin yürütmeyi (It could be… / It must be…) öğrenirsin. Çevre konusundaki görüşlerini ve bir doğa gezisini anlatan bir seyahat blogu yazarsın.",
words:[["environment","çevre","We must protect the environment."],["pollution","kirlilik","Air pollution is a big problem in large cities."],["recycle","geri dönüştürmek","We recycle paper and glass."],["climate change","iklim değişikliği","Climate change affects everyone."],["rainforest","yağmur ormanı","The Amazon is the largest rainforest in the world."],["desert","çöl","It hardly ever rains in the desert."],["waterfall","şelale","We swam under a beautiful waterfall."],["cliff","uçurum, yalıyar","Don’t walk too close to the edge of the cliff."],["coast","kıyı","We drove along the coast."],["valley","vadi","The village is in a green valley."],["wildlife","yaban hayatı","The national park is full of wildlife."],["endangered","nesli tükenmekte olan","Pandas are an endangered species."],["survive","hayatta kalmak","How long can you survive without water?"],["campsite","kamp alanı","We put up our tent at the campsite."]],
gram:[{t:"Comparatives & superlatives",e:"Kısa sıfatlar: -er / the -est (cold → colder → the coldest). Uzun sıfatlar: more / the most. Düzensizler: good → better → the best, bad → worse → the worst, far → further → the furthest. Eşitlik: as … as / not as … as.",f:"bigger than / the biggest / more beautiful than",ex:["The city is noisier than the countryside.","This is the most beautiful beach I’ve ever seen.","Cycling is better for the environment than driving.","The village isn’t as busy as the city."]},
{t:"Articles (a / an / the / —)",e:"a / an: ilk kez bahsedilen, ‘herhangi bir’, meslekler. the: bilinen, daha önce bahsedilen, tek olan (the sun, the sea). Artikel yok: genel anlamda çoğul ve sayılamayan isimler (Dogs are…, Water is…), çoğu ülke ve şehir adı.",f:"a bear → the bear / the sun / Dogs are…",ex:["I saw a bear. The bear was huge.","The sun is shining.","Dogs are friendly animals.","She’s an engineer."]}],
phr:{t:"Making guesses (Tahmin)",items:["It could be a kind of bird.","It might be dangerous.","It’s probably very old.","It must be a zebra – it has stripes! (eminim)","It can’t be a cat – it’s too big. (olamaz)","I’m not sure, but I think…"]},
lis:{t:"Three green ideas",text:"In today’s programme we look at three simple green ideas. The first is easy: turn off lights and computers when you’re not using them. A typical family can save around fifteen percent on their electricity bill this way. Second, try to eat less meat. Producing meat uses much more water than growing vegetables. And third, walk or cycle for short journeys. It’s healthier, cheaper, and of course better for the planet than taking the car.",
q:[["How much can a family save by turning things off?",["About 15%","About 50%","About 5%"],0],["Why does the speaker suggest eating less meat?",["It uses more water","It’s too expensive","It’s unhealthy"],0],["What should you do for short journeys?",["Walk or cycle","Take a taxi","Take the bus"],0]]},
spk:{p:["What are the biggest green issues in your country?","Would you prefer to live in the city or the countryside? Compare them.","Guessing game: describe an animal; your partner guesses with could / might / must.","Describe the most beautiful natural place you have visited."],m:"I think the countryside is quieter and healthier than the city, and the air is cleaner. But the city is more exciting and there are better jobs. For me, the most beautiful place I’ve visited is a valley in the Black Sea region. It was greener than anywhere I’ve seen, and there was a huge waterfall."},
wri:{task:"Doğal güzelliği olan bir yeri anlatan seyahat blogu yaz (120–140 kelime).",tips:["Nerede, ne zaman, kiminle gittin?","Karşılaştırma ve üstünlük sıfatları kullan.","Duyularını anlat: ne gördün, duydun, hissettin?","Okuyucuya bir tavsiye ver."],m:"My trip to the Kaçkar Mountains\n\nLast August I spent four days in the Kaçkar Mountains in north-east Turkey. It was the most amazing trip of my life.\n\nWe stayed at a small campsite in a green valley. Every morning we walked for hours past waterfalls and lakes. The air was fresher and cleaner than in the city, and at night the sky was full of stars. On the second day we saw an eagle above the cliffs – it was bigger than I expected!\n\nThe walking was harder than I thought, and it can be very cold at night, so take warm clothes. But if you love nature, this is one of the best places you can visit."},
quiz:[["Istanbul is ___ than Ankara.",["bigger","more big","biggest"],0],["This is the ___ day of the year.",["hottest","hotter","most hot"],0],["My English is ___ than last year.",["better","gooder","best"],0],["___ moon goes round the Earth.",["The","A","An"],0],["I saw ___ eagle in the mountains.",["an","a","the"],0],["It has black and white stripes. It ___ be a zebra!",["must","can’t","mustn’t"],0]]},

{n:10,t:"Society",tr:"Toplum",
lessons:[["10.1","Top cities","Uses of like","Describing a city"],["10.2","Crime and punishment","Present / past passive","Crime and punishment"],["10.3","There’s a problem","Complaining","Problems"],["10.4","Mary’s Meals","BBC video dersi","Önemli bir toplumsal konu"]],
sum:"Şehir hayatı, suç ve ceza, şikâyetler. ‘like’ kelimesinin farklı kullanımlarını (What’s it like? / What does she look like?) ve edilgen yapıyı (is made / was stolen) öğrenirsin. Kibarca şikâyet etmeyi çalışır, resmî bir e-posta yazarsın.",
words:[["crowded","kalabalık","The metro is very crowded in the morning."],["polluted","kirli (hava, su)","The river is very polluted."],["lively","hareketli, canlı","It’s a lively city with lots of cafés."],["safe / dangerous","güvenli / tehlikeli","Is it safe to walk here at night?"],["cosmopolitan","kozmopolit","London is a very cosmopolitan city."],["crime","suç","Crime has gone down this year."],["thief","hırsız","A thief stole my wallet."],["burglar","ev hırsızı","Burglars broke into our house."],["steal","çalmak","Someone stole her bike."],["arrest","tutuklamak","The police arrested two men."],["fine","para cezası","He had to pay a fine for speeding."],["prison","hapishane","He spent three years in prison."],["community service","kamu hizmeti cezası","She got a hundred hours of community service."],["complain","şikâyet etmek","I want to complain about the noise."]],
gram:[{t:"Uses of like",e:"What’s it like? → nasıl bir şey? (betimleme) · What does she like? → neyi sever? · What does he look like? → dış görünüşü nasıl? · Would you like…? → ister misin? (teklif) · It’s like Paris → Paris’e benziyor.",f:"What’s … like? / What does … look like?",ex:["What’s your new flat like? — It’s small but bright.","What does your brother like? — Football and video games.","What does she look like? — She’s tall with dark hair.","Would you like a coffee?"]},
{t:"Present & past passive",e:"Eylemi yapanın değil, eylemin kendisinin önemli olduğu durumlarda. am/is/are + V3 (şimdi), was/were + V3 (geçmiş). Yapanı söylemek istersen ‘by’ kullanılır.",f:"is made / was stolen (by…)",ex:["Coffee is grown in Brazil.","My car was stolen last night.","The thief was arrested by the police.","English is spoken all over the world."]}],
phr:{t:"Complaining (Şikâyet etme)",items:["Excuse me, I’m afraid there’s a problem with my room.","I’d like to complain about the noise.","The air conditioning doesn’t work.","Could you do something about it, please?","I’m sorry to hear that. I’ll sort it out right away.","Would you like to change rooms?"]},
lis:{t:"Two cities",text:"Man: Emma, what’s Barcelona like?\nEmma: It’s fantastic! It’s really lively and cosmopolitan, and the food is amazing. But it can be very crowded in summer, with lots of tourists.\nMan: And what about Oslo?\nEmma: Oslo’s quieter and very safe. It’s clean, too – the air isn’t polluted at all. But it’s expensive. A coffee costs about five euros!",
q:[["What’s the problem with Barcelona in summer?",["It’s very crowded","It’s polluted","It’s cold"],0],["Which city is very safe?",["Oslo","Barcelona","Both cities"],0],["How much is a coffee in Oslo?",["About €5","About €2","About €10"],0]]},
spk:{p:["What’s your city like? Use five adjectives from the unit.","Decide a punishment: a teenager writes graffiti on a school wall. A man steals food from a supermarket.","What problems are there at your school or workplace? Complain politely.","Talk about an important social issue in your country."],m:"My city is lively and quite cosmopolitan, but it’s very crowded and the traffic is terrible. I think the teenager who wrote graffiti should do community service – for example, he should clean the wall. Prison isn’t a good idea for young people."},
wri:{task:"Bir otele resmî şikâyet e-postası yaz (100–120 kelime). Resmî ifadeler kullan.",tips:["Dear Sir or Madam, ile başla.","Amacını belirt: I am writing to complain about…","Sorunları sırala, edilgen yapı kullan (was not cleaned).","Ne istediğini yaz ve Yours faithfully, ile bitir. (Kısaltma kullanma: I am, not I’m)"],m:"Dear Sir or Madam,\n\nI am writing to complain about my stay at your hotel from 12 to 15 June.\n\nFirstly, our room was not cleaned during our stay, and the towels were not changed. Secondly, the air conditioning did not work, so it was very difficult to sleep. I reported the problem to reception twice, but nothing was done. Finally, we were charged for breakfast, although it was included in the price.\n\nI would be grateful if you could refund the cost of the breakfast and explain what happened.\n\nI look forward to hearing from you.\n\nYours faithfully,\nAyşe Kaya"},
quiz:[["What’s your new flat ___? — It’s small but bright.",["like","likes","look"],0],["This bridge ___ in 1973.",["was built","built","is built"],0],["Rice ___ in many Asian countries.",["is grown","grows","was grow"],0],["My phone ___ yesterday!",["was stolen","stole","is stolen"],0],["The police ___ the thief last night.",["arrested","fined","stole"],0],["I’d like to ___ about the noise in my room.",["complain","arrest","punish"],0]]},

{n:11,t:"Technology",tr:"Teknoloji",
lessons:[["11.1","Keeping in touch","Present perfect","Communication"],["11.2","Make a difference","Real conditionals + when","Feelings"],["11.3","I totally disagree","Giving opinions","Internet terms"],["11.4","Is TV Bad For Kids?","BBC video dersi","Vazgeçemediğin teknoloji"]],
sum:"İletişim, sosyal medya ve internet. Present perfect’i just / already / yet ile kullanırsın. Gerçek olasılıklar için birinci koşul cümlesini (If…, …will) ve ‘when’ farkını öğrenirsin. Görüş bildirme ve katılmama kalıplarıyla tartışır, görüş yazısı yazarsın.",
words:[["keep in touch","iletişimi sürdürmek","We keep in touch by video call."],["text","mesaj atmak","Text me when you arrive."],["upload / download","yüklemek / indirmek","I uploaded the photos last night."],["log in / log out","giriş / çıkış yapmak","You need a password to log in."],["password","şifre","Never share your password."],["social media","sosyal medya","I spend too much time on social media."],["post","paylaşmak; gönderi","She posted a photo of her dinner."],["follow","takip etmek","How many people follow you?"],["delete","silmek","I deleted the app from my phone."],["update","güncellemek","You need to update your software."],["annoyed","sinirli, canı sıkkın","I get annoyed when my phone is slow."],["excited","heyecanlı","I’m excited about my new laptop."],["nervous","gergin","I was nervous before the online interview."],["addicted (to)","bağımlı","Some teenagers are addicted to games."]],
gram:[{t:"Present perfect: just, already, yet",e:"just: az önce · already: (beklenenden) çoktan · yet: henüz (olumsuz ve sorularda, cümle sonunda). Sonucu şimdi önemli olan yakın geçmiş eylemler.",f:"I’ve just… / I’ve already… / Have you… yet?",ex:["I’ve just sent you an email.","She’s already downloaded the app.","Have you finished yet?","I haven’t replied yet."]},
{t:"Real conditionals (If / when)",e:"First conditional: If + present simple, will + fiil → gerçek, olası bir durum ve sonucu. ‘If’ olabilir de olmayabilir de; ‘when’ olacağından eminsin. If/when’den sonra will kullanılmaz!",f:"If you…, you’ll… / When I get home, I’ll…",ex:["If you spend too long online, you’ll get tired.","If it rains, we won’t go out.","When I get home, I’ll call you.","What will you do if you lose your phone?"]}],
phr:{t:"Giving opinions (Görüş bildirme)",items:["In my opinion, …","I think / I don’t think …","Personally, I feel that …","I totally agree.","I see your point, but …","I’m not sure about that.","I totally disagree."]},
lis:{t:"Is the internet good for us?",text:"Ali: In my opinion, the internet makes our lives much easier. I do my shopping online, I bank online…\nJess: That’s true, but I think people spend too much time on their phones. My brother is on social media for five hours a day!\nAli: I see your point, but it’s also how we keep in touch. My family lives abroad and we video-chat every Sunday.\nJess: OK, I agree it’s useful for that. But I still think we all need a break sometimes.",
q:[["What does Ali do online?",["Shopping and banking","Gaming","Studying"],0],["How long is Jess’s brother on social media?",["Five hours a day","Two hours a day","Ten hours a day"],0],["When does Ali video-chat with his family?",["Every Sunday","Every evening","Once a month"],0]]},
spk:{p:["How do you keep in touch with friends and family?","What have you already done today? What haven’t you done yet?","What will happen if people stop using social media for a month?","Which piece of technology couldn’t you live without? Why?"],m:"Today I’ve already been to class and I’ve just finished lunch, but I haven’t done my homework yet. I couldn’t live without my phone, because I keep in touch with my family on it. If people stop using social media for a month, I think they’ll feel nervous at first, but they’ll sleep better and read more."},
wri:{task:"Görüş yazısı: ‘Teknoloji bizi daha az sosyal yapıyor mu?’ (120–140 kelime). Zamirleri doğru kullan (it, they, this) ve tekrarlardan kaçın.",tips:["Görüşünü giriş paragrafında net söyle.","İki gerekçe, bir örnek.","Tekrardan kaçınmak için zamir kullan: social media → it, people → they.","Sonuç cümlesi: To sum up, …"],m:"Many people say technology is making us less social. I partly agree with this.\n\nOn the one hand, technology helps us stay connected. My grandparents live in another city, but we video-chat every week, and they can see their grandchildren grow up. Without it, we would only talk a few times a year.\n\nOn the other hand, people often look at their phones when they are with friends. At dinner, I sometimes see a whole family sitting together in silence, each person looking at a screen. This is sad, because real conversations are disappearing.\n\nTo sum up, technology itself is not the problem; the way we use it is. If we put our phones away when we are with people, we will enjoy the best of both worlds."},

const synth=("speechSynthesis" in window)?window.speechSynthesis:null;let voice=null;
function pickVoice(){if(!synth)return;const v=synth.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;}
function speak(text,isDialog){
  if(!synth){toast("Bu cihazda sesli okuma desteklenmiyor. Metni göstererek çalışabilirsin.");return;}
  synth.cancel();
  const lines=isDialog?text.split("\n").filter(Boolean):[text];const pitch={};let k=0;
  lines.forEach(l=>{let t=l,p=1;const m=l.match(/^([A-Z][A-Za-z ]{0,14}):\s*(.*)$/);
    if(m){if(!(m[1] in pitch))pitch[m[1]]=(k++%2)?1.3:0.85;p=pitch[m[1]];t=m[2];}
    const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?voice.lang:"en-GB";u.rate=rate;u.pitch=p;synth.speak(u);});
}

function qHTML(qs,key,start){start=start||0;
  return qs.map((x,i)=>{const cor=x[1][x[2]];const opts=shuffle(x[1].slice());
  return `<fieldset class="q" data-correct="${esc(cor)}"><legend><span class="qn">${start+i+1}</span><span>${fmt(x[0])}</span></legend>${opts.map(o=>`<label class="opt"><input type="radio" name="${key}-${start+i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</fieldset>`;}).join("");}
function grade(root){let c=0,t=0,empty=0;root.querySelectorAll("fieldset.q").forEach(f=>{t++;const sel=f.querySelector("input:checked");if(!sel)empty++;const cor=f.dataset.correct;
  f.querySelectorAll("label.opt").forEach(l=>{const v=l.querySelector("input").value;l.classList.remove("ok","bad");if(v===cor)l.classList.add("ok");else if(sel&&sel.value===v)l.classList.add("bad");});
  if(sel&&sel.value===cor)c++;f.querySelectorAll("input").forEach(i=>i.disabled=true);});return{c,t,empty};}
function verdict(p){return p>=85?"Harika! Bu konular sağlam.":p>=70?"İyi gidiyorsun; yanlışlarını tekrar et.":p>=50?"Geçer not. Dilbilgisi kartlarına bir kez daha bak.":"Bu üniteyi baştan tekrar etmeni öneririm.";}

/* ===================== HELPERS ===================== */
function setBar(title,back){
  const p=store&&me();
  $("#bar").innerHTML=(back?`<a class="back" href="#${back}">‹ Geri</a>`:"")+`<span class="ttl">${esc(title)}</span><span class="sp"></span>`+
  (p?`<a class="hbtn" href="#dashboard" aria-label="Dashboard" title="Dashboard">📊</a><a class="hbtn" href="#profile" aria-label="Profil" title="Profil">${p.avatar}</a>`:"");
}
function allWords(u){const b=u.words.map((w,i)=>({en:w[0],tr:w[1],ex:w[2],k:u.n+"-"+i}));
  const c=((store&&store.custom[u.n])||[]).map(w=>({en:w.en,tr:w.tr,ex:w.ex,k:"c"+u.n+"-"+w.id,id:w.id,mine:true}));return b.concat(c);}
function learnedCount(u){return allWords(u).filter(w=>store.learned[w.k]).length;}
function customCount(){return U.reduce((a,u)=>a+((store.custom[u.n]||[]).length),0);}
Object.defineProperty(window,"TOTALW",{get:()=>U.reduce((a,u)=>a+allWords(u).length,0)});
function unitPct(u){const w=learnedCount(u)/allWords(u).length;const q=store.quiz[u.n]!=null?store.quiz[u.n]/6:0;const l=store.lis["lis"+u.n]!=null?store.lis["lis"+u.n]:0;const wr=wc(store.text["u"+u.n]||"")>=50?1:0;
  return Math.round((w*0.4+q*0.3+l*0.15+wr*0.15)*100);}
function nextStep(){for(const u of U){if(learnedCount(u)<allWords(u).length)return[u,"kelime",`Ünite ${u.n} kelimelerini bitir (${learnedCount(u)}/${allWords(u).length})`];
  if(store.quiz[u.n]==null)return[u,"test",`Ünite ${u.n} testini çöz`];if(store.lis["lis"+u.n]==null)return[u,"dinleme",`Ünite ${u.n} listening alıştırmasını yap`];
  if(wc(store.text["u"+u.n]||"")<50)return[u,"yazma",`Ünite ${u.n} writing görevini yaz`];}
  const ek=Object.keys(EX).find(k=>store.exam[k]==null);return ek?[null,ek,`${EX[ek].t} sınavını çöz`]:null;}
function wc(s){return (s.trim().match(/\S+/g)||[]).length;}
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;

function doLogin(raw){
  const name=(raw||"").trim();
  if(!/^[\p{L}\p{N}_.\-]{3,20}$/u.test(name)){toast("Kullanıcı adı 3–20 karakter olmalı: harf, rakam, _ . -");return;}
  const id=name.toLocaleLowerCase("tr");
  if(!DB.users[id]){const first=!Object.keys(DB.users).length;
    DB.users[id]={name,avatar:AV[Math.floor(Math.random()*AV.length)],goal:10,examDate:"",created:Date.now(),data:(first&&oldData)?Object.assign(blank(),oldData):blank()};
    toast("Profil oluşturuldu. Hoş geldin, "+name+"!");}
  else toast("Tekrar hoş geldin, "+DB.users[id].name+"!");
  enter(id);
}

const TABS=[["ozet","Özet"],["kelime","Kelimeler"],["gramer","Dilbilgisi"],["kalip","Kalıplar"],["dinleme","Listening"],["konusma","Speaking"],["yazma","Writing"],["test","Ünite testi"]];
function unit(n){
  const u=U[n-1];setBar(`Ünite ${u.n}: ${u.t}`,"home");
  return `<div class="uhead"><div class="big">${u.n}</div><div><h1><span class="mark">${esc(u.t)}</span></h1><div class="tr">${esc(u.tr)}, tamamlama %${unitPct(u)}</div></div></div>
  <nav class="tabs" role="tablist">${TABS.map(t=>`<button class="tab" role="tab" data-act="tab" data-v="${t[0]}" aria-selected="${uTab===t[0]}">${t[1]}</button>`).join("")}</nav>
  <div id="tabc">${tabContent(u)}</div>`;
}
function tabContent(u){
  switch(uTab){
  case "ozet":return `<div class="panel"><h3>Bu ünitede</h3><p>${esc(u.sum)}</p></div><div class="panel"><h3>Dersler</h3>${u.lessons.map(l=>`<div class="lesson"><div class="c">${l[0]}</div><div><b>${esc(l[1])}</b><div class="m">${esc(l[2])}, ${esc(l[3])}</div></div></div>`).join("")}</div>
   <div class="panel"><h3>Önerilen çalışma sırası</h3><ol class="tips"><li>Kelimeleri liste hâlinde oku, sonra kartlarla kendini test et.</li><li>Dilbilgisi kartlarını oku, örnekleri sesli dinle ve tekrar et.</li><li>Kalıpları yüksek sesle söyle.</li><li>Listening metnini önce metni görmeden dinle.</li><li>Speaking sorularını süre tutarak cevapla.</li><li>Writing görevini yaz, sonra örnek cevapla karşılaştır.</li><li>Ünite testini çöz.</li></ol></div>`;
  case "kelime":return words(u);
  case "gramer":return u.gram.map(g=>`<div class="panel"><h3>${esc(g.t)}</h3><p>${esc(g.e)}</p><div class="formula">${esc(g.f)}</div><ul class="exs">${g.ex.map(x=>`<li><button class="icon" data-act="say" data-t="${esc(x)}" aria-label="Dinle">▶</button><span>${esc(x)}</span></li>`).join("")}</ul></div>`).join("");
  case "kalip":return `<div class="panel"><h3>${esc(u.phr.t)}</h3><p style="color:var(--muted)">Her kalıba dokunup dinle, sonra sesli tekrar et.</p><ul class="exs">${u.phr.items.map(x=>`<li><button class="icon" data-act="say" data-t="${esc(x)}" aria-label="Dinle">▶</button><span>${esc(x)}</span></li>`).join("")}</ul></div>`;
  case "dinleme":return listening(u.lis.text,u.lis.q,"lis"+u.n,u.lis.t);
  case "konusma":return `<div class="panel"><h3>Konuşma görevleri</h3><p style="color:var(--muted)">Bir soru seç, süreyi başlat ve 60 saniye boyunca İngilizce konuş. Mümkünse kendini telefonla kaydet.</p>${u.spk.p.map((p,i)=>`<div class="prompt"><span class="qn">${i+1}</span><span>${esc(p)}</span></div>`).join("")}
   <div class="btnrow" style="align-items:center"><span class="timer" id="tm">1:00</span><button class="btn pri" data-act="timer">Süreyi başlat</button></div></div>
   <div class="panel"><h3>Yararlı kalıplar</h3><div class="chips">${u.phr.items.slice(0,6).map(x=>`<button class="chip" data-act="say" data-t="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>
   <div class="panel"><details><summary>Örnek cevabı göster</summary><div class="model">${esc(u.spk.m)}</div><div class="btnrow"><button class="btn" data-act="say" data-t="${esc(u.spk.m)}">▶ Dinle</button></div></details></div>`;
  case "yazma":return writing(u.wri.task,u.wri.tips,u.wri.m,"u"+u.n);
  case "test":return `<div class="panel" id="quiz"><h3>Ünite ${u.n} testi</h3>${store.quiz[u.n]!=null?`<p style="color:var(--muted)">Son puanın: ${store.quiz[u.n]}/6</p>`:""}${qHTML(u.quiz,"qz"+u.n)}<div class="btnrow"><button class="btn pri" data-act="checkquiz">Cevapları kontrol et</button><button class="btn" data-act="retab">Yeniden başla</button></div><div id="qres"></div></div>`;
  }
