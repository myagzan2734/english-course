{t:"Okuma",text:"Last month, a school in Bursa tried an experiment. For one week, students had to leave their phones at home. At first, many students were unhappy. ‘I felt lost on the first day,’ says Mert, aged fifteen. ‘I didn’t know what to do in the breaks.’ But by Wednesday, things were changing. Students were playing football, chatting and reading in the breaks. Teachers said students were listening more carefully in class. Not everything was easy, though. Some parents didn’t like the idea because they couldn’t contact their children during the day. The school is now going to repeat the experiment every term, but students will be able to bring their phones for emergencies.",

wri:{task:"‘Formda ve sağlıklı kalmak için neler yapıyorum?’ başlıklı blog yazısı yaz (100–120 kelime). Present perfect + for/since kullan.",m:"How I stay healthy\n\nI’m not a sports star, but I try to keep fit. I’ve played basketball with my friends every Saturday for four years, and since last September I’ve also gone to the gym twice a week.\n\nFood is important too. I’ve stopped drinking fizzy drinks, and I try to eat fruit and vegetables every day. I sometimes eat junk food, but not very often.\n\nI think sleep is the most difficult part for me. I often stay up late on my phone. My next goal is to go to bed before midnight – it might help me feel less tired in the mornings!"}},

{t:"Okuma",text:"In many cities around the world, people are opening ‘repair cafés’. These are places where you can take broken things – a lamp, a bike, a jacket – and volunteers help you fix them for free. The idea started in the Netherlands in 2009, and now there are repair cafés in many countries. The aim is simple: to throw away less and to save money. ‘People used to repair everything,’ says one volunteer, a retired engineer. ‘Now they just buy something new. If we fix more things, we’ll produce less rubbish.’ Visitors also say the cafés are a great way to meet neighbours. While you are waiting, you can have a cup of tea and chat.",

wri:{task:"Görüş yazısı: ‘Ünlüler çok fazla para kazanıyor.’ Katılıyor musun? (120–150 kelime). Görüş kalıpları, koşul cümleleri ve relative clause kullan.",m:"Many people believe that celebrities earn too much money. I mostly agree with this opinion.\n\nFirstly, some film stars and footballers earn more in one week than a nurse earns in ten years. Nurses and teachers are people who do very important jobs, so I don’t think this is fair.\n\nOn the other hand, celebrities work hard and their careers are often short. A footballer who gets a serious injury might stop playing at twenty-five. Also, they make a lot of money for their companies, so you could say they deserve some of it.\n\nIn my opinion, if famous people earned a little less and gave more to charity, the world would be a better place. To sum up, they should be well paid, but not as much as they are now."}},

{t:"Okuma",text:"Three years ago, Daniel decided to live without money for one year. He gave his car to a friend, left his flat and moved to a small farm. He grew his own vegetables and used solar power for his laptop. ‘At first it was really hard,’ he says. ‘I used to buy coffee every morning, and I missed it a lot!’ He got around by bike and swapped work for the things he needed: he helped a farmer, and in return the farmer gave him bread and milk. After the year finished, Daniel didn’t go back to his old life completely. ‘I spend much less now. If I want something, I ask myself: do I really need it?’ He has since written a book about his experience.",

wri:{task:"Hayran olduğun ünlü bir kişiyi anlat (120–150 kelime). Relative clause, geçmiş zamanlar ve dolaylı anlatım kullan.",m:"The famous person I admire most is a Turkish volleyball player who plays for the national team. I first saw her on TV when I was twelve, and she inspired me to start playing volleyball.\n\nShe grew up in a small town where there weren’t many sports facilities. She used to train in a school gym which was very old and cold. Her coach once said that she was the hardest-working player he had ever seen.\n\nWhat I admire most is not her success but her attitude. In an interview, she said she still felt nervous before every match, but she never let it stop her. She also helps young girls from poor families get into sport.\n\nIf I met her, I would ask her how she stays so calm under pressure."}}

{n:2,t:"People",tr:"İnsanlar",
lessons:[["2.1","Aile","be: you / we / they","Family"],["2.2","Arkadaşlar","Possessive adjectives","Jobs"],["2.3","Kişisel bilgiler","Asking personal questions","Personal information"],["2.4","Video dersi","—","İnsanları tanıtmak"]],
sum:"Aile, arkadaşlar ve meslekler. be fiilinin you/we/they hâllerini ve iyelik sıfatlarını (my, your, his, her…) öğrenir, kişisel bilgi sormayı çalışırsın.",
words:[["mother / mum","anne","My mother is a doctor."],["father / dad","baba","My dad is fifty."],["brother","erkek kardeş, ağabey","I have one brother."],["sister","kız kardeş, abla","My sister is a student."],["son / daughter","oğul / kız evlat","Their son is ten and their daughter is six."],["husband / wife","koca / eş (kadın)","Her husband is an engineer."],["children","çocuklar","We have two children."],["friend","arkadaş","Ece is my best friend."],["doctor","doktor","Is your mother a doctor?"],["engineer","mühendis","He’s an engineer in Istanbul."],["married / single","evli / bekâr","Are you married? — No, I’m single."],["old / young","yaşlı / genç","My grandmother is old, but she’s very active."]],
gram:[{t:"be: you / we / they",e:"Çoğul öznelerle (we, you, they) are kullanılır. Kısaltma: we’re, they’re. Olumsuz: aren’t. Soru: Are they…?",f:"We are / They are / Are they…?",ex:["We’re students.","They’re my parents.","Are they from Ankara? — No, they aren’t.","You’re very kind."]},
{t:"Possessive adjectives (my, your…)",e:"Sahiplik bildirir, Türkçedeki ‘-ım, -ın, -ı’ eklerinin karşılığıdır: I → my, you → your, he → his, she → her, it → its, we → our, they → their.",f:"my / your / his / her / its / our / their + isim",ex:["This is my brother.","Her name is Ayşe.","Our teacher is from London.","What’s their son’s name?"]}],
phr:{t:"Personal questions (Kişisel sorular)",items:["What’s your name?","How old are you?","Are you married?","What’s your job? — I’m a doctor.","What’s your email address?","Can you spell that, please?"]},
lis:{t:"A family photo",text:"This is a photo of my family. This is my mum, Sarah. She’s a doctor. And this is my dad, Peter. He’s an engineer. They’re from Manchester. These are my brothers, Jack and Sam. Jack is twenty and Sam is seventeen. They’re students. And this is our dog, Max!",
q:[["What is Sarah’s job?",["Doctor","Engineer","Student"],0],["Where are the parents from?",["Manchester","London","Ankara"],0],["How old is Sam?",["Seventeen","Twenty","Seven"],0]]},
spk:{p:["Talk about your family: names, ages, jobs.","Ask your partner five personal questions.","Describe your best friend.","Spell your name and your city in English."],m:"There are four people in my family. My mother’s name is Leyla. She’s forty-five and she’s a teacher. My father is Hasan. He’s an engineer. My sister is Zeynep. She’s fifteen and she’s a student. We’re from Bursa."},
wri:{task:"Ailenden ya da en iyi arkadaşından bahset (40–50 kelime).",tips:["Her kişi için isim, yaş ve meslek yaz.","his / her kullanımına dikkat et.","and ile cümleleri birleştir."],m:"My best friend’s name is Selin. She’s twenty-two and she’s from Antalya. She’s a nurse. Her brother is a student in Istanbul. Her parents are teachers. Selin is very friendly and funny. We’re in the same English class."},
quiz:[["We ___ students.",["are","is","am"],0],["This is my sister. ___ name is Elif.",["Her","His","Their"],0],["They ___ from Izmir.",["aren’t","isn’t","not"],0],["My father’s wife is my ___.",["mother","sister","daughter"],0],["___ they married?",["Are","Is","Do"],0],["Ali and I are brothers. ___ mum is a doctor.",["Our","Their","My"],0]]},

{n:3,t:"Things",tr:"Eşyalar",
lessons:[["3.1","Çantamda ne var?","this / that / these / those","Everyday objects"],["3.2","Hediyelik eşyalar","Plurals; a / an","Colours, souvenirs"],["3.3","Alışverişte","Buying things: How much is it?","Prices"],["3.4","Video dersi","—","En sevdiğim eşyalar"]],
sum:"Günlük eşyalar, renkler ve fiyatlar. Yakın-uzak işaret sözcüklerini (this/that/these/those), çoğul isimleri ve a/an kullanımını öğrenir, küçük alışverişlerde fiyat sormayı çalışırsın.",
words:[["bag","çanta","My bag is black."],["phone","telefon","Where’s my phone?"],["key / keys","anahtar","These are my keys."],["wallet","cüzdan","Is this your wallet?"],["watch","kol saati","That’s a nice watch."],["umbrella","şemsiye","Take an umbrella – it’s raining."],["glasses","gözlük","My glasses are in my bag."],["book","kitap","This book is very good."],["camera","fotoğraf makinesi","Is that your camera?"],["colour","renk","What colour is it? — It’s blue."],["expensive / cheap","pahalı / ucuz","This watch is expensive, but that one is cheap."],["How much…?","ne kadar? (fiyat)","How much is this bag?"]],
gram:[{t:"this / that / these / those",e:"this: yakındaki tek şey (bu), that: uzaktaki tek şey (şu), these: yakındaki birden fazla şey (bunlar), those: uzaktaki birden fazla şey (şunlar).",f:"this + tekil / these + çoğul / that + tekil / those + çoğul",ex:["This is my phone.","That’s a beautiful car.","These are my keys.","Are those your glasses?"]},
{t:"Plurals; a / an",e:"Çoğul için genelde -s eklenir (bag → bags); -s, -sh, -ch, -x ile bitenlere -es (watch → watches). Düzensizler: man → men, woman → women, child → children. a ünsüz sesle, an ünlü sesle başlayan tekil isimlerden önce gelir.",f:"a book / an umbrella / two books",ex:["It’s an umbrella.","I have a camera and two phones.","These watches are expensive.","The children are in the park."]}],
phr:{t:"Shopping (Alışveriş)",items:["Excuse me, how much is this?","It’s ten pounds.","How much are these?","Can I have this one, please?","Here you are.","Thanks. Bye!"]},
lis:{t:"In a souvenir shop",text:"Customer: Excuse me, how much is this bag?\nAssistant: It’s twenty-five euros.\nCustomer: And how much are these keyrings?\nAssistant: They’re three euros each.\nCustomer: OK. Can I have the bag and two keyrings, please?\nAssistant: Sure. That’s thirty-one euros.\nCustomer: Here you are. Thank you!",
q:[["How much is the bag?",["€25","€31","€3"],0],["How many keyrings does the customer want?",["Two","Three","One"],0],["How much is everything?",["€31","€28","€25"],0]]},
spk:{p:["What’s in your bag? Use this / these.","Point to things in the room: Is that…? Are those…?","What colour is your phone, your bag and your pen?","Role-play: Buy a souvenir in a shop."],m:"This is my bag. It’s black. These are my keys and this is my phone. It’s new. That’s my umbrella. It’s red. And these are my glasses."},
wri:{task:"En sevdiğin üç eşyayı anlat (40–50 kelime): ne, ne renk, neden seviyorsun?",tips:["It’s… / They’re… kullan.","Renk ve sıfatlar isimden önce gelir: a red bag.","because ile neden ekle."],m:"My favourite things are my watch, my camera and my books. My watch is old and silver. It’s from my grandfather. My camera is small and black. It’s great for holidays. My books are on a big shelf in my room. I love them because they’re interesting."},
quiz:[["___ are my keys.",["These","This","That"],0],["It’s ___ umbrella.",["an","a","the"],0],["One watch, two ___.",["watches","watchs","watch"],0],["Is ___ your car over there?",["that","these","this"],0],["How much ___ these shoes?",["are","is","am"],0],["One child, two ___.",["children","childs","childrens"],0]]},

{n:4,t:"Life",tr:"Hayat",
lessons:[["4.1","Hayat tarzları","Present simple: I / you / we / they","Verb phrases"],["4.2","Yemek ve içecek","Present simple: negatives and questions","Food and drink"],["4.3","Kafede sipariş","Ordering: I’d like… / Can I have…?","Café food"],["4.4","Video dersi","—","Benim hayatım"]],
sum:"Günlük hayat, yemekler ve alışkanlıklar. Geniş zamanı (present simple) I/you/we/they ile kullanır, olumsuz ve soru cümleleri kurarsın. Yemek ve içecek kelimelerini ve kibarca sipariş vermeyi öğrenirsin.",
words:[["live","yaşamak, oturmak","I live in Konya."],["work","çalışmak","We work in a hospital."],["study","okumak, ders çalışmak","They study English."],["have","sahip olmak; (yemek) yemek","I have a car. We have lunch at one."],["like","sevmek, hoşlanmak","I like tea."],["eat","yemek","We eat a lot of vegetables."],["drink","içmek","Do you drink coffee?"],["breakfast / lunch / dinner","kahvaltı / öğle / akşam yemeği","I have breakfast at seven."],["bread / cheese","ekmek / peynir","I eat bread and cheese for breakfast."],["fruit / vegetables","meyve / sebze","Fruit and vegetables are good for you."],["water / milk / juice","su / süt / meyve suyu","Can I have some water, please?"],["I’d like…","…istiyorum (kibar)","I’d like a sandwich, please."]],
gram:[{t:"Present simple: I / you / we / they",e:"Genel durumlar ve alışkanlıklar için. I, you, we, they ile fiil yalın hâlde kullanılır. Türkçedeki geniş zamanın (-ır) ve alışkanlık bildiren ‘-iyorum’un karşılığı.",f:"I / You / We / They + fiil",ex:["I live in Turkey.","We work in Istanbul.","They like football.","You speak English very well."]},
{t:"Negatives and questions",e:"Olumsuz için don’t (do not), soru için Do başa gelir. Fiil yalın kalır. Kısa cevap: Yes, I do. / No, I don’t.",f:"I don’t like… / Do you like…? — Yes, I do.",ex:["I don’t eat meat.","Do you drink coffee? — Yes, I do.","We don’t live in a big city.","Where do they work?"]}],
phr:{t:"Ordering (Sipariş verme)",items:["Can I help you?","I’d like a cheese sandwich, please.","Can I have an orange juice?","Anything else?","No, thanks. How much is that?","Eat in or take away?"]},
lis:{t:"What do you have for breakfast?",text:"Interviewer: What do you have for breakfast, Mehmet?\nMehmet: I have bread, cheese, olives and tomatoes. And I drink tea – always tea!\nInterviewer: And you, Lucy?\nLucy: I don’t eat breakfast. I just drink a big coffee. But I have a big lunch!",
q:[["What does Mehmet drink?",["Tea","Coffee","Juice"],0],["Does Lucy eat breakfast?",["No","Yes, every day","Only at weekends"],0],["When does Lucy have a big meal?",["At lunch","At breakfast","At night"],0]]},
spk:{p:["What do you have for breakfast, lunch and dinner?","Ask your partner: Do you like…? (five foods)","Where do you live and work or study?","Role-play: Order food in a café."],m:"I live in Eskişehir with my family. I study at university. For breakfast I have eggs, bread and cheese. I don’t drink coffee – I drink tea. I like fruit, but I don’t like fish."},
wri:{task:"Günlük yeme-içme alışkanlıklarını anlat (40–60 kelime).",tips:["for breakfast / for lunch / for dinner kalıplarını kullan.","Bir olumsuz cümle ekle: I don’t…","and ve but ile bağla."],m:"I have breakfast at seven. I eat bread, cheese and olives, and I drink tea. For lunch I have a sandwich at work. I don’t eat junk food. For dinner my family and I eat together. We have soup, rice and vegetables. I like fruit, but I don’t like milk."},
quiz:[["I ___ in Ankara.",["live","lives","living"],0],["We ___ like fish.",["don’t","doesn’t","not"],0],["___ you drink coffee?",["Do","Are","Does"],0],["Do they work here? — Yes, they ___.",["do","are","work"],0],["I’d ___ a tea, please.",["like","likes","liking"],0],["The first meal of the day is ___.",["breakfast","lunch","dinner"],0]]},

{n:5,t:"Routines",tr:"Günlük rutinler",
lessons:[["5.1","Bir günüm","Present simple: he / she / it","Daily routines"],["5.2","Ne sıklıkla?","Adverbs of frequency","Days of the week"],["5.3","Saat kaç?","Telling the time","Times"],["5.4","Video dersi","—","Sıradan bir gün"]],
sum:"Günlük rutinler ve saatler. Geniş zamanı he/she/it ile (-s eki) kullanır, sıklık zarflarını (always, never…) öğrenir, saat sormayı ve söylemeyi çalışırsın.",
words:[["get up","kalkmak","I get up at seven."],["have a shower","duş almak","She has a shower in the morning."],["go to work / school","işe / okula gitmek","He goes to work by bus."],["start / finish","başlamak / bitirmek","My lessons start at nine and finish at three."],["go home","eve gitmek","We go home at six."],["go to bed","yatmak","I go to bed at eleven."],["morning / afternoon / evening","sabah / öğleden sonra / akşam","I study in the evening."],["Monday … Sunday","pazartesi … pazar","I don’t work on Sunday."],["weekend","hafta sonu","What do you do at the weekend?"],["always / never","her zaman / asla","I always have breakfast."],["What time is it?","saat kaç?","What time is it? — It’s half past four."],["o’clock / half past / quarter to","tam / buçuk / çeyrek var","It’s quarter to eight."]],
gram:[{t:"Present simple: he / she / it",e:"He, she, it ile fiile -s eklenir: works, lives. -s, -sh, -ch, -o ile bitenlere -es: watches, goes. Ünsüz + y → -ies: studies. have → has. Olumsuz: doesn’t + yalın fiil. Soru: Does…?",f:"She works / She doesn’t work / Does she work?",ex:["She gets up at six.","He doesn’t work on Saturday.","Does your sister like music? — Yes, she does.","My dad watches TV in the evening."]},
{t:"Adverbs of frequency",e:"always (%100), usually, often, sometimes, never (%0). Ana fiilden önce, be fiilinden sonra gelir.",f:"I always get up early. / He is never late.",ex:["I always have breakfast.","She sometimes goes to the gym.","We never work on Sunday.","He is often tired."]}],
phr:{t:"Telling the time (Saat)",items:["What time is it?","It’s three o’clock.","It’s half past ten.","It’s quarter past six.","What time does the film start?","At eight o’clock."]},
lis:{t:"Anna’s day",text:"Anna is a nurse. She works at night. She gets up at four in the afternoon and has breakfast. She goes to work at seven o’clock in the evening. She finishes work at seven in the morning. Then she goes home and goes to bed. She never works at the weekend. On Saturday she always meets her friends.",
q:[["What is Anna’s job?",["Nurse","Teacher","Doctor"],0],["What time does she go to work?",["7 p.m.","7 a.m.","4 p.m."],0],["What does she do on Saturday?",["She meets her friends","She works","She sleeps all day"],0]]},
spk:{p:["Describe your typical day with times.","Ask your partner: What time do you…? (five questions)","How often do you…? Use always / sometimes / never.","Describe a family member’s day: He / She gets up at…"],m:"On weekdays I get up at half past six. I have a shower and have breakfast. I go to work at quarter to eight. I usually have lunch at one. I finish work at five and go home. In the evening I sometimes watch TV. I go to bed at eleven."},
wri:{task:"Bir aile üyenin ya da arkadaşının bir gününü anlat (50–60 kelime). he / she ile -s ekine dikkat et.",tips:["Saatleri kullan: at seven, at half past five.","Sıra bildiren kelimeler: first, then, after that.","Bir sıklık zarfı ekle."],m:"My brother Emre is a chef. He gets up at nine and has a big breakfast. Then he goes to the restaurant at eleven. He works all afternoon and evening. He has dinner at the restaurant. He finishes work at midnight and goes home by taxi. He always sleeps late on Monday because the restaurant is closed."},
quiz:[["She ___ at seven.",["gets up","get up","getting up"],0],["He ___ like coffee.",["doesn’t","don’t","isn’t"],0],["___ your father work in a bank?",["Does","Do","Is"],0],["My sister ___ English.",["studies","studys","study"],0],["I ___ late. I’m always on time.",["am never","never am","never"],0],["10:30 = It’s ___ ten.",["half past","quarter to","half to"],0]]},

{n:6,t:"Journeys",tr:"Yolculuklar",
lessons:[["6.1","Ulaşım","can / can’t","Transport"],["6.2","Seyahat soruları","Wh- questions","Travel words"],["6.3","Bilet almak","Buying a ticket","Tickets"],["6.4","Video dersi","—","Bir yolculuk"]],
sum:"Ulaşım ve yolculuklar. can/can’t ile yetenek ve olasılık anlatır, Wh- soru kelimelerini (what, where, when, how…) öğrenir, istasyonda bilet almayı çalışırsın.",
words:[["bus","otobüs","I go to school by bus."],["train","tren","The train is fast."],["car","araba","Can you drive a car?"],["taxi","taksi","Let’s take a taxi."],["plane","uçak","The plane leaves at ten."],["bike","bisiklet","I ride my bike to work."],["walk","yürümek","I walk to the station."],["ticket","bilet","A ticket to Izmir, please."],["single / return","tek yön / gidiş-dönüş","A return ticket, please."],["station / airport","istasyon / havalimanı","The airport is far from the city."],["fast / slow","hızlı / yavaş","The bus is slow, but the metro is fast."],["by bus / on foot","otobüsle / yürüyerek","I go to work on foot."]],
gram:[{t:"can / can’t",e:"Yetenek ve olasılık için. Tüm öznelerle aynıdır, fiil yalın gelir. Olumsuz: can’t (cannot). Soru: Can you…?",f:"I can drive. / She can’t swim. / Can you…?",ex:["I can ride a bike.","She can’t drive.","Can you speak English? — Yes, I can.","You can take the bus to the airport."]},
{t:"Wh- questions",e:"What (ne), Where (nerede), When (ne zaman), Who (kim), How (nasıl), How much (ne kadar, fiyat), How long (ne kadar süre).",f:"Wh- + be / do / can + özne…?",ex:["Where is the station?","When does the train leave?","How do you go to work?","How long is the journey?"]}],
phr:{t:"Buying a ticket (Bilet alma)",items:["A return ticket to Bursa, please.","What time is the next train?","Which platform is it?","How much is it?","Can I pay by card?","Have a good journey!"]},
lis:{t:"At the station",text:"Passenger: Hello. A single ticket to Oxford, please.\nClerk: That’s twelve pounds fifty.\nPassenger: What time is the next train?\nClerk: At ten fifteen, from platform three.\nPassenger: How long is the journey?\nClerk: About one hour.\nPassenger: Thank you!",
q:[["What ticket does the passenger buy?",["Single","Return","Two singles"],0],["What time is the next train?",["10:15","10:50","3:00"],0],["How long is the journey?",["About one hour","Twelve minutes","Three hours"],0]]},
spk:{p:["How do you go to work or school? How long is the journey?","What can you do? (drive, swim, ride a bike, cook…)","Ask your partner five Wh- questions about travel.","Role-play: Buy a train ticket."],m:"I go to university by metro. It’s fast and cheap. The journey is about twenty minutes. I can drive, but I don’t have a car. I can ride a bike, too. At the weekend I sometimes walk to the city centre."},
wri:{task:"İşe ya da okula nasıl gittiğini anlat (50–60 kelime).",tips:["by bus / on foot gibi kalıpları kullan.","can / can’t ile bir cümle ekle.","because ile neden açıkla."],m:"I live in a small town, and I work in the city. Every day I go to work by train. The journey is forty minutes. I like the train because I can read on it. I can’t drive, so I don’t have a car. In summer I sometimes ride my bike to the station."},

sum:"Geçmiş: çocukluk, hafta sonu ve özel günler. be fiilinin geçmiş hâli was/were’ü, düzenli ve düzensiz fiillerle past simple’ı öğrenir, geçmişle ilgili soru sormayı çalışırsın.",
words:[["yesterday","dün","I was at home yesterday."],["last night / last week","dün gece / geçen hafta","Where were you last night?"],["ago","önce","I was in London two years ago."],["born","doğmuş","I was born in 2004."],["visit","ziyaret etmek","We visited my grandparents."],["play","oynamak","They played football."],["watch","izlemek","I watched a film."],["go → went","gitmek → gitti","We went to the beach."],["see → saw","görmek → gördü","I saw my friends."],["have → had","yemek, sahip olmak → yedi, vardı","We had a great time."],["birthday","doğum günü","It was my birthday last Friday."],["party","parti","The party was fantastic."]],
gram:[{t:"was / were",e:"be fiilinin geçmiş hâli: I / he / she / it → was, you / we / they → were. Olumsuz: wasn’t / weren’t. Soru: Was he…? Were they…?",f:"I was / They were / Was she…?",ex:["I was born in Trabzon.","We were at school yesterday.","Was it a good film? — Yes, it was.","They weren’t at home."]},
{t:"Past simple",e:"Düzenli fiillere -ed eklenir (played, watched). Düzensiz fiillerin özel hâli vardır (go → went, see → saw). Olumsuz ve soruda did kullanılır, fiil yalın hâline döner.",f:"I watched / I didn’t watch / Did you watch?",ex:["I watched TV last night.","We went to the cinema on Saturday.","She didn’t go to work yesterday.","Did you have a good weekend? — Yes, I did."]}],
phr:{t:"The weekend (Hafta sonu sohbeti)",items:["How was your weekend?","It was great, thanks!","What did you do?","I went to the beach.","Really? That sounds nice.","And you?"]},
lis:{t:"Last weekend",text:"Hi, I’m Sam. Last weekend was great. On Saturday morning I played tennis with my sister. In the afternoon we went to a café and had a big cake. On Saturday evening I watched a film at home. On Sunday I visited my grandparents. We had lunch together. I didn’t do my homework – oops!",
q:[["What did Sam play on Saturday?",["Tennis","Football","Basketball"],0],["Who did he visit on Sunday?",["His grandparents","His friends","His teacher"],0],["What didn’t Sam do?",["His homework","His shopping","His exercise"],0]]},
spk:{p:["Where were you born? Where were you last night?","Tell your partner about last weekend.","Ask: Did you…? (five questions about yesterday)","Describe a great birthday from your past."],m:"I was born in Samsun in 2003. Last weekend I went to the cinema with my friends on Saturday. We saw a comedy. It was very funny. On Sunday I visited my aunt and we had lunch. I didn’t study, but I relaxed a lot."},
wri:{task:"Geçen hafta sonunu anlat (60–70 kelime).",tips:["On Saturday morning… / On Sunday… gibi zaman ifadeleri kullan.","Düzensiz fiillere dikkat et: went, saw, had.","Bir olumsuz cümle ekle."],m:"Last weekend was really nice. On Saturday morning I got up late and had a big breakfast with my family. In the afternoon I went to the park with my friend Zeynep. We walked and talked for two hours. In the evening we watched a film. On Sunday I visited my grandmother. She cooked my favourite food. I didn’t go out in the evening because I was tired."},

words:[["bank","banka","Is there a bank near here?"],["park","park","There’s a big park in my town."],["supermarket","süpermarket","The supermarket is open until ten."],["museum","müze","The museum is closed on Monday."],["hospital","hastane","The hospital is next to the school."],["restaurant","restoran","There are a lot of restaurants here."],["next to","yanında","The café is next to the bank."],["opposite","karşısında","The hotel is opposite the station."],["near","yakınında","I live near the sea."],["turn left / right","sola / sağa dön","Turn left at the bank."],["go straight on","düz git","Go straight on for two minutes."],["street","cadde, sokak","My street is very quiet."]],
gram:[{t:"there is / there are",e:"Bir yerde bir şeyin var olduğunu söylemek için: tekil → there is (there’s), çoğul → there are. Olumsuz: there isn’t / there aren’t. Soru: Is there…? Are there…? Türkçedeki ‘var / yok’.",f:"There’s a… / There are some… / Is there a…?",ex:["There’s a supermarket on my street.","There are two parks near my house.","Is there a bank near here? — Yes, there is.","There aren’t any museums in my town."]},
{t:"Prepositions of place",e:"in (içinde), on (üstünde / caddede), next to (yanında), opposite (karşısında), near (yakınında), between (arasında).",f:"The café is next to / opposite / between…",ex:["The bank is next to the post office.","The station is opposite the hotel.","The pharmacy is between the bank and the café.","I live near the university."]}],
phr:{t:"Directions (Yol tarifi)",items:["Excuse me, where’s the station?","Is it far?","Go straight on.","Turn left at the traffic lights.","It’s on the right, opposite the park.","Thank you very much!"]},
lis:{t:"Where’s the museum?",text:"Tourist: Excuse me, is there a museum near here?\nWoman: Yes, there is. Go straight on and turn right at the bank. The museum is on the left, opposite the park.\nTourist: Is it far?\nWoman: No, it’s about five minutes on foot.\nTourist: Great, thank you!",

spk:{p:["Describe your neighbourhood: There’s… / There are…","Ask your partner: Is there a … near your house?","Give directions from your classroom to the exit.","Describe your favourite place in your town."],m:"I live in a nice neighbourhood. There’s a big supermarket on my street and there are two cafés. There’s a park opposite my house. There isn’t a cinema, but there’s one near the city centre. I love the park because it’s quiet and green."},
wri:{task:"Mahalleni anlat (60–70 kelime): there is/are ve yer edatları kullan.",tips:["Önce genel bir cümle yaz: My neighbourhood is…","Yerleri edatlarla konumlandır.","Sevdiğin ve sevmediğin bir şey ekle."],m:"My neighbourhood is in the north of the city. It’s small but busy. There’s a bakery next to my building, and there’s a supermarket opposite it. There are three cafés and a small park. There isn’t a hospital, but there’s a pharmacy near the bus stop. I like my neighbourhood because the people are friendly, but there are a lot of cars."},

spk:{p:["What do you like and hate doing at the weekend?","What clothes do you usually wear?","Talk about a present you bought for someone.","Role-play: Buy clothes in a shop."],m:"I love shopping, but I hate shopping on Saturdays because it’s very busy. I usually wear jeans and a T-shirt. Last month I bought a watch for my dad. It was his birthday. He loved it and he wears it every day."},

{t:"Okuma",text:"Hello, I’m Oscar. I’m from Mexico, but now I live in a small town in Canada. There’s a lake near my house and there are a lot of trees. There isn’t a cinema, but there’s a nice café opposite the post office. Last winter was very cold – it was minus thirty! I didn’t like it at first, but now I love skiing. In June I’m going to go back to Mexico to see my family. I’d like to stay for a month.",

wri:{task:"Yaşadığın şehri anlat ve oraya gelecek bir arkadaşına plan öner (70–80 kelime).",m:"I live in Eskişehir. It’s a student city, so it’s young and lively. There’s a river in the centre and there are a lot of cafés next to it. There’s also a great science museum. Last year my friends and I went on a boat on the river – it was fantastic! When you come next month, we’re going to visit the old town. Why don’t we have dinner by the river, too? I’d like to show you my favourite café."}}

{n:1,t:"Welcome",tr:"Hoş geldin",
lessons:[["1.1","Nice to meet you","Present simple: be","Countries and nationalities"],["1.2","Travel light","this/that, these/those; possessives","Objects"],["1.3","Can I have a coffee?","Making requests","Tourist places"],["1.4","Fawlty Towers","BBC video dersi","Otele giriş, kayıt formu"]],
sum:"Kendini ve başkalarını tanıtma, ülkeler ve milliyetler, yolculuk eşyaları. be fiilinin tüm hâllerini, this/that/these/those’u ve iyelik yapılarını (my, Ali’s) tekrar edersin. Turistik yerlerde kibarca rica etmeyi öğrenir, otel kayıt formu doldurursun.",
words:[["country / nationality","ülke / milliyet","Italy is the country; Italian is the nationality."],["Germany / German","Almanya / Alman","Klaus is German. He’s from Germany."],["Brazil / Brazilian","Brezilya / Brezilyalı","Ana is Brazilian."],["China / Chinese","Çin / Çinli","Chinese food is popular here."],["passport","pasaport","Here’s my passport."],["suitcase","bavul","My suitcase is very heavy."],["sunglasses","güneş gözlüğü","These are my sunglasses."],["phone charger","telefon şarj aleti","Is that your phone charger?"],["tourist information","turist danışma","Ask at the tourist information office."],["museum / gallery","müze / galeri","The gallery opens at ten."],["single / double room","tek / çift kişilik oda","I’d like a double room, please."],["form","form","Please complete this form."]],
gram:[{t:"Present simple: be",e:"I am, you / we / they are, he / she / it is. Olumsuzu not ile: isn’t, aren’t. Soruda be başa gelir. Kısa olumlu cevaplarda kısaltma yapılmaz: Yes, I am (✗ Yes, I’m).",f:"I’m / you’re / she’s — Are you…? Yes, I am.",ex:["I’m from Turkey. I’m Turkish.","We aren’t Spanish – we’re Mexican.","Is he your teacher? — Yes, he is.","Where are they from?"]},
{t:"this / that / these / those; possessives",e:"this / these yakın, that / those uzak. İyelik sıfatları: my, your, his, her, our, their. İsimlerde ’s: Ali’s bag (Ali’nin çantası). -s ile biten çoğul isimlerde sadece ’: my parents’ house.",f:"this bag / those shoes / Ali’s phone",ex:["This is my passport.","Are those your sunglasses?","It’s my sister’s suitcase.","These aren’t our keys."]}],
phr:{t:"Making requests (Rica etme)",items:["Can I have a coffee, please?","Can I have a map, please?","Could I have the bill, please?","Sure, here you are.","Anything else?","No, that’s all, thanks."]},
lis:{t:"At the hotel",text:"Receptionist: Good evening. Welcome to the Park Hotel.\nGuest: Hello. I have a reservation. My name’s Kaya, Selim Kaya.\nReceptionist: Ah yes, a single room for three nights. Can I see your passport, please?\nGuest: Sure, here you are.\nReceptionist: Thank you. Please complete this form. Your room is 214, on the second floor. Breakfast is from seven to ten.",
q:[["What kind of room is it?",["Single","Double","Family"],0],["How many nights?",["Three","Two","Four"],0],["What is the room number?",["214","241","124"],0]]},
spk:{p:["Introduce yourself and a classmate.","What’s in your bag when you travel? Use this / these.","Make three requests at a tourist information office.","Role-play: Check into a hotel."],m:"Hi, I’m Ozan and this is my friend Laura. She’s Italian, from Milan. I’m Turkish. When I travel I always take my passport, my phone charger and my sunglasses. This is my suitcase – it’s small because I like travelling light!"},
wri:{task:"Bir dil kursuna kayıt için kendini tanıtan kısa paragraf yaz (50–70 kelime). Büyük harf kullanımına dikkat et.",tips:["İsimler, şehirler, ülkeler, milliyetler, diller ve günler büyük harfle yazılır.","I her zaman büyük.","Cümle başları büyük harfle."],m:"My name is Derya Aksoy and I’m from Trabzon in Turkey. I’m twenty-six years old. I’m a nurse and I work in a hospital. I speak Turkish and a little English. My husband’s name is Emir. He’s an engineer. I want to learn English because I’d like to work in Ireland one day. My classes are on Monday and Wednesday evenings."},

{n:2,t:"Lifestyle",tr:"Yaşam tarzı",
lessons:[["2.1","Join us!","Present simple: I/you/we/they","Activities"],["2.2","High flyers","Present simple: he/she/it","Daily routines; jobs"],["2.3","What time does it start?","Asking for information","The time"],["2.4","A Visit to Panama","BBC video dersi","İyi ve kötü misafirler"]],
sum:"Hobiler, günlük rutinler ve meslekler. Geniş zamanı tüm öznelerle (özellikle he/she/it -s eki) kullanır, and/but/or ile cümle bağlamayı öğrenirsin. Turist danışmada saat ve program sormayı çalışırsın.",
words:[["play the guitar","gitar çalmak","I play the guitar in a band."],["go running","koşuya gitmek","We go running in the park."],["do yoga","yoga yapmak","She does yoga every morning."],["join","katılmak, üye olmak","Join our photography club!"],["get up / go to bed","kalkmak / yatmak","He gets up at five."],["have lunch","öğle yemeği yemek","We have lunch at one."],["pilot","pilot","A pilot flies planes."],["chef","aşçı, şef","The chef works in the evening."],["receptionist","resepsiyonist","The receptionist answers the phone."],["shop assistant","tezgâhtar","She’s a shop assistant in a clothes shop."],["open / close","açılmak / kapanmak","What time does the museum close?"],["ticket office","bilet gişesi","The ticket office opens at nine."]],
gram:[{t:"Present simple: I / you / we / they",e:"Alışkanlıklar ve rutinler için. Olumsuz don’t, soru Do… ile kurulur. Fiil her zaman yalın.",f:"I play / I don’t play / Do you play?",ex:["We play tennis on Saturdays.","I don’t like football.","Do you go running? — Yes, I do.","What do they do at the weekend?"]},
{t:"Present simple: he / she / it",e:"Fiil -s alır (works, goes, watches, studies, has). Olumsuz doesn’t, soru Does… ile; bu durumda fiil yalın kalır.",f:"She works / She doesn’t work / Does she work?",ex:["He gets up at five because he’s a baker.","My mum doesn’t work on Fridays.","Does she like her job?","What time does the film start?"]}],
phr:{t:"Asking for information (Bilgi alma)",items:["Excuse me, what time does the museum open?","It opens at nine thirty.","What time does it close?","How much is a ticket?","Sorry, can you say that again?","Thanks for your help."]},
lis:{t:"At tourist information",text:"Tourist: Hello. What time does the castle open?\nAssistant: It opens at ten o’clock and closes at five thirty.\nTourist: How much is a ticket?\nAssistant: Twelve euros, or eight for students.\nTourist: Sorry, can you say that again?\nAssistant: Eight euros for students.\nTourist: Great. And is there a café?\nAssistant: Yes, next to the entrance.",
q:[["What time does the castle close?",["5.30","5.00","10.00"],0],["How much is a student ticket?",["€8","€12","€5"],0],["Where is the café?",["Next to the entrance","In the tower","There isn’t one"],0]]},
spk:{p:["Talk about activities you do in your free time. Link with and / but / or.","Describe the daily routine of someone in your family.","Which job would be good for you? Why?","Role-play: Ask for information at a tourist office."],m:"I usually go running in the morning and I do yoga at the weekend. I like reading, but I don’t like watching TV. My brother is a chef. He gets up late, at ten, and he starts work at two. He finishes at midnight, so he doesn’t have much free time."},
wri:{task:"Şehrine geleceğin bir arkadaşına evinde kalıp kalamayacağını soran e-posta yaz (60–80 kelime).",tips:["Hi …, ile başla.","Neden yazdığını söyle.","Tarih ve saat ver.","Love, / See you soon, ile bitir."],m:"Hi Clara,\nHow are you? I have some news – I’m coming to Barcelona for a conference next month, from 12 to 15 May! Can I stay with you for two or three nights? I don’t need much space – a sofa is fine. I finish work at five every day, so we can have dinner together in the evenings. I’d love to see your new flat.\nLet me know!\nLove,\nDefne"},

{n:3,t:"People",tr:"İnsanlar",
lessons:[["3.1","Big happy families","have/has got","Family"],["3.2","Real friends?","Adverbs of frequency","Personality"],["3.3","Are you free tonight?","Making arrangements","Time expressions"],["3.4","Diwali Celebrations","BBC video dersi","Özel bir gün"]],
sum:"Aile, kişilik ve arkadaşlık. have got ile sahip olduğun şeyleri ve aile bireylerini anlatır, sıklık zarflarıyla alışkanlıklarını söylersin. Arkadaşlarla buluşma ayarlamayı ve ilgini göstermeyi (Really? Great!) öğrenirsin.",
words:[["parents","anne-baba","My parents live in Antalya."],["grandparents","büyükanne ve büyükbaba","I visit my grandparents every Sunday."],["cousin","kuzen","My cousin is my best friend."],["aunt / uncle","teyze, hala / amca, dayı","My uncle has got three children."],["nephew / niece","erkek / kız yeğen","My niece is five years old."],["kind","nazik","She’s very kind to everyone."],["funny","komik","My brother is really funny."],["friendly","cana yakın","Our neighbours are friendly."],["shy","utangaç","He’s a bit shy with new people."],["clever","zeki","She’s clever and hard-working."],["Are you free…?","…müsait misin?","Are you free on Friday evening?"],["How about…?","…ne dersin?","How about seven o’clock?"]],
gram:[{t:"have / has got",e:"Sahiplik, aile ve fiziksel özellikler için (İngiliz İngilizcesi). I / you / we / they → have got, he / she / it → has got. Olumsuz: haven’t / hasn’t got. Soru: Have you got…? Has she got…?",f:"I’ve got / She’s got / Have you got…?",ex:["I’ve got two brothers.","She’s got blue eyes.","We haven’t got a car.","Has he got any children? — Yes, he has."]},
{t:"Adverbs of frequency",e:"always › usually › often › sometimes › hardly ever › never. Ana fiilden önce, be’den sonra gelir. Ayrıca cümle sonunda: once a week, twice a month, every day.",f:"I often… / She is always… / …once a week",ex:["My best friend always listens to me.","We sometimes argue.","He’s never late.","I call my parents twice a week."]}],
phr:{t:"Making arrangements (Buluşma ayarlama)",items:["Are you free on Saturday?","Sorry, I’m busy. How about Sunday?","Sunday’s fine. What time?","Let’s meet at the café at six.","Great! See you then.","Really? That’s great!"]},
lis:{t:"Making plans",text:"Jack: Hi Mia! Are you free on Friday evening?\nMia: Sorry, I’m busy on Friday. I’ve got a dance class.\nJack: Oh. How about Saturday?\nMia: Saturday’s fine. What do you want to do?\nJack: There’s a new Italian restaurant in town. How about dinner at eight?\nMia: Great idea! See you there.",
q:[["Why is Mia busy on Friday?",["She’s got a dance class","She’s working","She’s ill"],0],["When do they meet?",["Saturday","Friday","Sunday"],0],["What time?",["Eight","Seven","Six"],0]]},
spk:{p:["Talk about your family. Use have got.","Describe your best friend’s personality.","How often do you see your friends and family?","Role-play: Make an arrangement to meet a friend."],m:"I’ve got a big family. My mum’s got four sisters, so I’ve got lots of cousins. My best friend is Kaan. He’s funny and very kind, but he’s a bit shy with new people. We usually meet twice a week, and we always go to the same café!"},
wri:{task:"Ailen ve arkadaşların hakkında yaz (70–90 kelime). Kesme işaretini (’s) doğru kullan.",tips:["’s iyelik: my sister’s car.","’s kısaltma: she’s = she is / she has.","Kişilik sıfatları ekle."],m:"I’ve got a small family. My dad’s name is Ahmet and he’s a taxi driver. He’s very funny. My mum’s a teacher and she’s really kind. My brother’s twelve. He’s clever but a bit lazy! My best friend is Ece. She’s my cousin, too – her mother is my mum’s sister. Ece’s very friendly and she always helps me. We often study together and we go to the cinema once a month."},

{n:4,t:"Places",tr:"Yerler",
lessons:[["4.1","A place to stay","there is/are","Rooms and furniture; prepositions"],["4.2","Around town","can for possibility","Places in towns; prepositions"],["4.3","Can I help you?","Shopping","Things to buy"],["4.4","Favourite Places","BBC video dersi","Favori yer"]],
sum:"Ev, şehir ve alışveriş. there is/are ile evini ve şehrini anlatır, can ile bir yerde yapılabilecek şeyleri söylersin. Mağazada alışveriş diyaloğunu ve virgül kullanımını çalışırsın.",
words:[["living room / bedroom","oturma odası / yatak odası","There’s a big sofa in the living room."],["kitchen / bathroom","mutfak / banyo","The kitchen is small but bright."],["sofa / armchair","kanepe / koltuk","I watch TV on the sofa."],["fridge","buzdolabı","There’s milk in the fridge."],["cupboard / shelf","dolap / raf","The cups are in the cupboard."],["in front of / behind","önünde / arkasında","The car is in front of the house."],["under / above","altında / üstünde","The cat is under the table."],["post office / pharmacy","postane / eczane","Is there a pharmacy near here?"],["square","meydan","There’s a café in the main square."],["market","pazar","You can buy fresh fruit at the market."],["batteries / stamps","pil / pul","Where can I buy stamps?"],["receipt","fiş","Can I have a receipt, please?"]],
gram:[{t:"there is / there are",e:"Var / yok anlatımı. There’s a… (tekil), There are some… (çoğul, olumlu), There aren’t any… (olumsuz), Is there a…? / Are there any…? (soru).",f:"There’s a… / There are some… / Are there any…?",ex:["There’s a big window in my bedroom.","There are some books on the shelf.","There aren’t any chairs in the kitchen.","Is there a washing machine? — No, there isn’t."]},
{t:"can for possibility",e:"Bir yerde yapılabilecek şeyleri ve izinleri anlatır. can + yalın fiil; olumsuz can’t; soru Can I / you…?",f:"You can + fiil / You can’t + fiil / Can I…?",ex:["You can buy fresh bread at the market.","You can’t park here.","Can I pay by card?","In my town you can swim in the lake."]}],
phr:{t:"Shopping (Alışveriş)",items:["Can I help you?","Have you got any batteries?","Yes, they’re over there.","How much are they?","That’s four pounds fifty.","Can I have a bag, please?"]},
lis:{t:"My flat",text:"My flat is on the third floor of an old building. There’s a living room with a big sofa and two armchairs. There’s a small kitchen, but there isn’t a dining room, so we eat in the living room. There are two bedrooms. My bedroom is next to the bathroom. There’s a balcony and you can see the sea from it – I love it!",
q:[["Which floor is the flat on?",["Third","Second","First"],0],["Where do they eat?",["In the living room","In the kitchen","In the dining room"],0],["What can you see from the balcony?",["The sea","A park","The mountains"],0]]},
spk:{p:["Describe your home: There’s… / There are…","What can you do in your town? What can’t you do?","Describe your favourite room and where things are.","Role-play: Buy things in a small shop."],m:"I live in a flat with my parents. There are three bedrooms, a living room and a kitchen. My favourite room is my bedroom. There’s a bed next to the window and there’s a desk in front of the bed. There are a lot of books on the shelves. In my town you can walk by the river and you can eat great kebabs!"},
wri:{task:"Evini anlatan bir paragraf yaz (70–90 kelime). Listelerde virgül kullan.",tips:["Listelerde virgül: a sofa, two armchairs and a TV.","Yer edatları kullan.","Evinin en sevdiğin yanını söyle."],m:"I live in a small house with a garden. Downstairs there’s a living room, a kitchen and a bathroom. Upstairs there are two bedrooms. In the living room there’s a sofa, two armchairs, a TV and lots of plants. My bedroom is small, but it’s very bright. There’s a bed, a desk and a big window. Behind the house there’s a garden with an apple tree. You can sit there and read on summer evenings."},

{n:5,t:"Food",tr:"Yemek",
lessons:[["5.1","My fridge","Countable and uncountable nouns","Food and drink"],["5.2","A lifetime in numbers","how much/many; quantifiers","Containers"],["5.3","Are you ready to order?","Ordering in a restaurant","Restaurant words"],["5.4","Beach Barbecue","BBC video dersi","Özel bir yemek"]],
sum:"Yiyecek ve içecekler. Sayılabilen ve sayılamayan isimleri, a/an/some/any’yi, how much/how many sorularını ve a lot of / a little / a few gibi miktar ifadelerini öğrenirsin. Restoranda sipariş vermeyi çalışırsın.",
words:[["rice / pasta","pirinç / makarna","I eat rice three times a week."],["meat / chicken / fish","et / tavuk / balık","I don’t eat meat, but I eat fish."],["eggs","yumurta","There are six eggs in the fridge."],["butter","tereyağı","Is there any butter?"],["onions / potatoes","soğan / patates","We need some onions."],["a bottle of","bir şişe","a bottle of water"],["a packet of","bir paket","a packet of biscuits"],["a can of","bir kutu (teneke)","a can of cola"],["a cup of / a glass of","bir fincan / bir bardak","a cup of tea, a glass of milk"],["menu","menü","Can we see the menu, please?"],["starter / main course / dessert","başlangıç / ana yemek / tatlı","For dessert I’d like ice cream."],["bill","hesap","Could we have the bill, please?"]],
gram:[{t:"Countable and uncountable nouns",e:"Sayılabilen isimler tekil / çoğul olur (an egg, two eggs). Sayılamayanlar çoğul olmaz (rice, milk, bread). Olumlu cümlede some, olumsuz ve soruda any kullanılır.",f:"a / an + tekil / some + çoğul, sayılamayan / any (− ve ?)",ex:["There’s an apple and some bananas.","We’ve got some milk.","There isn’t any bread.","Are there any eggs?"]},
{t:"How much / many; quantifiers",e:"How many + sayılabilen çoğul; How much + sayılamayan. a lot of (çok, ikisiyle de), a few (birkaç, sayılabilen), a little (biraz, sayılamayan), not much / not many.",f:"How many eggs? / How much water? / a few, a little, a lot of",ex:["How many cups of coffee do you drink a day?","How much water do you drink?","I eat a lot of vegetables.","I put a little sugar in my tea."]}],
phr:{t:"In a restaurant (Restoranda)",items:["Are you ready to order?","I’d like the chicken soup, please.","For main course I’ll have the fish.","Could I have some water?","Is service included?","Could we have the bill, please?"]},
lis:{t:"Ordering a meal",text:"Waiter: Good evening. Are you ready to order?\nWoman: Yes. For starter I’d like the tomato soup, please.\nWaiter: And for main course?\nWoman: The grilled fish with potatoes.\nWaiter: Anything to drink?\nWoman: A bottle of sparkling water, please.\nWaiter: Would you like a dessert?\nWoman: No, thanks. Just the bill later, please.",
q:[["What does she have for a starter?",["Tomato soup","Salad","Chicken"],0],["What does she drink?",["Sparkling water","Orange juice","Tea"],0],["Does she order dessert?",["No","Yes, ice cream","Yes, cake"],0]]},
spk:{p:["What’s in your fridge now? Use some / any.","How much water / How many cups of tea do you drink a day?","Describe a special dish from your country.","Role-play: Order a meal in a restaurant."],m:"In my fridge there are some eggs, a lot of vegetables and a bottle of milk. There isn’t any meat. I drink a lot of tea – maybe six cups a day! A special dish from Turkey is mantı. It’s small pieces of pasta with meat inside, and you eat it with yoghurt and a little butter."},
wri:{task:"Sınıfının yemek alışkanlıkları üzerine kısa bir rapor yaz (80–100 kelime). Paragraflar kullan.",tips:["Paragraf 1: Konu ve kaç kişiye sordun.","Paragraf 2: Sonuçlar (most people, a few people…).","Paragraf 3: Kısa sonuç."],m:"Our class food survey\n\nWe asked twelve students in our class about their eating and drinking habits.\n\nMost people eat three meals a day, but four students don’t have breakfast. Everyone drinks tea, and nine people drink more than three cups a day. Only a few people drink coffee. Eight students eat meat every day, and two students are vegetarians. A lot of people eat fast food once a week.\n\nIn general, our class has quite healthy habits, but we drink a lot of tea!"},
quiz:[["There isn’t ___ milk.",["any","some","a"],0],["I’d like ___ apple.",["an","a","some"],0],["How ___ eggs do we need?",["many","much","lot"],0],["How ___ sugar do you want?",["much","many","few"],0],["a ___ of water",["bottle","packet","slice"],0],["Could we have the ___, please? We want to pay.",["bill","menu","dessert"],0]]},

{n:6,t:"The past",tr:"Geçmiş",
lessons:[["6.1","In their past","was/were","Dates and time phrases"],["6.2","Time twins","Past simple","Life story collocations"],["6.3","What did you do?","Asking follow-up questions","Activities"],["6.4","Nelson Mandela","BBC video dersi","Özel bir kişi"]],
sum:"Geçmiş, çocukluk ve hayat hikâyeleri. was/were ve past simple’ı (düzenli, düzensiz, olumsuz, soru) kullanır, -ed telaffuzunu çalışırsın. Sohbeti sürdürmek için takip soruları sormayı ve because/so ile kısa bir hayat hikâyesi yazmayı öğrenirsin.",
words:[["in 1999 / on 5 May","1999’da / 5 Mayıs’ta","I was born on 5 May 2001."],["ago","önce","I started school fifteen years ago."],["be born","doğmak","Where were you born?"],["grow up","büyümek","She grew up in a small village."],["leave school","okulu bitirmek","He left school at eighteen."],["go to university","üniversiteye gitmek","I went to university in Ankara."],["get a job","iş bulmak","She got a job in a bank."],["get married","evlenmek","My parents got married in 1995."],["have children","çocuk sahibi olmak","They had two children."],["retire","emekli olmak","My grandfather retired last year."],["How was it?","nasıldı?","You went to Rome? How was it?"],["What happened?","ne oldu?","What happened next?"]],
gram:[{t:"was / were",e:"be’nin geçmişi: I / he / she / it was, you / we / they were. Olumsuz: wasn’t, weren’t. Soru: Was / Were + özne.",f:"I was / They were / Were you…?",ex:["I was six in 2006.","My favourite toy was a red bike.","Were you a good student? — Yes, I was.","We weren’t at home last night."]},
{t:"Past simple",e:"Düzenli fiiller -ed alır; telaffuzu /t/ (worked), /d/ (played), /ɪd/ (started). Düzensiz fiillerin özel hâli vardır. Olumsuz ve soru did ile kurulur, fiil yalın kalır.",f:"I grew up / I didn’t grow up / Did you grow up…?",ex:["She grew up in Izmir.","I didn’t like school.","When did you leave school?","They got married and had three children."]}],
phr:{t:"Follow-up questions (Takip soruları)",items:["How was your weekend?","It was great. I went to a concert.","Really? Who did you go with?","What was it like?","What did you do after that?","Sounds fun!"]},
lis:{t:"Weekend chat",text:"Tom: Hi Sara! How was your weekend?\nSara: Great, thanks! I went to the mountains with my family.\nTom: Really? Where did you stay?\nSara: In a small hotel by a lake. On Saturday we walked for five hours!\nTom: Wow. Was it cold?\nSara: Yes, very cold at night. And you? What did you do?\nTom: Nothing special. I stayed at home and watched films.",
q:[["Where did Sara go?",["The mountains","The beach","The city"],0],["Where did she stay?",["In a hotel by a lake","With friends","In a tent"],0],["What did Tom do?",["Stayed at home and watched films","Walked in the mountains","Went to a concert"],0]]},
spk:{p:["Describe your favourite childhood things: toy, food, TV programme.","Tell your life story in five sentences.","Ask your partner about last weekend, with two follow-up questions.","Interview a classmate about a special day."],m:"When I was a child, my favourite toy was a blue car and my favourite food was my grandmother’s börek. I was born in Konya in 1998. I grew up there and I left school in 2016. Then I went to university in Istanbul. I got a job in 2021 and moved to Ankara."},
wri:{task:"Hayat hikâyeni yaklaşık 100 kelimede yaz. because ve so ile cümleleri bağla.",tips:["because: neden; so: sonuç.","Zaman ifadeleri: in 2010, two years later, then.","Düzensiz fiillere dikkat et."],m:"I was born in 1999 in a small town near Trabzon. I grew up there with my parents and my two brothers. I loved football, so I played every day after school. I left school in 2017 and went to university in Izmir because I wanted to study engineering. It was difficult at first because I didn’t know anyone, but I made great friends. I got my first job in 2022. Two years later I met my wife, Gül, at a friend’s wedding. We got married last summer and now we live in Izmir."},
quiz:[["I ___ born in 2001.",["was","were","did"],0],["Where ___ you yesterday?",["were","was","did"],0],["She ___ up in a small village.",["grew","growed","grow"],0],["When ___ you leave school?",["did","were","do"],0],["I didn’t ___ school.",["like","liked","likes"],0],["I was tired, ___ I went to bed early.",["so","because","but"],0]]},

{n:7,t:"Holidays",tr:"Tatiller",
lessons:[["7.1","Travel partners","Comparatives","Travel adjectives"],["7.2","The longest bike ride","Superlatives","Places"],["7.3","Can you tell me the way?","Giving directions","Places"],["7.4","Hong Kong","BBC video dersi","Bir şehrin bir bölgesini anlatma"]],
sum:"Tatiller ve seyahat. Karşılaştırma (cheaper, more comfortable) ve üstünlük (the cheapest, the most beautiful) yapılarını, seyahat sıfatlarını ve yol tarifini öğrenirsin. Kısa bir seyahat yazısı yazarsın.",
words:[["comfortable","rahat","The train is more comfortable than the bus."],["crowded","kalabalık","The beach was very crowded."],["relaxing","dinlendirici","It was a relaxing holiday."],["exciting","heyecan verici","New York is an exciting city."],["dangerous / safe","tehlikeli / güvenli","Is it safe to travel at night?"],["desert","çöl","The Sahara is a huge desert."],["mountain","dağ","Ağrı is the highest mountain in Turkey."],["lake / river","göl / nehir","We swam in the lake."],["island","ada","Bozcaada is a beautiful island."],["traffic lights","trafik ışıkları","Turn left at the traffic lights."],["crossroads / corner","kavşak / köşe","The café is on the corner."],["along / past","boyunca / önünden geçerek","Walk along the river and go past the bridge."]],
gram:[{t:"Comparatives",e:"Kısa sıfat: -er (cheap → cheaper). -e ile biten: -r (nice → nicer). Ünsüz-ünlü-ünsüz: son harf ikilenir (big → bigger). -y: -ier (easy → easier). Uzun sıfat: more + sıfat. Düzensiz: good → better, bad → worse, far → further. Karşılaştırılan şeyden önce than gelir.",f:"cheaper than / more comfortable than",ex:["The train is faster than the bus.","Hotels are more expensive than hostels.","My English is better than last year.","Travelling by car is easier than by bus."]},
{t:"Superlatives",e:"Kısa sıfat: the + -est (the cheapest). Uzun sıfat: the most + sıfat. Düzensiz: the best, the worst, the furthest. Genelde in / of ile: the biggest city in Turkey.",f:"the cheapest / the most beautiful / the best",ex:["Istanbul is the biggest city in Turkey.","It was the most exciting holiday of my life.","This is the best restaurant in town.","What’s the longest river in the world?"]}],
phr:{t:"Giving directions (Yol tarifi)",items:["Can you tell me the way to the station?","Go along this street.","Turn right at the crossroads.","Go past the church.","It’s on the corner, on your left.","Sorry, did you say left or right? — Right."]},
lis:{t:"How do you like to travel?",text:"Interviewer: How do you like to travel, Paul?\nPaul: By train. It’s slower than flying, but it’s more comfortable and more relaxing. I can read and look out of the window.\nInterviewer: And you, Nina?\nNina: I prefer flying. It’s the fastest way to travel, and sometimes it’s the cheapest too! I don’t like long journeys.",
q:[["Why does Paul like trains?",["They’re more comfortable","They’re faster","They’re cheaper"],0],["What does Paul do on the train?",["Reads and looks out of the window","Sleeps","Works"],0],["Why does Nina prefer flying?",["It’s the fastest","It’s relaxing","She loves airports"],0]]},
spk:{p:["How do you like to travel? Compare two types of transport.","What is the best place you visited? Why?","Plan a long journey: Which route is the fastest / cheapest / most interesting?","Give directions to a place in your town."],m:"I prefer travelling by bus because it’s cheaper than the train, and the buses are quite comfortable. The best place I visited was Cappadocia. It was more beautiful than in the photos, and the balloon trip was the most exciting thing on the holiday."},
wri:{task:"Bildiğin bir şehir ya da semt için kısa bir seyahat yazısı yaz (90–110 kelime).",tips:["Başlık koy.","Karşılaştırma ve üstünlük yapıları kullan.","Ziyaretçiye tavsiye ver: You can… / Don’t miss…"],m:"Kadıköy: Istanbul’s friendliest neighbourhood\n\nKadıköy is on the Asian side of Istanbul. It’s quieter than the old city and the prices are cheaper, but it’s still very lively. The best way to arrive is by ferry – it’s the most beautiful journey in the city!\n\nNear the port there’s a busy market where you can buy fresh fish, cheese and spices. Walk along the street to Moda and the sea. The cafés there are some of the nicest in Istanbul, and the sunset is fantastic.\n\nDon’t miss the street food. The stuffed mussels are the best in the city!"},
quiz:[["A plane is ___ than a train.",["faster","more fast","fastest"],0],["This hotel is ___ than that one.",["more expensive","expensiver","most expensive"],0],["It’s the ___ city in the country.",["biggest","bigger","most big"],0],["This is the ___ film of the year!",["best","better","goodest"],0],["Turn left at the traffic ___.",["lights","corner","crossroads"],0],["Walk ___ the river to the bridge.",["along","past","opposite"],0]]},

{n:8,t:"Now",tr:"Şimdi",
lessons:[["8.1","Having a great time","Present continuous","Verbs + prepositions"],["8.2","What a difference!","Present simple and continuous","Appearance"],["8.3","What do you recommend?","Recommending","Types of film"],["8.4","Changing Trends","BBC video dersi","Bir anket hakkında konuşma"]],
sum:"Şu an olanlar, dış görünüş ve filmler. Şimdiki zamanı (present continuous) ve geniş zamanla farkını öğrenir, insanların görünüşünü tarif edersin. Film türlerini ve tavsiye isteme/verme kalıplarını çalışırsın.",
words:[["wait for","…i beklemek","I’m waiting for the bus."],["listen to","…i dinlemek","She’s listening to music."],["look at","…e bakmak","Look at this photo!"],["talk to","…ile konuşmak","He’s talking to his boss."],["tall / short","uzun / kısa boylu","My brother is tall."],["slim / overweight","zayıf / kilolu","She’s slim with long hair."],["curly / straight hair","kıvırcık / düz saç","He’s got curly hair."],["beard / moustache","sakal / bıyık","My dad has got a grey beard."],["comedy","komedi","I love comedies – they make me laugh."],["horror film","korku filmi","I never watch horror films."],["action film / drama","aksiyon filmi / dram","Is it an action film or a drama?"],["recommend","tavsiye etmek","Can you recommend a good film?"]],
gram:[{t:"Present continuous",e:"Şu anda olan ve geçici eylemler: am / is / are + V-ing. Yazım: make → making, sit → sitting. Olumsuz: I’m not, isn’t, aren’t. Soru: Are you…? Is she…?",f:"I’m working / She isn’t working / Are you working?",ex:["I’m sitting on the beach and having a great time!","They’re waiting for the train.","Is it raining there?","What are you doing right now?"]},
{t:"Present simple and continuous",e:"Present simple: her zaman, genelde, alışkanlık. Present continuous: şu an, bu aralar, geçici. Durum fiilleri (like, know, want) genelde -ing almaz.",f:"He usually wears jeans, but today he’s wearing a suit.",ex:["I usually work in an office, but this week I’m working from home.","She often wears glasses, but she isn’t wearing them today.","What do you do? — I’m a nurse.","What are you doing? — I’m cooking."]}],
phr:{t:"Recommending (Tavsiye)",items:["Can you recommend a good film?","What kind of films do you like?","I really like comedies.","You should see…","It’s really funny / exciting.","What’s it about?"]},
lis:{t:"Film recommendations",text:"Dan: I want to watch a film tonight. Can you recommend something?\nAmy: What kind of films do you like?\nDan: Comedies and action films. I don’t like horror films.\nAmy: Then you should see ‘The Last Bus’. It’s an action comedy.\nDan: What’s it about?\nAmy: Two friends are travelling across Europe and everything goes wrong. It’s really funny!",
q:[["What films doesn’t Dan like?",["Horror films","Comedies","Action films"],0],["What kind of film is ‘The Last Bus’?",["An action comedy","A horror film","A drama"],0],["What’s it about?",["Two friends travelling across Europe","A bus driver","A family holiday"],0]]},
spk:{p:["Look around you. What are people doing right now?","Describe the appearance of someone you know.","Compare your usual routine with this week.","Recommend a film to a partner."],m:"Right now I’m sitting in a café. A woman next to me is reading a book and two students are talking. My best friend is tall and slim. She’s got long, straight hair and she usually wears glasses. I usually go to work by bus, but this week I’m walking because the weather is lovely."},
wri:{task:"Bir tatil fotoğrafını paylaşıyormuş gibi kısa bir açıklama yaz (60–80 kelime). Zamirleri (it, they, him…) doğru kullan.",tips:["Present continuous ile fotoğraftaki anı anlat.","Tekrardan kaçınmak için zamir kullan.","Bir soru sor."],m:"Hi everyone! Here we are in Fethiye. In this photo we’re sitting on the beach and eating ice cream. The man on the left is my cousin Okan – he’s laughing because a dog is trying to eat his ice cream! The sun is shining and we’re having a wonderful time. The water is warm and we swim in it every day. Tomorrow we’re visiting an old village in the mountains. Do you know it?"},
quiz:[["Look! It ___.",["’s raining","rains","rain"],0],["I ___ for the bus at the moment.",["’m waiting","wait","waiting"],0],["She usually ___ jeans.",["wears","is wearing","wear"],0],["What ___ you doing now?",["are","do","is"],0],["He’s got long ___ hair.",["curly","tall","slim"],0],["Can you ___ a good film?",["recommend","listen","wait"],0]]},

{n:9,t:"Transport",tr:"Ulaşım",
lessons:[["9.1","Citybikes","can/can’t, have to/don’t have to","Adjectives"],["9.2","Free ride","Articles: a/an, the, no article","Transport collocations"],["9.3","Sorry I’m late","Apologising","Excuses"],["9.4","Airport","BBC video dersi","Havalimanında sorunlar"]],
sum:"Şehir içi ulaşım, seyahat ve özür dileme. can/can’t ile izinleri, have to/don’t have to ile zorunlulukları anlatırsın. Artikelleri (a/an, the, artikelsiz) ve ulaşım kalıplarını (get on, catch a bus) öğrenir, gecikince özür dilemeyi çalışırsın.",
words:[["get on / get off","binmek / inmek","Get off at the next stop."],["catch / miss a bus","otobüse yetişmek / kaçırmak","I missed the bus this morning."],["take a taxi","taksiye binmek","Let’s take a taxi to the airport."],["traffic jam","trafik sıkışıklığı","Sorry, I was in a traffic jam."],["convenient","uygun, elverişli","The metro is very convenient."],["noisy / quiet","gürültülü / sessiz","The street is very noisy."],["passenger","yolcu","The bus was full of passengers."],["helmet","kask","You have to wear a helmet."],["boarding pass","biniş kartı","Here’s your boarding pass."],["cancelled / delayed","iptal edilmiş / gecikmiş","Our flight is delayed."],["I’m sorry I’m late.","geç kaldığım için özür dilerim","I’m sorry I’m late. My train was cancelled."],["Don’t worry.","merak etme, sorun değil","Don’t worry. It’s fine."]],
gram:[{t:"can / can’t, have to / don’t have to",e:"can: izin ve olasılık; can’t: izin yok. have to: zorunluluk (he / she / it → has to); don’t have to: gerekli değil.",f:"You can… / You can’t… / You have to… / You don’t have to…",ex:["You can use the bikes for thirty minutes free.","You can’t take bikes on the metro.","You have to wear a helmet.","You don’t have to pay with cash."]},
{t:"Articles: a / an, the, no article",e:"a / an: ilk kez bahsedilen, herhangi bir tekil şey, meslekler. the: bilinen, tekrar bahsedilen, tek olan (the sun), bazı ulaşım ve yerler (the bus, the station). Artikel yok: genel çoğul / sayılamayan, by + ulaşım (by bus), çoğu şehir ve ülke, go to work / school / bed.",f:"a bike → the bike / by car / go to work",ex:["I saw a man on a bike. The man was very fast.","I go to work by train.","The metro is the quickest way.","Bikes are good for the city."]}],
phr:{t:"Apologising (Özür dileme)",items:["I’m so sorry I’m late.","I missed my bus.","There was a traffic jam.","My phone battery died.","Don’t worry. It doesn’t matter.","That’s OK. Come in."]},
lis:{t:"Late again",text:"Woman: Good morning! I’m so sorry I’m late.\nBoss: What happened?\nWoman: I missed the bus, and then there was a terrible traffic jam on the bridge.\nBoss: Why didn’t you call?\nWoman: My phone battery died. I’m really sorry.\nBoss: OK, don’t worry. The meeting starts in five minutes.",
q:[["What did the woman miss?",["The bus","The train","The meeting"],0],["Where was the traffic jam?",["On the bridge","In the centre","Near the office"],0],["Why didn’t she call?",["Her phone battery died","She forgot","She was driving"],0]]},
spk:{p:["Compare transport in your city: buses, metro, taxis, bikes.","What rules are there on public transport? Use can / have to.","Tell a story: a time you were late.","Role-play: Apologise for being late and give an excuse."],m:"In my city the metro is the most convenient way to travel. It’s fast and cheap, but it’s very crowded in the morning. You have to buy a card, but you don’t have to buy a new ticket every time. You can’t eat on the metro. Taxis are comfortable, but they’re expensive."},
wri:{task:"Aksilikli bir yolculuk hikâyesi yaz (90–110 kelime). Bağlaçlar kullan: first, then, after that, finally.",tips:["Olayları sıraya koy.","Past simple kullan.","Hikâyeyi nasıl bittiğiyle bağla."],m:"Last Monday was a terrible day. First, my alarm didn’t ring, so I woke up at eight instead of seven. I ran to the bus stop, but I missed the bus. Then I decided to take a taxi. Unfortunately, there was a big traffic jam on the main road and we didn’t move for twenty minutes. After that, I got out and walked to the metro. Finally, I arrived at the office at ten. I was very stressed, but my boss smiled and said, ‘Don’t worry. The meeting is tomorrow!’"},
quiz:[["You ___ wear a helmet. It’s the law.",["have to","don’t have to","can"],0],["It’s free. You ___ pay.",["don’t have to","have to","can’t"],0],["She ___ to work on Saturdays.",["has","have","must"],0],["I go to school ___ bus.",["by","with the","on a"],0],["I saw ___ dog. ___ dog was very big.",["a / The","the / A","a / A"],0],["I ___ the bus, so I was late.",["missed","caught","took"],0]]},

{n:10,t:"The future",tr:"Gelecek",
lessons:[["10.1","Life’s a lottery","be going to; would like to","Plans"],["10.2","Survive","will, might (not), won’t","Phrases with get"],["10.3","Let’s do something new","Making suggestions","Art and culture"],["10.4","Wild Weather","BBC video dersi","Olağandışı hava"]],
sum:"Planlar, hayaller ve tahminler. be going to ile planlarını, would like to ile isteklerini, will / might / won’t ile tahminlerini anlatırsın. get ile kurulan kalıpları ve sanat-kültür etkinlikleri için öneride bulunmayı öğrenirsin.",
words:[["win the lottery","piyangoyu kazanmak","She won the lottery last year."],["give up work","işi bırakmak","He’s going to give up work next year."],["buy a house","ev almak","They’d like to buy a house by the sea."],["get lost","kaybolmak","Take a map – you might get lost."],["get wet","ıslanmak","Take an umbrella or you’ll get wet."],["get hungry / tired","acıkmak / yorulmak","You’ll get hungry, so take some food."],["get home","eve varmak","I’ll call you when I get home."],["exhibition","sergi","Let’s go to the photography exhibition."],["concert","konser","There’s a free concert in the park."],["theatre / play","tiyatro / oyun","Would you like to see a play?"],["weather forecast","hava durumu","The weather forecast says it will rain."],["storm","fırtına","There might be a storm tonight."]],
gram:[{t:"be going to; would like to",e:"be going to: önceden verilmiş kararlar ve planlar. would like to: istekler, hayaller (kibar); want to’dan daha naziktir.",f:"I’m going to + fiil / I’d like to + fiil",ex:["I’m going to save some money this year.","We’re not going to move house.","I’d like to travel around the world.","What would you like to do next year?"]},
{t:"will / might (not) / won’t",e:"Tahminler: will (eminim), might (belki), might not (belki değil), won’t (olmayacağından eminim). Fiil yalın gelir.",f:"It will… / It might… / It won’t…",ex:["It will be cold in the mountains.","You might see some bears.","We won’t get lost because we have a good map.","Take some water. You’ll get thirsty."]}],
phr:{t:"Making suggestions (Öneride bulunma)",items:["Let’s go to the exhibition.","Why don’t we see a play?","How about going to a concert?","That’s a great idea!","Hmm, I’m not sure. It sounds a bit boring.","OK, let’s do that."]},
lis:{t:"Something new this weekend",text:"Ana: Let’s do something new this weekend.\nLeo: Good idea. Why don’t we go to the theatre?\nAna: Hmm, I’m not sure. It’s quite expensive. How about the new photography exhibition? It’s free.\nLeo: Great! And there’s a jazz concert in the park on Sunday.\nAna: Perfect. But the forecast says it might rain on Sunday.\nLeo: OK, we’ll take umbrellas!",
q:[["Why doesn’t Ana want to go to the theatre?",["It’s expensive","It’s boring","It’s far"],0],["How much is the exhibition?",["It’s free","€10","€5"],0],["What might happen on Sunday?",["It might rain","The concert might be cancelled","It might be very hot"],0]]},
spk:{p:["What are you going to do next month? What would you like to do one day?","Make predictions: What will your life be like in ten years?","You’re going on a trip to the mountains. What might happen?","Make suggestions for a day out with friends."],m:"Next month I’m going to start a cooking course. One day I’d like to live abroad, maybe in Canada. In ten years I think I’ll have a good job and I might have children. I won’t live in this city – I’d like to live somewhere quieter."},
wri:{task:"Kısa bir hikâye yaz: Dağda ya da ormanda bir gezide işler ters gidiyor (90–110 kelime). Bağlaçlar kullan: when, then, because, so, but.",tips:["Başta plan neydi?","Ne ters gitti?","Nasıl bitti?"],m:"Last summer my friends and I went camping in the mountains. We were going to walk to a beautiful lake. The weather forecast said it might rain, but we didn’t listen. After three hours, the sky went dark and a big storm started. We got very wet and we got lost because we couldn’t see the path. Then we found a small hut, so we waited there. A shepherd came and gave us hot tea. When the rain stopped, he showed us the way. We didn’t see the lake, but it was an unforgettable day!"},
quiz:[["We’re ___ to buy a new car.",["going","go","will"],0],["I’d like ___ Spanish.",["to learn","learn","learning"],0],["Take a coat. It ___ be cold tonight.",["might","is","going"],0],["Don’t worry. I ___ forget.",["won’t","will","might to"],0],["How about ___ to the concert?",["going","go","to go"],0],["Take an umbrella or you’ll get ___.",["wet","lost","hungry"],0]]},

{n:11,t:"Health",tr:"Sağlık",
lessons:[["11.1","I don’t feel well","should/shouldn’t","The body; health"],["11.2","One thing at a time","Adverbs of manner","Communication"],["11.3","Help!","Offering to help","Verbs of movement"],["11.4","Fat or Sugar?","BBC video dersi","Diyetler, sağlık forumu"]],
sum:"Sağlık, vücut ve stres. should/shouldn’t ile tavsiye verir, durum zarflarıyla (slowly, carefully) bir şeyin nasıl yapıldığını anlatırsın. Yardım teklif etmeyi (I’ll… / Shall I…?) ve hareket fiillerini öğrenirsin.",
words:[["head / neck / back","baş / boyun / sırt","My back hurts."],["arm / hand / leg / foot","kol / el / bacak / ayak","I hurt my foot playing football."],["stomach ache","karın ağrısı","I’ve got a stomach ache."],["a cold / flu","soğuk algınlığı / grip","I think I’ve got a cold."],["cough / sore throat","öksürük / boğaz ağrısı","She’s got a bad cough."],["temperature","ateş","He’s got a high temperature."],["medicine","ilaç","Take this medicine three times a day."],["stressed","stresli","I feel stressed at work."],["carefully / slowly","dikkatlice / yavaşça","Drive carefully!"],["quickly / quietly","hızlıca / sessizce","She spoke quietly."],["climb / jump","tırmanmak / zıplamak","The cat climbed the tree."],["carry / push / pull","taşımak / itmek / çekmek","Can you push the door?"]],
gram:[{t:"should / shouldn’t",e:"Tavsiye için: should + yalın fiil; olumsuz shouldn’t. Soru: Should I…? Tüm öznelerle aynıdır.",f:"You should… / You shouldn’t… / Should I…?",ex:["You should drink a lot of water.","You shouldn’t go to work today.","Should I see a doctor? — Yes, you should.","He should go to bed early."]},
{t:"Adverbs of manner",e:"Bir şeyin nasıl yapıldığını anlatır; genelde sıfat + -ly (slow → slowly, careful → carefully, easy → easily). Düzensizler: good → well, fast → fast, hard → hard. Genelde fiilden ya da nesneden sonra gelir.",f:"He drives carefully. / She speaks English well.",ex:["Please speak slowly.","She sings beautifully.","He works hard and does everything well.","Eat slowly – it’s better for your stomach."]}],

lis:{t:"Radio advice: colds",text:"Do you have a cold? Here’s what you should do. First, you should rest and sleep a lot. You should drink plenty of water and hot drinks, like tea with honey and lemon. You shouldn’t go to work or school if you have a high temperature – stay at home. And remember, antibiotics don’t help with colds. If you don’t feel better after a week, you should see a doctor.",

spk:{p:["Give advice: your friend has a headache / a cold / stress.","What do you do slowly, quickly, well or badly?","Offer to help in three situations.","Talk about a healthy and an unhealthy habit you have."],m:"If you’ve got a cold, you should stay in bed and drink lots of tea. You shouldn’t go out in the cold. I speak English slowly, but I write it quite well. I cook badly – my family says I should take a cooking class! A healthy habit I have is walking every day, but I eat too much chocolate."},
wri:{task:"Bir sağlık forumunda stresli birine tavsiye yaz (80–100 kelime).",tips:["Empatiyle başla: I’m sorry to hear that.","should / shouldn’t ile 3–4 tavsiye ver.","Durum zarfı kullan: breathe slowly."],m:"Hi Mert,\nI’m sorry to hear you feel stressed. I had the same problem last year, so here’s my advice. First, you should do one thing at a time. Multi-tasking makes you slower, not faster. You should also go for a walk every day and breathe slowly and deeply. You shouldn’t check your work emails at night. Try to go to bed early and sleep well. Finally, you should talk to your manager about your work. Good luck – I hope you feel better soon!\nAyla"},

gram:[{t:"Present perfect",e:"Hayat deneyimleri, zaman belirtmeden: have / has + V3. ever (hiç), never (hiç … değil). Kısa cevap: Yes, I have. / No, I haven’t.",f:"I’ve been / She’s never seen / Have you ever…?",ex:["I’ve been to Germany twice.","She’s never eaten sushi.","Have you ever ridden a horse? — Yes, I have.","We’ve met a lot of interesting people."]},
{t:"Present perfect and past simple",e:"Deneyimden bahsederken present perfect; ne zaman, nerede, nasıl gibi ayrıntılara geçince past simple. Belirli bir geçmiş zaman varsa (last year, in 2019) her zaman past simple.",f:"Have you ever…? — Yes. I did it in 2020.",ex:["Have you ever been to Italy? — Yes, I went there last summer.","I’ve seen that film. I watched it on the plane.","He’s climbed a mountain. He climbed Uludağ in 2021.","Did you like it? — Yes, it was amazing."]}],

lis:{t:"Exciting experiences",text:"Interviewer: Have you ever done anything really exciting, Kate?\nKate: Yes! I’ve jumped out of a plane. I did a parachute jump three years ago in New Zealand.\nInterviewer: Wow! Were you afraid?\nKate: Terrified! But it was amazing. I’ve also swum with sharks.\nInterviewer: Really? Where?\nKate: In South Africa, in 2022. They were small sharks, but it was still scary!",
q:[["Where did Kate do the parachute jump?",["New Zealand","South Africa","Australia"],0],["When?",["Three years ago","In 2022","Last month"],0],["What else has she done?",["Swum with sharks","Climbed a mountain","Flown a plane"],0]]},
spk:{p:["Ask your partner: Have you ever…? (five questions). Ask follow-up questions in the past simple.","What are you afraid of? What are you good at or interested in?","Describe the most exciting thing you’ve done.","Role-play: Call a company with a problem and leave a message."],m:"I’ve been to five countries, but I’ve never been to Asia. I’ve ridden a horse – I did it in Cappadocia two years ago. It was fun, but I was a bit afraid. I’m afraid of heights, so I’ve never jumped out of a plane! I’m good at swimming and I’m interested in photography."},
wri:{task:"Heyecanlı ya da korkutucu bir deneyimini hikâye olarak yaz (100–120 kelime).",tips:["Present perfect ile gir: I’ve had many…","Ayrıntıları past simple ile anlat.","Duygularını söyle: I was terrified / excited."],m:"I’ve had a lot of adventures, but the scariest was my first scuba dive. It happened three years ago in Kaş. I wasn’t very good at swimming, and I was afraid of deep water. Before the dive, the instructor explained everything slowly and carefully. When we went under the water, I felt terrible and wanted to go back up. Then I saw a big turtle swimming next to me. It was so beautiful that I forgot my fear. We stayed down for forty minutes. I’ve been diving many times since then, and I love it."},

lis:{t:"A job interview",text:"Interviewer: So, can you tell me a bit about yourself?\nCandidate: Sure. I grew up in Ankara and I studied economics there. For the last four years I’ve worked for a small travel company. I’d describe myself as reliable and quite ambitious.\nInterviewer: What would you say is your main weakness?\nCandidate: To be honest, I find it hard to say no, so I sometimes take on too much work. I’m learning to plan my time better.\nInterviewer: And why do you want this job?\nCandidate: I’m particularly interested in working with international clients.",
