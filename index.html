spk:{p:["Interview a partner: Who has influenced you most? What are you most proud of?","Describe three sides of your personality with examples.","Which family member do you take after? How?","Role-play: A job interview – introduce yourself."],m:"I’d describe myself as easy-going but quite ambitious. I take after my father – we’re both stubborn and we both love football! The person I’ve always looked up to is my grandmother. She raised five children on her own and she never complained. I’m proudest of finishing my degree while working part-time."},
wri:{task:"Bir dil değişim sitesi için kendini tanıtan profil yaz (120–150 kelime).",tips:["Kişiliğini örneklerle anlat.","Farklı zamanlar kullan (I’ve…, I’m currently…, I’m going to…).","Nasıl biriyle tanışmak istediğini söyle."],m:"Hi! I’m Barış, a 27-year-old architect from Izmir. I’m currently working for a design studio in Istanbul, where I’ve lived for two years.\n\nPeople usually describe me as easy-going and curious. I love exploring new neighbourhoods, and I take photos of old buildings wherever I go. I’m also a big fan of science fiction and board games.\n\nI’ve studied English for many years, but I don’t get much chance to speak it, so I’m looking for someone to chat with once or twice a week. In return, I can help you with Turkish – it’s not as difficult as people think!\n\nNext year I’m going to apply for a master’s degree in the UK, so I’d especially like to meet people from Britain. If you’re friendly and patient, let’s talk!"},
quiz:[["Who ___ you this book?",["gave","did give","does gave"],0],["What are you interested ___?",["in","on","at"],0],["I ___ here since 2020.",["’ve lived","live","’m living"],0],["She ___ after her mother – they look the same.",["takes","looks","gets"],0],["He never changes his mind. He’s so ___.",["stubborn","reliable","sensitive"],0],["Could you tell me where ___?",["you work","do you work","you do work"],0]]},

{n:2,t:"Tales",tr:"Hikâyeler",
lessons:[["2.1","Gerçek mi, kurgu mu?","Present perfect and past simple","Types of story"],["2.2","Haberler","Narrative tenses","The news"],["2.3","Bir anı anlatmak","Telling a story","Story phrases"],["2.4","Video dersi","—","Bir hikâye anlatmak"]],
sum:"Hikâyeler, haberler ve efsaneler. Present perfect ile past simple arasındaki farkı pekiştirir, anlatı zamanlarını (past simple, past continuous, past perfect) birlikte kullanırsın. Bir anıyı ilgi çekici şekilde anlatmanın kalıplarını öğrenirsin.",
words:[["legend","efsane","There’s an old legend about this castle."],["fairy tale","masal","My grandmother told me fairy tales."],["thriller","gerilim","I couldn’t stop reading the thriller."],["plot","olay örgüsü","The plot has a surprising twist."],["main character","ana karakter","The main character is a young detective."],["headline","manşet","Did you see today’s headlines?"],["rescue","kurtarmak","Firefighters rescued a family from the fire."],["survive","hayatta kalmak","He survived three days in the desert."],["escape","kaçmak","The prisoners escaped through a tunnel."],["eventually","sonunda","Eventually, we found the right road."],["all of a sudden","birdenbire","All of a sudden, the lights went out."],["it turned out that","…olduğu ortaya çıktı","It turned out that he was her brother."]],
gram:[{t:"Present perfect and past simple",e:"Present perfect: zamanı belirtilmemiş deneyimler, şimdiyle bağlantılı sonuçlar, bitmemiş zaman dilimi (this week, today). Past simple: bitmiş zaman, belirli an (yesterday, in 2010), hikâyedeki olaylar.",f:"I’ve read it. (ne zaman önemsiz) / I read it last year.",ex:["I’ve read all of her novels.","I read her latest novel on holiday last summer.","Have you ever been on the news?","The story appeared in the paper yesterday."]},
{t:"Narrative tenses",e:"Past simple: ana olaylar, sırayla. Past continuous: arka plan, devam eden eylem. Past perfect: anlatılan andan daha önce olmuş olay.",f:"was walking (arka plan) → saw (olay) → had fallen (daha önce)",ex:["It was raining and people were hurrying home.","I was walking along the river when I heard a cry.","A boy had fallen into the water.","I jumped in and pulled him out."]}],
phr:{t:"Telling a story (Hikâye anlatma)",items:["This happened when I was…","You’ll never guess what happened.","At first, I thought…","Then, all of a sudden,…","In the end,…","Luckily / Unfortunately,…"]},
lis:{t:"A lucky escape",text:"This happened when I was working in a hotel in the mountains. One night I was locking the doors when I smelled smoke. Someone had left a cigarette burning in the library. All of a sudden, the curtains caught fire! I grabbed the fire extinguisher and, luckily, I managed to put the fire out before it spread. The manager gave me a week’s holiday as a thank you. It turned out that the guest who had left the cigarette was the hotel owner’s son!",
q:[["What was the speaker doing when he smelled smoke?",["Locking the doors","Sleeping","Serving dinner"],0],["What caught fire?",["The curtains","The kitchen","The roof"],0],["Who had left the cigarette?",["The hotel owner’s son","The manager","A cleaner"],0]]},
spk:{p:["What kinds of stories do you enjoy? Recommend a book or film.","Tell a true story about a lucky escape, using narrative tenses.","Have you ever been in an embarrassing situation? What happened?","Tell a traditional legend or fairy tale from your country."],m:"I’ve always loved thrillers. The best one I’ve read is about a journalist who discovers a secret. I read it last summer in two days! Something lucky happened to me last year. I was waiting for a train when I realised I had left my passport at home. I ran back to get it, and when I returned, the train was still there because it had been delayed."},
wri:{task:"Bir hikâye yarışması için ‘Şanslı bir gün’ başlıklı hikâye yaz (150–180 kelime).",tips:["Arka planla başla (past continuous).","Ana olayları past simple ile sırala.","Daha önceki olaylar için past perfect kullan.","Bağlaçlar: all of a sudden, eventually, it turned out."],m:"A Lucky Day\n\nIt was a cold Monday morning in January, and I was running late for the most important exam of my life. Snow was falling heavily and the buses weren’t running.\n\nI was standing at the bus stop, feeling desperate, when an old man in a battered car stopped in front of me. ‘Where are you going?’ he asked. I explained, and he offered me a lift.\n\nOn the way, we talked about my studies. It turned out that he had taught at the same university for thirty years. He gave me some great advice about staying calm in exams.\n\nWe arrived with two minutes to spare. I ran into the hall, sat down and took a deep breath. The exam went better than I had expected.\n\nThree weeks later, I got my results – I had passed with the highest grade in my year. I never found out the man’s name, but I’ve thought about him many times since that day."},
quiz:[["I ___ this book three times.",["’ve read","read","was reading"],0],["We ___ to Paris in 2018.",["went","have gone","had gone"],0],["I ___ TV when the lights went out.",["was watching","watched","had watched"],0],["When we arrived, the film ___.",["had started","has started","was start"],0],["All of a ___, the door opened.",["sudden","suddenly","surprise"],0],["___, after three hours, we found the hotel.",["Eventually","Actually","Recently"],0]]},

{n:3,t:"Future",tr:"Gelecek",
lessons:[["3.1","Gelecek planları","Future plans: present continuous, be going to, will","Arrangements"],["3.2","Geleceği tahmin etmek","Future predictions: will, might, could, likely","Future time phrases"],["3.3","Yanlış anlaşılmalar","Dealing with misunderstandings","Clarifying"],["3.4","Video dersi","—","Gelecek hakkında tartışma"]],
sum:"Planlar, tahminler ve yanlış anlaşılmalar. Gelecek yapılarını (present continuous, be going to, will) ayırt eder, tahminlerde kesinlik derecesini (definitely, likely, might, probably) ayarlamayı öğrenirsin. Günlük hayatta ve telefonda yanlış anlaşılmaları düzeltmeyi çalışırsın.",
words:[["in the long run","uzun vadede","In the long run, it’s a good investment."],["in a few years’ time","birkaç yıl içinde","In a few years’ time, most cars will be electric."],["the day after tomorrow","öbür gün","I’m flying the day after tomorrow."],["by the end of the year","yıl sonuna kadar","I’ll finish the course by the end of the year."],["definitely","kesinlikle","I’ll definitely be there."],["probably","muhtemelen","It’ll probably rain."],["(un)likely","(pek) olası (değil)","It’s unlikely that prices will fall."],["arrangement","ayarlanmış plan","I’ve made an arrangement to meet her."],["predict","tahmin etmek","Experts predict that cities will grow."],["sort out","halletmek, çözmek","Don’t worry, I’ll sort it out."],["misunderstand","yanlış anlamak","Sorry, I misunderstood you."],["What I meant was…","demek istediğim…","What I meant was Tuesday, not Thursday."]],
gram:[{t:"Future plans",e:"Present continuous: kişi, yer ve zamanı belli ayarlanmış planlar. be going to: niyetler ve önceden alınmış kararlar. will: konuşma anında alınan kararlar, teklifler ve sözler.",f:"I’m meeting… / I’m going to… / I’ll…",ex:["I’m having lunch with Selin on Friday.","I’m going to look for a new job this year.","The phone’s ringing. I’ll get it.","Are you doing anything this evening?"]},
{t:"Future predictions",e:"will / won’t: emin olduğun tahmin. be likely to / be unlikely to: olasılık. might / could / may: belki. definitely ve probably will’den sonra, won’t’tan önce gelir (I’ll probably… / I probably won’t…).",f:"will definitely / is likely to / might / probably won’t",ex:["Robots will definitely do more of our jobs.","Prices are likely to go up next year.","We might live on Mars one day.","I probably won’t finish the report today."]}],
phr:{t:"Misunderstandings (Yanlış anlaşılmalar)",items:["Sorry, did you say fifteen or fifty?","I think there’s been a misunderstanding.","What I meant was…","So, just to check,…?","Sorry, I didn’t catch that.","Let me explain again."]},
lis:{t:"A booking problem",text:"Customer: Hello, I’d like to confirm my table for tonight. The name’s Arslan.\nRestaurant: Let me see. I have Arslan for tomorrow evening at eight.\nCustomer: Tomorrow? I think there’s been a misunderstanding. I asked for tonight, Thursday.\nRestaurant: I’m sorry. So, just to check, a table for four, tonight at eight?\nCustomer: Actually, it’s for fourteen, not four. It’s my father’s birthday.\nRestaurant: Fourteen! Hold on. OK, we can do that, but it will be at nine, not eight.",
q:[["What was the first problem?",["The wrong day","The wrong name","The wrong restaurant"],0],["How many people are coming?",["Fourteen","Four","Forty"],0],["What time will they eat?",["Nine","Eight","Seven"],0]]},
spk:{p:["What are your plans and arrangements for next week?","Make predictions about work, transport and cities in 2050. Use likely / might / definitely.","Discuss: Will people still read paper books in thirty years?","Role-play: Sort out a misunderstanding about a booking."],m:"Next Tuesday I’m meeting a client in the morning, and on Friday I’m flying to Antalya for a wedding. In 2050, I think most cars will definitely be electric, and many people are likely to work from home. We might not need offices at all. But I don’t think books will disappear – people will probably still love paper books."},
wri:{task:"Bir arkadaşına gelecek planlarını ve beklentilerini anlatan e-posta yaz (150–180 kelime).",tips:["Kesin planlar için present continuous.","Niyetler için going to.","Tahminlerde kesinlik derecesini değiştir: definitely, probably, might."],m:"Hi Jess,\n\nThanks for your email – it was great to hear from you! You asked about my plans, so here’s an update.\n\nThe big news is that I’m moving to Izmir next month. I’ve found a flat near the sea, and my new job starts on 1 September. I’m going to take a week off before I start so I can get to know the city.\n\nI think the new job will be challenging, but I’m definitely ready for a change. My manager says I’m likely to travel a lot, which sounds exciting. I might also start a part-time course in photography if I have time.\n\nIn the long run, I’d like to have my own design company. I probably won’t do it for a few years, but it’s my dream.\n\nWhy don’t you come and visit in October? The weather will probably still be warm and we could go to the beach!\n\nLove,\nIrmak"},
quiz:[["I ___ my dentist at 3 p.m. tomorrow. It’s booked.",["’m seeing","will see","see"],0],["A: I’m thirsty. B: I ___ get you some water.",["’ll","’m going to","’m"],0],["It’s ___ to rain later, so take an umbrella.",["likely","probably","definitely"],0],["I ___ won’t finish today.",["probably","likely","sure"],0],["Sorry, I didn’t ___ that. Can you repeat it?",["catch","take","get on"],0],["Don’t worry, I’ll ___ out the problem.",["sort","find","work up"],0]]},

{n:4,t:"Jobs",tr:"Meslekler",
lessons:[["4.1","İş dünyası","must, have to, should (obligation)","Personal qualities"],["4.2","Eskiden ve şimdi","used to, would","Working conditions"],["4.3","Anlaşmaya varmak","Reaching agreement","Negotiation phrases"],["4.4","Video dersi","—","Hayalindeki iş"]],
sum:"İş hayatı, çalışma koşulları ve müzakere. Zorunluluk ve tavsiye için must, have to, should yapılarını; geçmişteki alışkanlıklar için used to ve would’u ayırt edersin. Toplantıda öneri sunma ve uzlaşmaya varma kalıplarını öğrenirsin.",
words:[["flexible hours","esnek çalışma saatleri","I love having flexible hours."],["perks / benefits","yan haklar","The perks include free lunch and a gym."],["career ladder","kariyer basamakları","She climbed the career ladder quickly."],["self-employed","serbest çalışan","He’s been self-employed for five years."],["apply for","başvurmak","I’m applying for a job in Berlin."],["get promoted","terfi almak","She got promoted after two years."],["resign / quit","istifa etmek","He resigned because of stress."],["be made redundant","işten çıkarılmak (kadro)","Fifty workers were made redundant."],["meet a deadline","son tarihe yetiştirmek","We worked late to meet the deadline."],["hard-working","çalışkan","Our team is very hard-working."],["compromise","uzlaşma; uzlaşmak","Let’s find a compromise."],["deal","anlaşma","OK, it’s a deal!"]],
gram:[{t:"must, have to, should",e:"must: konuşanın koyduğu güçlü zorunluluk ve yazılı kurallar. have to: dış kaynaklı zorunluluk. don’t have to: gerek yok. mustn’t: yasak. should / shouldn’t: tavsiye. must’ın geçmişi yoktur, had to kullanılır.",f:"must / have to / don’t have to / mustn’t / should",ex:["You must wear a badge at all times.","I have to start at eight on Mondays.","You don’t have to wear a suit on Fridays.","You shouldn’t check emails on holiday."]},
{t:"used to, would",e:"used to + V1: geçmişte olan ama artık olmayan alışkanlık ve durumlar. would + V1: geçmişte tekrarlanan eylemler (durum fiilleriyle kullanılmaz). Olumsuz: didn’t use to.",f:"I used to work… / We would meet… / I didn’t use to…",ex:["I used to work in a factory.","Every Friday we would all go out for dinner.","I didn’t use to like my boss, but now we’re friends.","Did you use to wear a uniform?"]}],
phr:{t:"Reaching agreement (Anlaşmaya varma)",items:["What if we…?","How about…?","I see what you mean, but…","I’m afraid I can’t agree to that.","Could we meet halfway?","So, are we agreed? — OK, it’s a deal."]},
lis:{t:"Working from home",text:"Manager: So, you’d like to work from home three days a week?\nEmployee: Yes. I spend nearly three hours a day commuting.\nManager: I see what you mean, but the team needs you here for meetings. How about two days at home?\nEmployee: What if I came in on Monday, Wednesday and Friday, and worked from home on the other days?\nManager: Hmm, but we have our team meeting on Thursdays.\nEmployee: Could we move the meeting to Wednesday?\nManager: I’ll ask the others. If they agree, it’s a deal.",
q:[["Why does the employee want to work from home?",["A long commute","Health problems","Childcare"],0],["How many days does the manager first offer?",["Two","Three","One"],0],["What is the problem with Thursday?",["The team meeting","Clients visit","The office is closed"],0]]},
spk:{p:["What are the most important qualities for your job or dream job?","Describe the rules in a place you’ve worked or studied. Use must / have to / don’t have to.","How has work changed since your parents’ time? Use used to / would.","Role-play: Negotiate working conditions with a manager."],m:"In my last job we had to start at seven and we couldn’t use our phones at all. We didn’t have to wear a uniform, though. My father used to work in a bank. He would get up at six every day, and he stayed with the same company for forty years. Nowadays people change jobs much more often."},
wri:{task:"Bir iş başvurusu için ön yazı (cover letter) yaz (150–180 kelime).",tips:["Resmî selamlama ve hangi işe başvurduğun.","İlgili deneyim ve kişisel özellikler.","Neden bu şirket?","Resmî kapanış: I look forward to hearing from you."],m:"Dear Ms Collins,\n\nI am writing to apply for the position of Customer Service Manager, which I saw advertised on your website.\n\nI have worked in customer service for six years, first at a busy call centre and, for the last three years, as a team leader at Mavi Travel. In my current role, I have to manage a team of eight people and deal with difficult complaints. I used to find conflict stressful, but I have learned to stay calm and find solutions that work for everyone.\n\nI would describe myself as hard-working, reliable and flexible. I am also used to working under pressure and meeting tight deadlines.\n\nI am particularly interested in your company because of your focus on sustainable tourism, which is something I care about deeply.\n\nI have attached my CV and I would be happy to provide references. I look forward to hearing from you.\n\nYours sincerely,\nEce Güler"},
quiz:[["You ___ smoke in the building. It’s forbidden.",["mustn’t","don’t have to","shouldn’t to"],0],["It’s optional. You ___ come to the meeting.",["don’t have to","mustn’t","haven’t"],0],["Yesterday I ___ work late.",["had to","must","have to"],0],["I ___ to live in London, but now I live in Rome.",["used","use","would"],0],["When I was young, we ___ play outside every day.",["would","used","were"],0],["Could we meet ___? You pay half, I pay half.",["halfway","in the middle way","at half"],0]]},

{n:5,t:"Solutions",tr:"Çözümler",
lessons:[["5.1","Hayatı kolaylaştıran icatlar","Comparatives and superlatives","Technology"],["5.2","Gündelik sorunlar","Question tags","Household problems"],["5.3","Tavsiye ve uyarı","Giving advice and warnings","Warnings"],["5.4","Video dersi","—","Bir sorun için çözüm önerisi"]],
sum:"Teknoloji, icatlar ve günlük sorunlara çözümler. Karşılaştırma yapılarının ileri kullanımlarını (far better, slightly cheaper, the more… the better) ve onay sorularını (question tags) öğrenirsin. Tavsiye verme ve uyarma kalıplarını çalışır, bir sorunu çözen bir öneri yazarsın.",
words:[["device","cihaz","This device measures your heart rate."],["gadget","pratik alet","My kitchen is full of useless gadgets."],["user-friendly","kullanıcı dostu","The app is very user-friendly."],["cutting-edge","son teknoloji","They use cutting-edge technology."],["out of date","eski, modası geçmiş","My laptop is completely out of date."],["break down","bozulmak","The washing machine broke down again."],["leak","sızdırmak; sızıntı","The roof is leaking."],["stuck","sıkışmış","The window is stuck – I can’t open it."],["fix / repair","tamir etmek","Can you fix the tap?"],["Watch out!","Dikkat et!","Watch out! The floor’s wet."],["Make sure you…","…den emin ol","Make sure you switch it off."],["Whatever you do, don’t…","Ne yaparsan yap, …me","Whatever you do, don’t touch that wire."]],
gram:[{t:"Comparatives and superlatives",e:"Fark büyükse much / far / a lot + comparative; küçükse slightly / a bit. Eşitlik: (not) as … as. İkili karşılaştırma: the more…, the better. Superlative ile: by far the best, one of the most…",f:"far better than / slightly cheaper / not as fast as / the more…, the more…",ex:["This phone is far better than my old one.","The new model is slightly more expensive.","It isn’t as user-friendly as I expected.","The more you practise, the easier it gets."]},
{t:"Question tags",e:"Onay almak ya da sohbeti sürdürmek için. Olumlu cümle → olumsuz tag; olumsuz cümle → olumlu tag. Cümledeki yardımcı fiil tekrar edilir; yoksa do / does / did kullanılır. I am → aren’t I?",f:"It’s broken, isn’t it? / You don’t know, do you?",ex:["You’ve tried turning it off and on again, haven’t you?","It works now, doesn’t it?","You didn’t forget the charger, did you?","I’m right, aren’t I?"]}],
phr:{t:"Advice and warnings (Tavsiye ve uyarı)",items:["Make sure you back up your files.","Don’t forget to…","Be careful with…","Watch out for…","Whatever you do, don’t…","If I were you, I’d…"]},
lis:{t:"Moving into a new flat",text:"Landlord: Right, so this is the kitchen. Make sure you turn off the gas after cooking – it’s an old cooker.\nTenant: OK. The fridge works, doesn’t it?\nLandlord: Yes, it’s brand new. But watch out for the bathroom tap – it leaks if you turn it too hard.\nTenant: And the window in the bedroom is stuck, isn’t it?\nLandlord: Yes, sorry. I’ll get someone to fix it next week. Oh, and whatever you do, don’t leave the front door open – the cat next door comes in!",
q:[["What should the tenant always do after cooking?",["Turn off the gas","Open the window","Clean the cooker"],0],["What’s the problem with the bathroom tap?",["It leaks if you turn it too hard","It doesn’t work","It’s stuck"],0],["Why shouldn’t she leave the door open?",["The neighbour’s cat comes in","It’s dangerous","It gets cold"],0]]},
spk:{p:["Compare three gadgets you use. Which is by far the most useful?","What household problems have you had? How did you solve them?","Give a new flatmate advice and warnings about your home.","Present an invention that solves an everyday problem."],m:"My phone is by far the most useful gadget I own, but my e-reader is slightly more relaxing to use. Last winter our boiler broke down and we had no hot water for a week. If I were you, I’d always keep a plumber’s number on your fridge. And whatever you do, don’t try to fix electrical things yourself!"},
wri:{task:"Bir yarışma için gündelik bir soruna çözüm getiren icat önerisi yaz (150–180 kelime).",tips:["Sorunu açıkla.","İcadı ve nasıl çalıştığını anlat.","Mevcut çözümlerle karşılaştır (far better, cheaper).","Neden kazanmalı?"],m:"The Smart Key Finder\n\nThe problem\nMost people waste hours every year looking for lost things, especially keys. It’s one of the most annoying everyday problems, isn’t it?\n\nThe solution\nMy invention is a tiny, waterproof tag that you attach to your keys, wallet or bag. When you can’t find something, you simply say ‘Where are my keys?’ to your phone, and the tag starts to beep and flash. The louder it beeps, the closer you are.\n\nWhy it’s better\nSimilar products already exist, but they are far more expensive and the batteries only last a few months. My tag is slightly cheaper to produce and it charges using light, so you never have to replace the battery. It’s also much more user-friendly: there are no buttons and no complicated settings.\n\nWhy it should win\nIt’s simple, environmentally friendly and it will save people time and stress every single day."},
quiz:[["This laptop is ___ faster than my old one.",["much","more","very"],0],["The bus is ___ as fast as the train.",["not","less","no"],0],["The ___ you practise, the better you get.",["more","most","much"],0],["You’ve met Tom, ___ you?",["haven’t","have","didn’t"],0],["She didn’t call, ___ she?",["did","didn’t","does"],0],["___ out! The floor’s wet.",["Watch","Look up","Make"],0]]},

{n:6,t:"Emotion",tr:"Duygular",
lessons:[["6.1","Duygular","Zero and first conditional","Feelings; -ed / -ing adjectives"],["6.2","Hayal edelim","Second conditional","Verb–noun collocations"],["6.3","Haber vermek","Giving news","Reacting to news"],["6.4","Video dersi","—","Duygusal bir an"]],
sum:"Duygular, hayaller ve haber verme. Zero, first ve second conditional yapılarını kullanır, -ed ve -ing sıfatlarını (bored / boring) ayırt edersin. İyi ve kötü haber verme ve habere tepki gösterme kalıplarını öğrenirsin.",
words:[["bored / boring","sıkılmış / sıkıcı","I was bored because the film was boring."],["frightened / frightening","korkmuş / korkutucu","The storm was frightening."],["confused / confusing","kafası karışmış / kafa karıştırıcı","The instructions are confusing."],["embarrassed / embarrassing","utanmış / utandırıcı","It was so embarrassing!"],["relieved","rahatlamış","I was relieved when I passed."],["upset","üzgün, keyifsiz","She was upset about the news."],["anxious","kaygılı","He gets anxious before exams."],["make a decision","karar vermek","It’s hard to make a decision."],["take a risk","risk almak","Sometimes you have to take a risk."],["lose your temper","öfkesine yenilmek","He lost his temper and shouted."],["You’re joking!","Şaka yapıyorsun!","You won? You’re joking!"],["I’m sorry to hear that.","Bunu duyduğuma üzüldüm.","I’m sorry to hear that you’re ill."]],
gram:[{t:"Zero and first conditional",e:"Zero conditional: her zaman doğru olan sonuçlar (If + present, present). First conditional: gerçek bir olasılık ve sonucu (If + present, will + V1). when, as soon as ve unless (= if not) ile de kurulur.",f:"If you heat ice, it melts. / If it rains, we’ll… / Unless you hurry, you’ll…",ex:["If I don’t sleep enough, I get irritable.","If you call her now, she’ll be happy.","Unless we leave now, we’ll miss the train.","I’ll text you as soon as I arrive."]},
{t:"Second conditional",e:"Şimdi ya da gelecekte gerçek olmayan, hayal ürünü durumlar: If + past simple, would + V1. be ile genelde were kullanılır. could ve might da olur.",f:"If I had…, I would… / If I were you, I’d…",ex:["If I won a lot of money, I’d travel for a year.","If I were you, I’d talk to her.","What would you do if you lost your job?","If I had more time, I could learn the piano."]}],
phr:{t:"Giving news (Haber verme)",items:["Guess what? I’ve got some good news.","I’m afraid I’ve got some bad news.","You’re joking!","That’s fantastic! Congratulations!","Oh no, I’m sorry to hear that.","What a relief!"]},
lis:{t:"Good news and bad news",text:"Selin: Hi Mark. Guess what? I’ve got some good news!\nMark: Go on, tell me!\nSelin: I got the job in Barcelona!\nMark: You’re joking! That’s fantastic. Congratulations!\nSelin: Thanks! But I’ve also got some bad news. I have to start in two weeks, so I can’t come to your wedding.\nMark: Oh no, that’s a shame. But I understand. If you can, send a video message!\nSelin: Of course I will.",
q:[["What is Selin’s good news?",["She got a job in Barcelona","She’s getting married","She won a prize"],0],["What is her bad news?",["She can’t come to Mark’s wedding","She lost her job","She’s moving next year"],0],["What does Mark ask her to do?",["Send a video message","Visit him in two weeks","Change her plans"],0]]},
spk:{p:["What makes you anxious, relieved or embarrassed? Give examples.","Complete: If I don’t…, I… / If it’s sunny this weekend, I’ll…","What would you do if you could live anywhere or had a free year?","Role-play: Give good and bad news to a friend."],m:"I get anxious before job interviews. If I don’t prepare well, I always feel terrible. If it’s sunny this weekend, I’ll go hiking with my brother. If I had a free year, I’d travel around South America and learn Spanish. I wouldn’t take my laptop!"},
wri:{task:"Bir dergi için ‘Bir yıl çalışmak zorunda olmasaydın ne yapardın?’ konulu yazı yaz (150–180 kelime).",tips:["Second conditional kullan.","Duygularını -ed / -ing sıfatlarıyla anlat.","Sonuç paragrafında gerçek hayatla bağ kur (first conditional)."],m:"A Year Off\n\nIf I didn’t have to work for a year, I wouldn’t waste a single day.\n\nFirst, I would travel. I’ve always been fascinated by Japan, so I’d spend three months there learning the language and staying with local families. If I had enough money left, I’d continue to South Korea and Vietnam.\n\nAfter that, I would come home and do something useful. I’d volunteer at an animal shelter, because I find it frustrating that so many dogs in my city have no home. I’d also finally learn to play the guitar properly – my playing is embarrassing at the moment!\n\nOf course, it would be a bit frightening not to have a routine. I might feel lost or bored after a few months. But I think the experience would be amazing.\n\nIn reality, I can’t take a whole year off. But if I save some money this year, I’ll take a month off next summer and start with Japan."},
quiz:[["If you heat ice, it ___.",["melts","will melt","would melt"],0],["If it ___ tomorrow, we’ll stay in.",["rains","will rain","rained"],0],["If I ___ rich, I’d buy a boat.",["were","am","will be"],0],["What ___ you do if you saw a ghost?",["would","will","did"],0],["The film was so ___ that I fell asleep.",["boring","bored","bore"],0],["You passed? That’s fantastic! ___!",["Congratulations","Sorry to hear that","What a shame"],0]]},

{n:7,t:"Success",tr:"Başarı",
lessons:[["7.1","Başarı hikâyeleri","Present perfect simple and continuous","Success"],["7.2","Yetenekler","Ability: can, could, be able to, manage to","Skills"],["7.3","Fikrini netleştirmek","Clarifying opinions","Opinion phrases"],["7.4","Video dersi","—","Başarılı bir kişi"]],
sum:"Başarı, yetenekler ve fikir tartışmaları. Present perfect simple ile continuous farkını (sonuç / süreç) öğrenir, yetenek anlatmak için can, could, be able to ve manage to yapılarını kullanırsın. Bir tartışmada fikrini netleştirmeyi ve örneklerle desteklemeyi çalışırsın.",
words:[["achieve","başarmak","She achieved her goal of running a marathon."],["achievement","başarı (elde edilen)","Finishing the degree was a great achievement."],["determined","kararlı","He’s determined to succeed."],["talented","yetenekli","She’s a talented musician."],["give up","vazgeçmek","Don’t give up – you’re nearly there!"],["make progress","ilerleme kaydetmek","I’ve made a lot of progress this year."],["reach your potential","potansiyeline ulaşmak","Good teachers help you reach your potential."],["set a goal","hedef koymak","I set myself a goal of reading twenty books."],["skill","beceri","Communication is an important skill."],["manage to","başarmak (zorlukla)","I managed to finish on time."],["I see what you mean, but…","ne demek istediğini anlıyorum ama…","I see what you mean, but money isn’t everything."],["The thing is,…","mesele şu ki…","The thing is, success means different things to different people."]],
gram:[{t:"Present perfect simple and continuous",e:"Simple: sonuç, miktar, kaç kez (I’ve written three chapters). Continuous: süre ve süreç, devam eden ya da yeni bitmiş eylem (I’ve been writing all morning). Durum fiilleri continuous almaz.",f:"have / has + V3 / have / has been + V-ing",ex:["She’s won three gold medals.","She’s been training for this race for two years.","I’ve read that book. — I’ve been reading it all week.","How long have you been learning English?"]},
{t:"Ability",e:"can / can’t: şimdiki yetenek. could / couldn’t: geçmişteki genel yetenek. be able to: diğer zamanlarda (will be able to, have been able to). managed to / was able to: geçmişte belirli bir durumda zorlukla başarmak (bu anlamda could kullanılmaz).",f:"can / could / will be able to / managed to",ex:["I can speak three languages.","I could swim when I was four.","After the course, you’ll be able to give presentations confidently.","The road was closed, but we managed to find another way."]}],
phr:{t:"Clarifying opinions (Fikrini netleştirme)",items:["What I mean is…","The thing is,…","Let me put it another way.","For example,…","I see what you mean, but…","That’s a good point."]},
lis:{t:"What is success?",text:"Ali: For me, success means earning a lot of money.\nNora: Really? I see what you mean, but I don’t agree. The thing is, lots of rich people are unhappy.\nAli: That’s a good point. What I mean is, money gives you freedom.\nNora: OK, but for me success is doing something you love. My uncle has been working as a gardener for thirty years. He doesn’t earn much, but he’s the happiest person I know.\nAli: Fair enough. Maybe success is a bit of both.",
q:[["What does Ali think success is at first?",["Earning a lot of money","Being famous","Being happy"],0],["What does Nora think?",["Success is doing something you love","Money is everything","Success is impossible"],0],["How long has Nora’s uncle been a gardener?",["Thirty years","Three years","Thirteen years"],0]]},
spk:{p:["What have you achieved this year? What have you been working on?","What could you do as a child that you can’t do now?","Describe a time you managed to do something difficult.","Discuss: Is talent more important than hard work?"],m:"This year I’ve finished my master’s thesis and I’ve been learning German for six months. When I was a child I could do the splits, but I definitely can’t now! Last year I managed to run a half marathon, even though I had a knee injury. I think hard work is more important than talent. The thing is, talent without practice doesn’t take you very far."},
wri:{task:"Hayran olduğun başarılı bir kişinin kısa biyografisini yaz (150–180 kelime). Gerçek ya da kurgusal olabilir.",tips:["Başlangıç ve zorluklar (past).","Başarıları (present perfect simple).","Hâlâ süren çalışmaları (present perfect continuous).","Yetenek yapıları: managed to, was able to."],m:"My Aunt Nur\n\nMy aunt Nur grew up in a small village where girls didn’t usually go to university. She couldn’t afford books, so she used to borrow them from the local teacher. She was so determined that she managed to win a scholarship to study medicine in Istanbul.\n\nLife in the city wasn’t easy. She worked as a waitress in the evenings and studied late at night. Eventually, she was able to graduate with excellent grades.\n\nSince then, she has achieved a lot. She has worked as a doctor in three countries, she has written two books about rural health and she has won an award for her work with children.\n\nFor the last five years, she has been running a free clinic in her home village, and she has been training young women to become nurses.\n\nWhat I admire most is that she never gave up. She says that success isn’t about talent – it’s about helping others reach their potential."},
quiz:[["I’ve ___ three emails this morning.",["written","been writing","write"],0],["I’ve ___ for you for an hour! Where were you?",["been waiting","waited","wait"],0],["How long have you ___ him?",["known","been knowing","know"],0],["When I was five, I ___ read.",["could","can","managed"],0],["The exam was hard, but I ___ to pass.",["managed","could","can"],0],["After this course you’ll be ___ to speak more fluently.",["able","can","managed"],0]]},

{n:8,t:"Communities",tr:"Topluluklar",
lessons:[["8.1","Yaşadığımız yerler","Articles","Communities; city life"],["8.2","Komşular","Relative clauses","Compound nouns"],["8.3","Şikâyet etmek","Making a complaint","Complaint phrases"],["8.4","Video dersi","—","Mahalle için bir proje"]],
sum:"Mahalle, komşuluk ve şehir hayatı. Artikelleri (a/an, the, artikelsiz) daha ileri düzeyde ve defining / non-defining relative clause’ları kullanırsın. Kibar ama etkili şikâyet etmeyi öğrenir, mahallen için bir öneri yazarsın.",
words:[["neighbourhood","mahalle","It’s a quiet neighbourhood."],["neighbour","komşu","Our neighbours are very friendly."],["community centre","halk merkezi","The community centre runs language classes."],["volunteer","gönüllü; gönüllü çalışmak","She volunteers at the food bank."],["sense of community","topluluk duygusu","There’s a strong sense of community here."],["rush hour","yoğun saat","Avoid driving in the rush hour."],["parking space","park yeri","It’s impossible to find a parking space."],["shopping centre","alışveriş merkezi","They’re building a new shopping centre."],["noise","gürültü","The noise from the bar keeps me awake."],["make a complaint","şikâyette bulunmak","I’d like to make a complaint."],["unacceptable","kabul edilemez","This is completely unacceptable."],["I’d appreciate it if…","…rsanız minnettar olurum","I’d appreciate it if you could fix it soon."]],
gram:[{t:"Articles",e:"a / an: ilk bahsedilen ya da herhangi biri. the: bilinen, tek olan, belirli (the city centre, the people next door), superlative’ler, bazı ülkeler (the UK). Artikel yok: genel anlamda çoğul ve sayılamayan isimler (People are…, Crime is…), çoğu ülke ve şehir, öğünler, go to school / work / bed.",f:"a park → the park / the best / People… (genel)",ex:["There’s a new café on our street. The café is always busy.","People in big cities are often lonely.","The people next door are really noisy.","She works as a nurse at the hospital in the city centre."]},
{t:"Relative clauses",e:"Defining: hangi kişi ya da şeyden bahsettiğimizi belirler, virgül yoktur, that kullanılabilir (who / which / that / where / whose). Non-defining: ek bilgi verir, virgülle ayrılır, that kullanılamaz. Defining’de nesne konumundaki who / which / that atılabilir.",f:"The man who lives… / My flat, which is small,…",ex:["The woman who lives upstairs is a doctor.","That’s the park where we play football.","My neighbour, whose dog barks all night, is moving.","The café we went to yesterday was great."]}],
phr:{t:"Making a complaint (Şikâyet etme)",items:["I’m afraid I have to make a complaint.","I’m not happy with…","This is the third time this has happened.","I’d appreciate it if you could…","Could you look into it, please?","I’m sorry about that. We’ll sort it out immediately."]},
lis:{t:"A noise complaint",text:"Resident: Hello, I’m calling from flat 12. I’m afraid I have to make a complaint about the noise from the restaurant downstairs.\nManager: I’m sorry to hear that. What’s the problem exactly?\nResident: Your staff are moving chairs and tables until after one a.m. This is the third time this week.\nManager: I apologise. The cleaning usually finishes at midnight.\nResident: I’d appreciate it if you could make sure it finishes earlier. I have to get up at six.\nManager: Of course. I’ll speak to the staff today.",
q:[["What is the noise?",["Staff moving chairs and tables","Loud music","Customers shouting"],0],["Until what time does it continue?",["After 1 a.m.","Midnight","Six a.m."],0],["What will the manager do?",["Speak to the staff","Close the restaurant","Call the police"],0]]},
spk:{p:["What makes a good neighbourhood? Describe yours.","Describe people, places and things using relative clauses.","Have you ever made a complaint? What happened?","Role-play: Complain to a neighbour or a manager."],m:"A good neighbourhood is one where people know each other. In my neighbourhood there’s a bakery whose owner knows everyone’s name, and there’s a small park where kids play every evening. The only problem is the traffic in the rush hour. Last year I complained to the council about a broken streetlight, and they fixed it in a week."},
wri:{task:"Belediyeye mahallen için bir öneri içeren resmî e-posta yaz (150–180 kelime).",tips:["Amacını belirt.","Mevcut sorunu açıkla.","Önerini ve faydalarını anlat (relative clauses).","Kibar talep: I would appreciate it if…"],m:"Dear Sir or Madam,\n\nI am writing to suggest an improvement to the area around Atatürk Park, where I have lived for eight years.\n\nAt the moment, there is an empty piece of land next to the park which is full of rubbish. It is not only ugly, but also dangerous for the children who play nearby.\n\nI would like to propose turning this space into a community garden. Residents, who would volunteer their time, could grow vegetables and flowers there. The garden could also be a place where older people and young families meet, which would create a stronger sense of community.\n\nSeveral neighbours, whose children go to the local primary school, have already offered to help. The school has also said that students could use the garden for science lessons.\n\nI would appreciate it if you could consider this proposal at the next council meeting. I would be happy to discuss it in more detail.\n\nYours faithfully,\nHakan Er"},
quiz:[["___ crime is a big problem in many cities. (genel)",["—","The","A"],0],["I live near ___ sea.",["the","a","—"],0],["The woman ___ lives next door is a pilot.",["who","which","whose"],0],["That’s the restaurant ___ we met.",["where","which","who"],0],["My brother, ___ lives in Paris, is a chef.",["who","that","which"],0],["I’d ___ it if you could turn the music down.",["appreciate","complain","accept"],0]]},

{n:9,t:"History",tr:"Tarih",
lessons:[["9.1","Dönüm noktaları","Third conditional","History"],["9.2","İcatlar ve keşifler","Active and passive","Inventions"],["9.3","Emin değilim","Expressing uncertainty","Uncertainty phrases"],["9.4","Video dersi","—","Tarihi bir an"]],
sum:"Tarih, icatlar ve keşifler. Geçmişe dair hayalî durumlar ve pişmanlıklar için third conditional’ı, olayları ve icatları anlatmak için edilgen yapıyı (was invented, has been discovered) kullanırsın. Emin olmadığın konularda konuşma kalıplarını öğrenirsin.",
words:[["century / decade","yüzyıl / on yıl","The building is from the 15th century."],["ancient","antik, çok eski","Ephesus is an ancient city."],["civilisation","medeniyet","The Hittite civilisation was very advanced."],["empire","imparatorluk","The Ottoman Empire lasted over 600 years."],["invent / invention","icat etmek / icat","The printing press was a huge invention."],["discover / discovery","keşfetmek / keşif","Penicillin was discovered by accident."],["turning point","dönüm noktası","The war was a turning point in history."],["historic / historical","tarihi (önemli) / tarihsel","It was a historic moment. She writes historical novels."],["remains","kalıntılar","The remains of a Roman city were found."],["I’m not sure, but…","emin değilim ama…","I’m not sure, but I think it was 1923."],["I have a feeling that…","…gibi bir his var içimde","I have a feeling it was invented in China."],["I haven’t got a clue.","hiçbir fikrim yok","Who invented it? — I haven’t got a clue!"]],
gram:[{t:"Third conditional",e:"Geçmişte gerçekleşmemiş bir koşul ve hayalî sonucu: If + past perfect, would have + V3. Pişmanlık ve eleştiri için de kullanılır. could have / might have da olur.",f:"If I had known, I would have come.",ex:["If I had left earlier, I wouldn’t have missed the train.","If Fleming hadn’t gone on holiday, he might not have discovered penicillin.","What would you have done if you had been there?","If we hadn’t met, I would have stayed in Ankara."]},
{t:"Active and passive",e:"Eylemi yapan önemli değilse, bilinmiyorsa ya da eylemin kendisine odaklanmak istiyorsan passive kullanılır: be + V3. Yapanı belirtmek için by.",f:"is made / was built / has been discovered / will be opened",ex:["The telephone was invented in 1876.","The pyramids were built over four thousand years ago.","A new species of bird has been discovered.","The museum will be opened next year."]}],
phr:{t:"Expressing uncertainty (Emin olmadığını belirtme)",items:["I’m not sure, but I think…","I have a feeling that…","It might have been…","I’d say it was about…","I’m fairly sure that…","I haven’t got a clue!"]},
lis:{t:"A history quiz",text:"Host: Question five. When was the first photograph taken?\nAnna: Hmm, I’m not sure. I’d say about 1900?\nBen: No, I have a feeling it was earlier. Maybe the 1820s?\nHost: Correct! It was taken in France in the 1820s. Question six. Which country was paper invented in?\nAnna: I haven’t got a clue.\nBen: I’m fairly sure it was China.\nHost: Correct again!",
q:[["What did Anna guess for the first photograph?",["About 1900","The 1820s","1850"],0],["Where was the first photograph taken?",["France","England","China"],0],["Where was paper invented?",["China","Egypt","Italy"],0]]},
spk:{p:["Talk about a turning point in your life: If I hadn’t…, I wouldn’t have…","Which invention has changed the world most? When and where was it invented?","Ask your partner history quiz questions and answer with uncertainty phrases.","Describe an important historical event in your country."],m:"A turning point in my life was moving to Izmir. If I hadn’t gone to university there, I wouldn’t have met my wife. I think the most important invention is the internet. It was developed in the US, I think in the late 1960s, and it has changed everything. I’m not sure exactly, but I have a feeling the first email was sent around 1971."},
wri:{task:"Hayatında ya da tarihte bir dönüm noktasını anlatan kısa bir makale yaz (150–180 kelime). Third conditional ve passive kullan.",tips:["Olayı ve zamanı tanıt (passive).","Ne değişti?","Olmasaydı ne olurdu? (third conditional)"],m:"The Day I Missed the Bus\n\nOn a rainy morning in 2015, I missed the bus to my first job interview. It sounds like a small thing, but it changed my life.\n\nI had been told that the company was very strict about punctuality, so I was in a panic. A woman who was waiting at the bus stop saw how stressed I was and offered me a lift. During the journey, we started talking about my studies in graphic design.\n\nIt turned out that she ran a small design studio. I arrived at the interview twenty minutes late and, not surprisingly, I wasn’t offered the job. But that evening I was contacted by the woman from the car. She asked me to come and show her my portfolio.\n\nI have worked for her studio for nine years now. If I hadn’t missed that bus, I would never have met her. And if she hadn’t stopped, I might have stayed in a job I didn’t enjoy."},
quiz:[["If I ___ known, I would have helped you.",["had","have","would have"],0],["If she had studied, she ___ the exam.",["would have passed","would pass","had passed"],0],["The telephone ___ by Bell.",["was invented","invented","has invent"],0],["A new bridge ___ next year.",["will be built","will build","is building"],0],["Many old coins ___ in the field last month.",["were found","found","have found"],0],["Who invented it? — I haven’t got a ___!",["clue","feeling","idea at"],0]]},

{n:10,t:"World",tr:"Dünya",
lessons:[["10.1","Dünya meseleleri","Reported speech","Global issues"],["10.2","Değişen dünya","Verb patterns","Reporting verbs"],["10.3","Fikir tartışması","Giving opinions; agreeing and disagreeing","Discussion phrases"],["10.4","Video dersi","—","Dünyayı değiştiren bir fikir"]],
sum:"Küresel sorunlar, çevre ve dünya meseleleri. Dolaylı anlatımı (reported speech) ve fiil kalıplarını (agree to, suggest -ing, advise someone to) kullanırsın. Bir tartışmada görüş bildirmeyi, katılmayı ve kibarca karşı çıkmayı öğrenirsin.",
words:[["climate change","iklim değişikliği","Climate change affects us all."],["poverty","yoksulluk","Millions of people live in poverty."],["inequality","eşitsizlik","Inequality is growing in many countries."],["shortage","kıtlık, eksiklik","There’s a water shortage this summer."],["renewable energy","yenilenebilir enerji","We need more renewable energy."],["sustainable","sürdürülebilir","We should choose sustainable products."],["campaign","kampanya","They started a campaign to save the forest."],["raise awareness","farkındalık yaratmak","The video raised awareness of plastic pollution."],["promise / refuse","söz vermek / reddetmek","The minister promised to act. He refused to comment."],["warn / advise","uyarmak / tavsiye etmek","Scientists warned that time was running out."],["suggest / deny","önermek / inkâr etmek","She suggested meeting online. He denied stealing it."],["It’s worth -ing","…meye değer","It’s worth recycling, even if it’s a small step."]],
gram:[{t:"Reported speech",e:"Aktarırken zaman genelde bir adım geriye kayar (am → was, will → would, have done → had done). Zaman ve yer kelimeleri değişir (today → that day). Sorular düz cümle sırasına döner: She asked where I lived. Evet / hayır sorularında if ya da whether kullanılır.",f:"She said (that)… / He told me (that)… / She asked if…",ex:["‘I’m worried.’ → She said she was worried.","‘We’ll reduce emissions.’ → The minister said they would reduce emissions.","‘Where do you live?’ → He asked me where I lived.","‘Have you signed the petition?’ → She asked if I had signed the petition."]},
{t:"Verb patterns",e:"Bazı fiiller to + V1 alır (agree, refuse, promise, decide). Bazıları -ing alır (suggest, deny, admit, avoid). Bazıları nesne + to + V1 alır (advise, warn, tell, ask someone to).",f:"agree to do / suggest doing / advise someone to do",ex:["The company agreed to reduce plastic packaging.","He denied breaking the window.","My doctor advised me to walk more.","She suggested using public transport."]}],
phr:{t:"Opinions (Görüş bildirme)",items:["As far as I’m concerned,…","I strongly believe that…","I couldn’t agree more.","I’m not so sure about that.","That’s true, but on the other hand,…","I see your point, but I still think…"]},
lis:{t:"A radio debate",text:"Presenter: Should plastic bags be banned completely?\nMert: As far as I’m concerned, yes. Scientists have warned that plastic is a huge threat to our oceans.\nEla: I see your point, but I’m not so sure a total ban is the answer. Many small shops told us they couldn’t afford paper bags.\nMert: That’s true, but on the other hand, people quickly get used to bringing their own bags. When our city introduced a small charge, bag use fell dramatically.\nEla: I couldn’t agree more that we need change. I just suggest doing it step by step.",
q:[["What does Mert want?",["A complete ban on plastic bags","More paper bags","No change"],0],["What did small shops say?",["They couldn’t afford paper bags","They wanted a ban","They didn’t use plastic"],0],["What does Ela suggest?",["Making changes step by step","Banning everything immediately","Doing nothing"],0]]},
spk:{p:["Which global issue worries you most? Why?","Report a conversation you had recently: He told me… She asked me…","Discuss: Should flying be more expensive to protect the environment?","Present an idea that could change the world."],m:"The issue that worries me most is climate change. Last week my friend told me that she had stopped eating meat because of it, and she suggested that I try it too. As far as I’m concerned, governments should invest much more in renewable energy. I see the point that flying is important for the economy, but I still think it should be more expensive."},
wri:{task:"‘Bireysel davranışlarımız dünyayı değiştirebilir mi?’ konulu görüş yazısı yaz (180–200 kelime).",tips:["Giriş: konu ve net görüş.","İki argüman ve örnekler (reported speech ile kaynak aktar).","Karşı görüş ve cevabı.","Sonuç."],m:"Can individual actions change the world?\n\nMany people believe that global problems like climate change are too big for individuals to solve. In my opinion, our personal choices matter more than we think.\n\nFirstly, small actions add up. If millions of people avoid single-use plastic, the effect is enormous. A friend of mine who works in a supermarket told me that sales of reusable bags had tripled in two years, and that the company had agreed to stop selling plastic ones.\n\nSecondly, individual actions influence others. When people see their friends cycling to work or eating less meat, they are more likely to try it themselves. This is how social change usually begins.\n\nOn the other hand, some people argue that companies and governments produce most of the pollution, so individuals cannot make a real difference. That is partly true. However, governments respond to what voters want, and companies respond to what customers buy.\n\nIn conclusion, individuals cannot solve global problems alone, but it is definitely worth trying. Our everyday choices send a clear message to those with the power to act."},
quiz:[["‘I’m tired.’ → She said she ___ tired.",["was","is","has been"],0],["‘I’ll help you.’ → He said he ___ help me.",["would","will","can"],0],["She asked me where ___.",["I lived","did I live","I do live"],0],["The company agreed ___ the price.",["to reduce","reducing","reduce"],0],["He suggested ___ a taxi.",["taking","to take","take"],0],["The doctor advised ___ more water.",["me to drink","me drinking","to me drink"],0]]}
];

wri:{task:"Bir dergi için ‘Unutamadığım bir gün’ başlıklı hikâye yaz (150–180 kelime). Anlatı zamanlarını kullan.",m:"A Day I’ll Never Forget\n\nIt was the summer of 2019 and I was working as a tour guide in Cappadocia. That morning, I was taking a group of tourists to see the balloons at sunrise. It was still dark and everyone was half asleep.\n\nWe had just arrived at the viewpoint when one of the tourists, an elderly man, suddenly fell to the ground. His wife started screaming. I had never done first aid in a real situation, but I had taken a course the year before.\n\nI called an ambulance and then checked his breathing. All of a sudden, he opened his eyes. It turned out that he hadn’t eaten anything since the previous afternoon and had simply fainted.\n\nThe ambulance arrived twenty minutes later and the doctors said he was fine. As the sun came up and hundreds of balloons rose into the sky, his wife hugged me and cried. I’ve seen that view many times since, but I’ll never forget that morning."}},

wri:{task:"Görüş yazısı: ‘Teknoloji hayatımızı daha mutlu mu yaptı?’ (180–200 kelime).",m:"Has technology made us happier?\n\nThere is no doubt that technology has changed our lives dramatically. But has it made us happier? In my view, the answer is both yes and no.\n\nOn the one hand, technology has made many things far easier. We can keep in touch with friends abroad, work from home and find information in seconds. My grandmother, who lives alone, told me that video calls had completely changed her life because she could see her grandchildren every day.\n\nOn the other hand, many people worry that we have become addicted to our devices. Some research suggests that people who spend hours on social media are more likely to feel anxious and lonely. If we hadn’t become so dependent on our phones, we might have more face-to-face conversations.\n\nIn conclusion, technology itself is neither good nor bad. If we use it wisely, it can make us happier. If we let it control us, it will do the opposite. It is worth asking ourselves regularly whether our devices are serving us or we are serving them."}},

let zTab="zaman",tFilter,irrMode="list";
const RK={A1:1,A2:2,B1:3,B2:4,C1:5};

const sayBtn=t=>`<button class="icon" data-act="say" data-t="${esc(t)}" aria-label="Dinle">▶</button>`;
function tlSvg(t){const y=34;let s=`<svg class="tl" viewBox="0 0 300 62" role="img" aria-label="Zaman çizelgesi"><line class="ax" x1="10" y1="${y}" x2="288" y2="${y}"/><polygon class="ax2" points="288,${y-4} 296,${y} 288,${y+4}"/><line class="now" x1="150" y1="14" x2="150" y2="${y+10}"/><text x="150" y="10" text-anchor="middle">şimdi</text><text x="12" y="58">geçmiş</text><text x="290" y="58" text-anchor="end">gelecek</text>`;
  (t.bars||[]).forEach(([a,b])=>s+=`<rect class="bar" x="${a}" y="${y-6}" width="${b-a}" height="12" rx="6"/>`);
  (t.stripes||[]).forEach(([a,b])=>s+=`<rect class="stripe" x="${a}" y="${y-6}" width="${b-a}" height="12" rx="3"/>`);
  if(t.arrow){const[a,b]=t.arrow;s+=`<path class="arr" d="M${a} ${y-9} Q ${(a+b)/2} ${y-26} ${b} ${y-9}"/><polygon class="ax2" style="fill:var(--teal)" points="${b-5},${y-13} ${b},${y-7} ${b+2},${y-14}"/>`;}
  (t.ref||[]).forEach(x=>s+=`<line class="ref" x1="${x}" y1="${y-14}" x2="${x}" y2="${y+14}"/>`);
  (t.dots||[]).forEach(x=>s+=`<circle class="dot" cx="${x}" cy="${y}" r="6"/>`);
  return s+"</svg>";}
function tenseCard(t){return `<article class="panel tcard" id="t-${t.id}"><div class="thd"><div><h3 style="margin-bottom:2px">${esc(t.en)}</h3><div class="m">${esc(t.tr)}</div></div><span class="lvl">${t.lv}</span></div>
  ${tlSvg(t.tl)}<div class="ftable">${t.f.map(r=>`<div class="fr"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join("")}</div>
  <h4>Ne zaman kullanılır?</h4><ul class="exs">${t.use.map(u=>`<li>${sayBtn(u[1])}<span><b>${esc(u[0])}</b><br>${esc(u[1])}</span></li>`).join("")}</ul>
  <h4>Sinyal kelimeler</h4><div class="chips">${t.sig.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>
  <h4>Sık yapılan hatalar</h4>${t.err.map(e=>`<div class="err"><span class="x">✗ ${esc(e[0])}</span><span class="v">✓ ${esc(e[1])}</span></div>`).join("")}
  <div class="tip">💡 ${esc(t.tip)}</div></article>`;}
const ZT=[["zaman","12 zaman"],["yapi","Diğer yapılar"],["karsi","Karşılaştırmalar"],["teknik","Çalışma teknikleri"],["fiil","Düzensiz fiiller"],["test","Zaman testi"]];
function zamanlar(){
  if(tFilter===undefined)tFilter=(DB.current&&RK[me().cefr])?me().cefr:null;

  return `<section class="hero" style="padding-bottom:0"><h1><span class="mark">Zamanlar</span> ve formüller</h1><p class="lead">12 zamanın formülleri, kullanım alanları, sinyal kelimeleri ve sık yapılan hatalar; ayrıca gelecek yapıları, koşul cümleleri, edilgen yapı, dolaylı anlatım, modallar, düzensiz fiiller ve çalışma teknikleri. Bu sayfa tüm seviyeler için ortak.</p></section>
  <nav class="tabs" role="tablist">${ZT.map(t=>`<button class="tab" role="tab" data-act="ztab" data-v="${t[0]}" aria-selected="${zTab===t[0]}">${t[1]}</button>`).join("")}</nav><div id="zc">${zContent()}</div>`;}
function zContent(){
  const filt=`<div class="panel"><h3>Seviyene göre göster</h3><div class="chips">${[null,"A1","A2","B1","B2","C1"].map(v=>`<button class="chip" data-act="tf" data-v="${v||""}" aria-pressed="${tFilter===v}">${v?v+" ve altı":"Tümü"}</button>`).join("")}</div></div>`;
  switch(zTab){
  case "zaman":{const A=["Simple","Continuous","Perfect","Perfect Continuous"];
    return filt+`<div class="panel"><h3>12 zamana genel bakış</h3><p class="m">Bir zamana dokun, açıklamasına git. Sağ üstteki etiket o zamanın genelde öğretildiği seviye.</p>
    <div class="tgw"><div class="tgrid"><div></div>${A.map(a=>`<div class="th">${a}</div>`).join("")}${["Past","Present","Future"].map(g=>`<div class="th">${g}</div>`+A.map(a=>{const t=TENSES.find(x=>x.grp===g&&x.asp===a);return `<button class="tcell ${lvOk(t.lv)?"":"off"}" data-act="tjump" data-v="${t.id}"><i>${t.lv}</i><b>${esc(t.en)}</b><span>${esc(t.tr)}</span></button>`;}).join("")).join("")}</div></div>
    <p class="m" style="margin-top:10px">Çizelgelerde: yeşil nokta bitmiş eylem, yeşil çubuk devam eden eylem, sarı kesikli çubuk süregelen eylem, kırmızı çizgi referans anı, kesikli siyah çizgi ‘şimdi’.</p></div>`+TENSES.filter(t=>lvOk(t.lv)).map(tenseCard).join("");}
  case "yapi":return filt+EXTRA.filter(x=>lvOk(x.lv)).map(x=>`<div class="panel"><div class="thd"><h3>${esc(x.t)}</h3><span class="lvl">${x.lv}</span></div><p>${esc(x.e)}</p>${x.rows.map(r=>`<div class="xr"><b>${esc(r[0])}</b><span>${esc(r[1])}</span><span class="ex">${sayBtn(r[2])}${esc(r[2])}</span></div>`).join("")}<div class="tip">💡 ${esc(x.tip)}</div></div>`).join("");
  case "karsi":return CMP.map(c=>`<div class="panel"><h3>${esc(c.t)}</h3><div class="cmp"><div><b>${esc(c.a[0])}</b>${esc(c.a[1])} ${sayBtn(c.a[1])}</div><div><b>${esc(c.b[0])}</b>${esc(c.b[1])} ${sayBtn(c.b[1])}</div></div><p class="m" style="margin:0">${esc(c.e)}</p></div>`).join("");
  case "teknik":return `<p class="lead" style="margin-top:12px">Zamanları ezberlemek yerine kullanarak öğrenmeni sağlayacak teknikler.</p><div class="techs">${TECH.map(t=>`<div class="panel tech" style="margin:0"><div class="ic">${t[0]}</div><h3 style="margin-top:6px">${esc(t[1])}</h3><p style="margin:0">${esc(t[2])}</p></div>`).join("")}</div>`;
  case "fiil":return `<div class="panel"><div class="btnrow" style="margin-top:0"><button class="btn ${irrMode==="list"?"pri":""}" data-act="irrmode" data-v="list">Liste</button><button class="btn ${irrMode==="test"?"pri":""}" data-act="irrmode" data-v="test">Kendini test et</button></div>
    <p class="m">${irrMode==="test"?"V2 ve V3 gizli. Önce aklından söyle, sonra gri kutuya dokunup kontrol et.":"V1: yalın hâl, V2: past simple, V3: past participle (present perfect, past perfect ve passive’de kullanılır)."}</p>

function streak(){const D=allDays();let n=0;const d=new Date();if(!D[dkey(d)])d.setDate(d.getDate()-1);while(D[dkey(d)]){n++;d.setDate(d.getDate()-1);}return n;}

const synth=("speechSynthesis" in window)?window.speechSynthesis:null;let voice=null;
function pickVoice(){if(!synth)return;const v=synth.getVoices();voice=v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;}
function speak(text,isDialog){
  if(!synth){toast("Bu cihazda sesli okuma desteklenmiyor. Metni göstererek çalışabilirsin.");return;}
  synth.cancel();
  const lines=isDialog?text.split("\n").filter(Boolean):[text];const pitch={};let k=0;
  lines.forEach(l=>{let t=l,p=1;const m=l.match(/^([A-Z][A-Za-z ]{0,14}):\s*(.*)$/);
    if(m){if(!(m[1] in pitch))pitch[m[1]]=(k++%2)?1.3:0.85;p=pitch[m[1]];t=m[2];}
    const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?voice.lang:"en-GB";u.rate=rate;u.pitch=p;synth.speak(u);});
}
function stopSpeak(){if(synth)synth.cancel();}

function qHTML(qs,key,start){start=start||0;
  return qs.map((x,i)=>{const cor=x[1][x[2]];const opts=shuffle(x[1].slice());
  return `<fieldset class="q" data-correct="${esc(cor)}"><legend><span class="qn">${start+i+1}</span><span>${fmt(x[0])}</span></legend>${opts.map(o=>`<label class="opt"><input type="radio" name="${key}-${start+i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</fieldset>`;}).join("");}
function grade(root){let c=0,t=0,empty=0;root.querySelectorAll("fieldset.q").forEach(f=>{t++;const sel=f.querySelector("input:checked");if(!sel)empty++;const cor=f.dataset.correct;
  f.querySelectorAll("label.opt").forEach(l=>{const v=l.querySelector("input").value;l.classList.remove("ok","bad");if(v===cor)l.classList.add("ok");else if(sel&&sel.value===v)l.classList.add("bad");});
  if(sel&&sel.value===cor)c++;f.querySelectorAll("input").forEach(i=>i.disabled=true);});return{c,t,empty};}
function verdict(p){return p>=85?"Harika! Bu konular sağlam.":p>=70?"İyi gidiyorsun; yanlışlarını tekrar et.":p>=50?"Geçer not. Dilbilgisi kartlarına bir kez daha bak.":"Bu üniteyi baştan tekrar etmeni öneririm.";}

function allWords(u){const b=u.words.map((w,i)=>({en:w[0],tr:w[1],ex:w[2],k:u.n+"-"+i}));
  const c=((store&&store.custom[u.n])||[]).map(w=>({en:w.en,tr:w.tr,ex:w.ex,k:"c"+u.n+"-"+w.id,id:w.id,mine:true}));return b.concat(c);}

Object.defineProperty(window,"TOTALW",{get:()=>U.reduce((a,u)=>a+allWords(u).length,0)});
function unitPct(u){const w=learnedCount(u)/allWords(u).length;const q=store.quiz[u.n]!=null?store.quiz[u.n]/6:0;const l=store.lis["lis"+u.n]!=null?store.lis["lis"+u.n]:0;const wr=wc(store.text["u"+u.n]||"")>=50?1:0;
  return Math.round((w*0.4+q*0.3+l*0.15+wr*0.15)*100);}
function nextStep(){for(const u of U){if(learnedCount(u)<allWords(u).length)return[u,"kelime",`Ünite ${u.n} kelimelerini bitir (${learnedCount(u)}/${allWords(u).length})`];

  if(wc(store.text["u"+u.n]||"")<50)return[u,"yazma",`Ünite ${u.n} writing görevini yaz`];}
  const ek=Object.keys(EX).find(k=>store.exam[k]==null);return ek?[null,ek,`${EX[ek].t} sınavını çöz`]:null;}
function wc(s){return (s.trim().match(/\S+/g)||[]).length;}
